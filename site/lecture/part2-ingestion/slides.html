<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第2部 取り込み</title>
<style>
/* 描画先（舞台）。メインの舞台 #stage のほか、縮小一覧などの描画先にも class sp-target が付く。
   中身の CSS はすべて .sp-target の中だけに効くように書く（CONTRACT §2.5） */
.sp-target {
  position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; color: var(--ink);
  --accent: #0b6bcb; --accent-soft: #e3effb; --ink: #1d2733; --sub: #5b6675; --line: #d3dae3;
  --bg: #f5f7fa; --card: #ffffff; --warn: #d9480f; --warn-soft: #fff1e6; --ok: #2b8a3e; --ok-soft: #e6f4ea;
  --gray-soft: #eef1f5; --code-bg: #0f1720;
}
@supports (color: color-mix(in srgb, red, blue)) {
  .sp-target { --accent-soft: color-mix(in srgb, var(--accent) 12%, #fff); }
}
.sp-target, .sp-target * { box-sizing: border-box; }

.sp-target .hide { visibility: hidden; }
.sp-target .em { color: var(--warn); font-weight: 700; }
.sp-target .em.ok { color: var(--ok); }   /* ++…++：当たり・うまくいく（==…== は外れ・注意の赤） */
.sp-target .b { font-weight: 700; }
.sp-target code, .sp-target .mono { font-family: Menlo, Consolas, monospace; }
/* frame */
.sp-target header { position: absolute; left: 0; right: 0; top: 0; height: 150px; padding: 26px 64px 0; background: #fff; border-bottom: 2px solid var(--line); }
.sp-target header .kick { display: flex; gap: 16px; align-items: center; font-size: 24px; color: var(--sub); }
.sp-target header .chip { background: var(--accent); color: #fff; font-weight: 700; border-radius: 8px; padding: 4px 14px; }
.sp-target header .ref { margin-left: auto; font-size: 22px; color: var(--sub); }
.sp-target header h1 { margin: 10px 0 0; font-size: 44px; line-height: 1.25; font-weight: 800; letter-spacing: .01em; }
.sp-target main { position: absolute; left: 64px; right: 64px; top: 182px; bottom: 92px; display: flex; gap: 40px; }
.sp-target main.below { flex-direction: column; gap: 24px; }
.sp-target .visual { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
.sp-target main.below .visual { flex: 1; min-height: 0; }
.sp-target .side { flex: 0 0 520px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.sp-target main.below .side { flex: 0 0 auto; flex-direction: row; }
.sp-target main.below .side .call { flex: 1; }
.sp-target .call { background: #fff; border-left: 8px solid var(--accent); border-radius: 10px; padding: 18px 24px; font-size: 28px; line-height: 1.5; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.sp-target .call.warn { border-left-color: var(--warn); }
.sp-target .call.ok { border-left-color: var(--ok); }
.sp-target .call ul.cl { margin: 0; padding-left: 1.1em; font-size: 25px; line-height: 1.45; }
.sp-target .call ul.cl li { margin: 4px 0; }
.sp-target .call .ct { font-size: 22px; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
.sp-target footer { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; padding: 0 64px; display: flex; align-items: center; gap: 10px; background: #fff; border-top: 2px solid var(--line); }
.sp-target footer .sec { flex: 1; text-align: center; font-size: 20px; padding: 8px 4px; border-radius: 6px; background: var(--gray-soft); color: #8a94a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-target footer .sec.done { background: var(--accent-soft); color: var(--accent); }
.sp-target footer .sec.on { background: var(--accent); color: #fff; font-weight: 700; }
.sp-target footer .pg { flex: 0 0 110px; text-align: right; font-size: 22px; color: var(--sub); }
/* cover / section */
.sp-target .cover { position: absolute; inset: 0; background: var(--accent); color: #fff; padding: 150px 140px; display: flex; flex-direction: column; }
.sp-target .cover .lab { font-size: 34px; opacity: .85; }
.sp-target .cover h1 { font-size: 92px; margin: 24px 0 18px; line-height: 1.15; font-weight: 800; }
.sp-target .cover .lead { font-size: 38px; opacity: .92; line-height: 1.5; }
.sp-target .cover .meta { margin-top: auto; display: flex; gap: 48px; font-size: 28px; opacity: .85; }
.sp-target .sectionpg { position: absolute; inset: 0; background: #fff; display: flex; align-items: center; padding: 0 160px; gap: 70px; }
.sp-target .sectionpg .no { font-size: 240px; font-weight: 800; color: var(--accent); line-height: 1; }
.sp-target .sectionpg h1 { font-size: 72px; margin: 0 0 22px; }
.sp-target .sectionpg .lead { font-size: 34px; color: var(--sub); line-height: 1.55; }
.sp-target .sectionpg .mins { margin-top: 24px; font-size: 26px; color: var(--accent); }
/* agenda */
.sp-target .agenda { width: 100%; display: flex; flex-direction: column; gap: 16px; }
.sp-target .agenda .it { display: flex; align-items: center; gap: 28px; background: #fff; border-radius: 12px; padding: 20px 30px; border: 2px solid var(--line); }
.sp-target .agenda .it .k { font-size: 40px; font-weight: 800; color: var(--accent); width: 60px; text-align: center; }
.sp-target .agenda .it .t { font-size: 34px; font-weight: 700; }
.sp-target .agenda .it .s { font-size: 24px; color: var(--sub); margin-top: 4px; }
.sp-target .agenda .it .m { margin-left: auto; font-size: 26px; color: var(--sub); white-space: nowrap; }
/* points */
.sp-target .points { width: 100%; display: flex; flex-direction: column; gap: 22px; }
.sp-target .points .p { background: #fff; border-radius: 12px; padding: 22px 30px; font-size: 34px; line-height: 1.45; display: flex; gap: 22px; align-items: flex-start; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.sp-target .points .p .dot { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.sp-target .points .p .sub { display: block; font-size: 26px; color: var(--sub); margin-top: 6px; }
/* compare */
.sp-target .compare { width: 100%; height: 100%; display: flex; gap: 28px; align-items: stretch; }
.sp-target .compare .col { flex: 1; background: #fff; border-radius: 14px; border: 3px solid var(--line); padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.sp-target .compare .col.accent { border-color: var(--accent); }
.sp-target .compare .col.warn { border-color: var(--warn); }
.sp-target .compare .col.ok { border-color: var(--ok); }
.sp-target .compare .col h2 { margin: 0 0 6px; font-size: 36px; }
.sp-target .compare .col.accent h2 { color: var(--accent); }
.sp-target .compare .col.warn h2 { color: var(--warn); }
.sp-target .compare .row { background: var(--gray-soft); border-radius: 10px; padding: 14px 18px; font-size: 29px; line-height: 1.45; }
.sp-target .compare .row .lab { display: block; font-size: 21px; color: var(--sub); font-weight: 700; margin-bottom: 2px; }
.sp-target .cwrap { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 20px; }
.sp-target .verdict { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 16px 24px; font-size: 30px; font-weight: 700; text-align: center; }
/* flow */
.sp-target .flow { width: 100%; display: flex; flex-direction: column; gap: 30px; }
.sp-target .flow-row { display: flex; align-items: center; gap: 12px; }
.sp-target .flow-row .rl { flex: 0 0 150px; font-size: 24px; font-weight: 700; color: var(--accent); text-align: center; }
.sp-target .node { position: relative; flex: 1; min-width: 0; background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 18px 14px; text-align: center; }
.sp-target .node.accent { border-color: var(--accent); background: var(--accent-soft); }
.sp-target .node.warn { border-color: var(--warn); background: var(--warn-soft); }
.sp-target .node.ok { border-color: var(--ok); background: var(--ok-soft); }
.sp-target .node.dim { border-style: dashed; background: var(--gray-soft); color: var(--sub); }
.sp-target .node .t { font-size: 29px; font-weight: 700; line-height: 1.3; }
.sp-target .node .s { font-size: 22px; color: var(--sub); margin-top: 6px; line-height: 1.4; }
.sp-target .node .badge { position: absolute; left: -14px; top: -14px; width: 40px; height: 40px; border-radius: 50%; background: var(--warn); color: #fff; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sp-target .arrow { flex: 0 0 auto; text-align: center; color: var(--accent); min-width: 56px; max-width: 150px; }
.sp-target .arrow .ar { font-size: 40px; line-height: 1; }
.sp-target .arrow .at { font-size: 19px; line-height: 1.3; color: var(--sub); }
.sp-target .banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 16px 24px; font-size: 29px; font-weight: 700; text-align: center; }
.sp-target .banner.info { background: var(--accent-soft); color: var(--accent); }
/* diagram */
.sp-target .diagram { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.sp-target .diagram svg { width: 100%; height: 100%; max-height: 100%; }
.sp-target .diagram svg text { font-family: "Hiragino Sans", sans-serif; }
.sp-target .diagram .cap { font-size: 22px; color: var(--sub); }
/* code */
.sp-target .code { width: 100%; height: 100%; display: flex; flex-direction: column; }
.sp-target .code .file { background: #2a3442; color: #cbd5e1; font-size: 22px; padding: 10px 20px; border-radius: 12px 12px 0 0; font-family: Menlo, monospace; }
.sp-target .code pre { margin: 0; flex: 1; background: var(--code-bg); color: #e6edf3; border-radius: 0 0 12px 12px; padding: 16px 0; font-size: 23px; line-height: 1.5; overflow: hidden; font-family: Menlo, Consolas, monospace; }
.sp-target .code .ln { display: block; padding: 0 20px; white-space: pre; }
.sp-target .code .ln .no { display: inline-block; width: 52px; color: #5f6b7a; text-align: right; margin-right: 18px; }
.sp-target .code .ln.hl { background: rgba(255, 180, 60, .22); box-shadow: inset 6px 0 0 #ffb43c; }
.sp-target .code .ln.dim { opacity: .38; }
/* table */
.sp-target table.tb { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
.sp-target table.tb th { background: var(--accent); color: #fff; font-size: 25px; text-align: left; padding: 14px 18px; }
.sp-target table.tb td { font-size: 26px; padding: 13px 18px; border-top: 1px solid var(--line); line-height: 1.4; vertical-align: top; }
.sp-target table.tb tr.hl td { background: var(--warn-soft); }
.sp-target table.tb tr.hl td:first-child { box-shadow: inset 6px 0 0 var(--warn); }
/* stat */
.sp-target .stat { width: 100%; display: flex; gap: 28px; }
.sp-target .stat .it { flex: 1; background: #fff; border-radius: 16px; padding: 34px 24px; text-align: center; border: 3px solid var(--line); }
.sp-target .stat .it.accent { border-color: var(--accent); }
.sp-target .stat .v { font-size: 92px; font-weight: 800; color: var(--accent); line-height: 1.05; }
.sp-target .stat .it.warn .v { color: var(--warn); }
.sp-target .stat .l { font-size: 30px; font-weight: 700; margin-top: 12px; }
.sp-target .stat .s { font-size: 23px; color: var(--sub); margin-top: 8px; line-height: 1.4; }
/* bars */
.sp-target .bars { width: 100%; height: 100%; display: flex; flex-direction: column; }
.sp-target .bars .area { flex: 1; display: flex; align-items: flex-end; gap: 40px; padding: 0 30px; border-bottom: 3px solid var(--line); }
.sp-target .bars .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.sp-target .bars .bar .val { font-size: 52px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
.sp-target .bars .bar.warn .val { color: var(--warn); }
.sp-target .bars .bar .col { width: 70%; background: var(--accent); border-radius: 10px 10px 0 0; }
.sp-target .bars .bar.warn .col { background: var(--warn); }
.sp-target .bars .bar.dim .col { background: #b8c2cf; }
.sp-target .bars .labels { display: flex; gap: 40px; padding: 12px 30px 0; }
.sp-target .bars .labels div { flex: 1; text-align: center; font-size: 26px; font-weight: 700; }
.sp-target .bars .labels div small { display: block; font-size: 21px; font-weight: 400; color: var(--sub); }
/* quote */
.sp-target .quote { max-width: 1400px; text-align: center; }
.sp-target .quote .q { font-size: 56px; font-weight: 700; line-height: 1.45; }
.sp-target .quote .q::before { content: "“"; color: var(--accent); margin-right: 8px; }
.sp-target .quote .q::after { content: "”"; color: var(--accent); margin-left: 8px; }
.sp-target .quote .by { margin-top: 30px; font-size: 28px; color: var(--sub); }
/* quiz */
.sp-target .quiz { width: 100%; display: flex; flex-direction: column; gap: 22px; }
.sp-target .quiz .qq { font-size: 40px; font-weight: 800; line-height: 1.4; }
.sp-target .quiz .qq::before { content: "Q. "; color: var(--accent); }
.sp-target .quiz .chs { display: flex; flex-direction: column; gap: 14px; }
.sp-target .quiz .ch { background: #fff; border: 3px solid var(--line); border-radius: 12px; padding: 16px 24px; font-size: 31px; }
.sp-target .quiz .ch.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.sp-target .quiz .ch .k { color: var(--accent); font-weight: 800; margin-right: 14px; }
.sp-target .quiz .ex { background: var(--accent-soft); border-radius: 12px; padding: 18px 24px; font-size: 29px; line-height: 1.5; }
.sp-target .quiz .ex::before { content: "答え  "; font-weight: 800; color: var(--accent); }
/* steps */
.sp-target .stepl { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.sp-target .stepl .it { display: flex; gap: 22px; align-items: center; background: #fff; border-radius: 12px; padding: 14px 22px; border: 2px solid var(--line); }
.sp-target .stepl .it .n { flex: 0 0 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.sp-target .stepl .it .t { font-size: 29px; font-weight: 700; }
.sp-target .stepl .it .s { font-size: 22px; color: var(--sub); margin-top: 2px; }
.sp-target .stepl .foot { font-size: 21px; color: var(--sub); padding: 2px 6px; }
.sp-target .stepl .it .cmd { margin-left: auto; font-family: Menlo, monospace; font-size: 23px; background: var(--code-bg); color: #e6edf3; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
/* recap */
.sp-target .recap { width: 100%; display: flex; flex-direction: column; gap: 18px; }
.sp-target .recap .p { display: flex; gap: 20px; align-items: flex-start; font-size: 34px; line-height: 1.45; background: #fff; border-radius: 12px; padding: 20px 28px; }
.sp-target .recap .p::before { content: "✓"; color: var(--ok); font-weight: 800; }
.sp-target .recap .next { margin-top: 10px; font-size: 30px; color: var(--sub); padding: 0 6px; }
.sp-target .recap .next b { color: var(--accent); }

/* run（操作）と output（実測の出力） */
.sp-target .run { width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 20px; }
.sp-target .cmdcard { flex: 0 0 auto; background: var(--code-bg); border-radius: 14px; overflow: hidden; }
.sp-target .cmdcard .rhead { display: flex; align-items: center; gap: 16px; background: #2a3442; color: #cbd5e1; font-size: 22px; padding: 10px 20px; font-family: Menlo, Consolas, monospace; }
.sp-target .cmdcard .rhead .rfile { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-target .lvl { margin-left: auto; flex: 0 0 auto; font-family: "Hiragino Sans", "Meiryo", sans-serif; font-size: 21px; font-weight: 700; line-height: 1.4; border-radius: 999px; padding: 2px 16px; white-space: nowrap; }
.sp-target .lvl.must { background: #2f9e44; color: #fff; }
.sp-target .lvl.demo { background: #ffb43c; color: #1d2733; }
.sp-target .lvl.extra { border: 2px dashed #94a3b8; color: #cbd5e1; padding: 0 14px; }
.sp-target .cmdcard .rcmd { padding: 26px 30px 30px; color: #fff; font-family: Menlo, Consolas, monospace; font-size: 38px; line-height: 1.35; white-space: pre-wrap; word-break: break-all; }
.sp-target .cmdcard .rcmd .ps { color: #7dd3a8; margin-right: 20px; }
.sp-target .term { flex: 0 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; background: #0b1118; border-radius: 14px; overflow: hidden; }
.sp-target .term .thead { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: #2a3442; color: #cbd5e1; font-size: 21px; padding: 10px 20px; }
.sp-target .term .thead .dots i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; background: #ff5f56; }
.sp-target .term .thead .dots i:nth-child(2) { background: #ffbd2e; }
.sp-target .term .thead .dots i:nth-child(3) { background: #27c93f; }
.sp-target .term .thead .tl { margin-left: 8px; }
.sp-target .term .thead .tr { margin-left: auto; font-family: Menlo, Consolas, monospace; font-size: 20px; opacity: .85; }
.sp-target .term pre { margin: 0; flex: 1 1 auto; min-height: 0; padding: 16px 0; font-size: 24px; line-height: 1.5; color: #d5dde6; overflow: hidden; font-family: Menlo, Consolas, monospace; }
.sp-target .term pre.fs-l { font-size: 32px; }
.sp-target .term pre.fs-m { font-size: 28px; }
.sp-target .term .ln { display: block; padding: 0 24px; white-space: pre; }
.sp-target .term .ln.hl { background: rgba(255, 180, 60, .22); box-shadow: inset 6px 0 0 #ffb43c; color: #fff; }
.sp-target .term .ln.dim { opacity: .55; }
.sp-target .term .tcap { flex: 0 0 auto; background: #151f2b; color: #aebbc9; font-size: 22px; line-height: 1.4; padding: 10px 24px; border-top: 1px solid #2a3442; }
.sp-target .term .tcap .em { color: #ffb43c; }
.sp-target .cmdcard .rwhere { padding: 14px 30px 0; font-size: 20px; color: #8b98a8; }
.sp-target .cmdcard .rwhere code { color: #b8c4d2; }
.sp-target .rcheck { flex: 0 0 auto; background: #fff; border-left: 8px solid var(--ok); border-radius: 10px; padding: 14px 24px; font-size: 28px; line-height: 1.5; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.sp-target .rcheck .rk { display: inline-block; font-size: 21px; font-weight: 700; color: var(--ok); margin-right: 14px; }

/* ハンズオン資料で足した部品：kw（キーワードのページ）、全ページ共通の「確かめる」の欄 */
.sp-target main.withchk { bottom: 156px; }
.sp-target main.withsrc { bottom: 124px; }
.sp-target main.withchk.withsrc { bottom: 188px; }
.sp-target .srcnote { position: absolute; left: 64px; right: 64px; bottom: 92px; font-size: 16px; line-height: 1.35; color: var(--sub); opacity: .8; }
.sp-target .srcnote.withchk { bottom: 148px; }
.sp-target .chkbar { position: absolute; left: 64px; right: 64px; bottom: 84px; height: 58px; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: var(--accent-soft); border-left: 8px solid var(--accent); font-size: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-target .chkbar .ck { flex: 0 0 auto; font-weight: 800; color: var(--accent); }
.sp-target .chkbar .tp { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sp-target .chkbar .tp b { color: var(--ink); margin-right: 6px; }
.sp-target .chkbar .tp code { font-size: 20px; color: var(--sub); margin-left: 8px; }
.sp-target .chkbar .nt { flex: 0 0 auto; color: var(--sub); }
.sp-target .kw { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 14px; }
.sp-target .kw .ksub { flex: 0 0 auto; font-size: 28px; color: var(--sub); }
.sp-target .kw .kcols { flex: 1; min-height: 0; display: flex; gap: 28px; font-size: 26px; }
.sp-target .kw .kcol { flex: 1; min-width: 0; background: #fff; border: 2px solid var(--line); padding: 16px 24px; overflow: hidden; }
.sp-target .kw .kcol h2 { margin: 0 0 6px; font-size: 1.15em; color: var(--accent); }
.sp-target .kw .kcol h3 { margin: .55em 0 .15em; font-size: 1em; font-weight: 800; }
.sp-target .kw .kcol h2 + h3 { margin-top: .2em; }
.sp-target .kw .kcol ul { margin: 0; padding-left: 1.1em; line-height: 1.42; }
.sp-target .kw .kcol li { margin: .1em 0; }
.sp-target .kw .kcol code { font-size: .88em; background: var(--gray-soft); padding: 0 .2em; }

/* ?render（動画づくり）のとき、舞台を左上に縮小せずに置く（CONTRACT §3.1。プレイヤーに置き換えても残す） */
.render #stage { left: 0; top: 0; transform: none !important; }
/* 動画の静止画では舞台を左上 (0,0) に置く（約束 v1.1 §3.1）。閲覧用の CSS を消しても残す */
html, body { margin: 0; }

</style>
</head>
<body>
<div id="stage" class="sp-target"></div>
<script>
/* ============================================================
   中身（描画）。プレイヤーとの約束（slide-player/CONTRACT.md §2）の形。

   ============================================================ */

7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1440' y='304' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>出典<\/text><text x='1440' y='346' font-size='26' fill='#1d2733' text-anchor='middle'>ファイル名・ページ<\/text><text x='1440' y='382' font-size='26' fill='#1d2733' text-anchor='middle'>種類：ocr<\/text><path d='M1082 115 L1276 115' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1298,115 1276,127 1276,103' fill='#d9480f'/><path d='M1082 345 L1276 345' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1298,345 1276,357 1276,333' fill='#d9480f'/><text x='1190' y='96' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 出典を残す<\/text><text x='1190' y='326' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 出典を残す<\/text><\/g><g data-step='2'><text x='800' y='496' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ PDF はページが固定されていて、「何ページ」が一番確かめやすい<\/text><\/g><g data-step='3'><text x='800' y='542' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 文字のページと画像のページは混ざる。種類は、ページやチャンクごとに持つ<\/text><\/g><\/svg>", "caption": "文字ありの PDF と画像だけの PDF、出典はページで残す", "notes": "狙い：PDF は「文字があるか、絵だけか」で読み方が変わり、どちらでも出典はファイル名とページで残すと言える。\n話すこと：\n・段階0：文字ありの PDF は、中に文字のデータが入っているのでそのまま取り出せる（インデクサーの標準の取り出しで content に入る）。表は文字を取り出すだけだと行と列がくずれやすいので、表として読み取る処理（Document Layout スキル）を別に通す。画像だけの PDF（スキャンした紙など）は中身が絵なので、OCR で文字を起こす。インデクサーの imageAction を generateNormalizedImages にすると、ページの中の画像が /document/normalized_images に取り出され、OCR スキルに渡せる。読み間違いが出ることがある\n・段階1：出典はどちらもファイル名とページ。種類（text、table、ocr）も付けておくと、OCR の読み間違いがあり得ることが後からわかる。ファイル名とパスは、インデクサーが付ける metadata_storage_name と metadata_storage_path から取れる。ページや種類は、スキルの出力からフィールドに対応づける\n・段階2：PDF はページが固定されているので、「何ページ」が人にとって一番確かめやすい場所\n・段階3：1枚の PDF の中に、文字のページと画像のページが混ざることがある。種類はファイルごとではなく、ページやチャンクごとに持つ\n補足：Document Layout スキルは、見出し、段落、表を読み取り、Markdown などの形で返す。文字ありの PDF と画像だけの PDF のどちらにも使える。入力は元のファイルで、インデクサーの allowSkillsetToReadFileData を true にして渡す。extractionOptions に locationMetadata を指定すると、ページ番号など、内容がどこにあったかの情報も返る。インデックスプロジェクションを使えば、チャンクごとに親の PDF の ID を付けられる。Word と Excel の表の行は、このページでは扱わない\n注意：1つの PDF の中で、文字のページとスキャンのページが混ざることがある。種類はページやチャンクごとに持つ、という点を落とさない", "section": "A", "check": [{"ed": "応用", "no": "15", "name": "Azure の仕組みに置き換える", "dir": "15-azure-indexer"}]}, {"id": "p18", "type": "kw", "title": "PDF や画像をナレッジにする方法の決め方", "sub": "文字を選択できるか、構造を残すか、絵そのものに意味があるか", "cols": [{"title": "一般的な説明", "groups": [{"h": "最初の分かれ道：文字を選択できるか", "items": ["PDF を開いて、マウスで文字を選択できれば、中に文字のデータがあります。そのまま取り出せます。", "選択できなければ、中身は絵です。OCR で文字を起こす必要があります。", "1つのファイルの中で、ページによって答えが変わることがあります（たとえば、途中にスキャンしたページが入っているとき）。"]}, {"h": "2つ目の分かれ道：構造を残す必要があるか", "items": ["本文だけ探せればよいなら、文字を取り出して切るだけで足ります。", "表、見出し、段組みを使って答えたいなら、レイアウトを読み取る処理を通します。", "表をくずすと、「どの行のどの値か」がわからなくなり、答えを間違えやすくなります。"]}, {"h": "3つ目の分かれ道：絵そのものに意味があるか", "items": ["図、写真、グラフに答えが入っているなら、OCR では足りません（OCR が拾うのは絵の中の文字だけです）。", "そのときは、絵の説明文を作る（画像に言葉で説明を付ける）か、絵をそのままベクトルにします。", "絵に意味がなければ、絵は捨てて文字だけで足ります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "文字を選択できる PDF", "items": ["インデクサーが標準で文字を取り出します。", "表や見出しが要るときは、Document Layout スキルを足します。"]}, {"h": "文字を選択できない PDF と画像", "items": ["OCR スキル：絵の中の文字を起こします。", "Document Layout スキル：文字の読み取り（OCR）とあわせて、表や見出しも読み取ります。", "入力が違います。OCR スキルは、インデクサーの `imageAction` で取り出した画像を入力にします。", "Document Layout スキルは、元のファイルそのもの（`allowSkillsetToReadFileData`）を入力にするので、画像の取り出し設定は要りません。"]}, {"h": "絵そのものに意味がある場合", "items": ["GenAI Prompt スキル（GA）：生成 AI に絵の説明文を書かせて、その文を索引に入れます。", "マルチモーダルの埋め込み（Azure Vision のスキルはプレビュー）：絵をそのままベクトルにして、文で絵を探せるようにします。", "Content Understanding スキル（GA）：文書と絵の中身をまとめて取り出します。新しい方の機能です。"]}]}], "kicker": "p.18", "notes": "位置：p.17 の PDF の取り込みの続きで、どの読み方を選ぶかを決める順番のページです。\n言いたいこと：3つの問い（文字を選択できるか、構造を残すか、絵に意味があるか）を順に答えれば、使う処理が決まります。\n気をつけること：\n・OCR は絵の中の文字しか拾わない、という点を言葉ではっきり言ってください。図やグラフの意味までは取れません。\n・GenAI Prompt スキルとマルチモーダルの埋め込みは生成 AI や埋め込みの呼び出しが増えます。", "section": "A", "check": [{"ed": "応用", "no": "14", "name": "種類の違う文書をまとめて取り込む", "dir": "14-mixed-documents"}, {"ed": "応用", "no": "15", "name": "Azure の仕組みに置き換える", "dir": "15-azure-indexer"}]}, {"id": "p18d", "type": "diagram", "title": "PDF や画像をナレッジにする方法は、==3つの問いを順に==答えて決める", "kicker": "p.18", "svg": "<svg viewBox='0 0 1600 500'><g data-step='0'><rect x='20' y='10' width='520' height='120' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='280' y='58' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>問い1<\/text><text x='280' y='102' font-size='30' fill='#1d2733' text-anchor='middle'>文字を選択できるか<\/text><rect x='830' y='10' width='750' height='120' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='862' y='58' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>はい<\/text><text x='982' y='58' font-size='30' fill='#1d2733' text-anchor='start'>そのまま文字を取り出す<\/text><text x='862' y='104' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>いいえ<\/text><text x='982' y='104' font-size='30' fill='#1d2733' text-anchor='start'>OCR で文字を起こす<\/text><path d='M542 70 L806 70' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='828,70 806,82 806,58' fill='#1864ab'/><text x='685' y='52' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 取り出し方<\/text><\/g><g data-step='1'><path d='M280 132 L280 162' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='280,184 268,162 292,162' fill='#5b6675'/><rect x='20' y='186' width='520' height='120' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='280' y='234' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>問い2<\/text><text x='280' y='278' font-size='30' fill='#1d2733' text-anchor='middle'>構造（表、見出し）を残すか<\/text><rect x='830' y='186' width='750' height='120' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='862' y='234' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>はい<\/text><text x='982' y='234' font-size='30' fill='#1d2733' text-anchor='start'>レイアウトを読む処理を通す<\/text><text x='862' y='280' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>いいえ<\/text><text x='982' y='280' font-size='30' fill='#1d2733' text-anchor='start'>文字を取り出して切るだけ<\/text><path d='M542 246 L806 246' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='828,246 806,258 806,234' fill='#d9480f'/><text x='685' y='228' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 構造の扱い<\/text><\/g><g data-step='2'><path d='M280 308 L280 338' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='280,360 268,338 292,338' fill='#5b6675'/><rect x='20' y='362' width='520' height='120' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='280' y='410' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>問い3<\/text><text x='280' y='454' font-size='30' fill='#1d2733' text-anchor='middle'>絵そのものに意味があるか<\/text><rect x='830' y='362' width='750' height='120' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='862' y='410' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>はい<\/text><text x='982' y='410' font-size='30' fill='#1d2733' text-anchor='start'>説明文を作る、または絵をベクトルにする<\/text><text x='862' y='456' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>いいえ<\/text><text x='982' y='456' font-size='30' fill='#1d2733' text-anchor='start'>絵は使わず文字だけ<\/text><path d='M542 422 L806 422' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='828,422 806,434 806,410' fill='#2b8a3e'/><text x='685' y='404' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ 絵の扱い<\/text><\/g><\/svg>", "caption": "問いはページごとに答える。1つのファイルの中で答えが変わることがある", "notes": "狙い：3つの問い（文字を選択できるか、構造を残すか、絵に意味があるか）を順に答えれば、使う処理が決まると言える。\n話すこと：\n・段階0：問い1「文字を選択できるか」。PDF を開いて、マウスで文字を選択できれば、中に文字のデータがあるのでそのまま取り出す。選択できなければ、中身は絵なので OCR で文字を起こす。1つのファイルの中でも、ページによって答えが変わることがある\n・段階1：問い2「構造（表、見出し）を残すか」。表、見出し、段組みを使って答えたいなら、レイアウトを読み取る処理を通す。本文だけ探せればよいなら、文字を取り出して切るだけで足りる。表をくずすと「どの行のどの値か」がわからなくなり、答えを間違えやすい\n・段階2：問い3「絵そのものに意味があるか」。図、写真、グラフに答えが入っているなら、絵の説明文を作るか、絵をそのままベクトルにする。絵に意味がなければ、絵は使わず文字だけで足りる\n補足：Azure AI Search では、問い1の「はい」はインデクサーの標準の取り出し（表や見出しが要るときは Document Layout スキルを足す）。「いいえ」は OCR スキル（入力は、インデクサーの imageAction で取り出した画像）か、Document Layout スキル（文字の読み取りとあわせて表や見出しも読み取る。入力は元のファイルそのもの＝allowSkillsetToReadFileData なので、画像の取り出し設定は要らない）。問い2の「はい」は Document Layout スキル。問い3の「はい」は、GenAI Prompt スキル（GA。生成 AI に絵の説明文を書かせて索引に入れる）、マルチモーダルの埋め込み（Azure Vision のスキルはプレビュー。絵をそのままベクトルにして、文で絵を探せるようにする）、Content Understanding スキル（GA。文書と絵の中身をまとめて取り出す）\n注意：OCR が拾うのは絵の中の文字だけで、図やグラフの意味までは取れない。GenAI Prompt スキルとマルチモーダルの埋め込みは、生成 AI や埋め込みの呼び出しが増える", "section": "A", "check": [{"ed": "応用", "no": "14", "name": "種類の違う文書をまとめて取り込む", "dir": "14-mixed-documents"}, {"ed": "応用", "no": "15", "name": "Azure の仕組みに置き換える", "dir": "15-azure-indexer"}]}, {"id": "p19", "type": "kw", "title": "事業部がインデックスのポリシーを出し、システム側は共通の仕組みだけを持つ", "sub": "PDF、Word、Excel、Outlook のメール、テキストが混ざって置いてある場合", "cols": [{"title": "一般的な説明", "groups": [{"h": "何を分けるか", "items": ["システム側が持つもの：読む、ばらす、切る、索引に入れるという共通の流れと、ファイルの種類ごとの読み方です。", "事業部側が出すもの：何を入れて何を外すか、出典に何を残すか、どの単位で切るか、誰に見せるかです。", "事業部が出したポリシーを、システム側の流れが読んでそのとおりに動きます。こうすれば、事業部が増えても仕組みを作り直さずに済みます。"]}, {"h": "ポリシーに書く項目（例）", "items": ["対象：フォルダ、ファイルの種類、期間、外すもの（下書き、個人のメモなど）。", "出典の欄：ファイルの種類ごとに残す項目です（PDF はページ、Word は見出し、Excel はシートと行、メールは差出人、日付、件名）。", "切り方と付ける情報：見出しで切るか長さで切るか、部署、文書の種類、有効期限などのタグ、見せてよい人の範囲です。"]}, {"h": "全社で揃えるもの", "items": ["共通の欄：出典、種類、部署、更新日、見せてよい人。この欄があれば、どの事業部のデータも同じやり方で絞り込めます。", "事業部ごとの欄：その部署でしか使わない言葉や分類です。共通の欄とは分けて持ちます。", "決める人：項目の意味は事業部が決め、欄の名前と型はシステム側が決めます。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "共通の流れ（システム側）", "items": ["データソースとインデクサー：Blob や SharePoint など、置き場所ごとに作ります。", "スキルセット：ファイルの種類ごとに読み方を切り替えます（OCR、Document Layout、Text Split など）。", "インデックス：共通の欄を持つ1つの形を決めておきます。"]}, {"h": "事業部のポリシーをどう効かせるか", "items": ["対象を絞る：置き場所やフォルダを分け、インデクサーごとに対象を変えます。", "タグを付ける：フィールドの対応付けやスキルで、部署や種類の欄を埋めます。", "見せる範囲：セキュリティフィルター（GA）、または文書ごとの権限を持ち込む機能（プレビュー、p.30）を使います。"]}, {"h": "全社で使う形", "items": ["1つのインデックスにまとめて部署の欄で絞るか、事業部ごとにインデックスを分けるかを選びます。", "Foundry IQ のナレッジベースでは、事業部ごとのインデックスをナレッジソースとして並べられます。", "Outlook のメールは、Azure AI Search の標準のデータソースにはありません。いったん Blob などに書き出すか、別の仕組みで入れることになります。"]}]}], "kicker": "p.19", "notes": "位置：p.16〜p.18 の取り込みを、1つの部署から全社に広げるページです。\n言いたいこと：取り込みの流れはシステム側が1つだけ持ち、何を入れるか、出典に何を残すか、誰に見せるかは事業部がポリシーとして出します。\n気をつけること：\n・ポリシーを読んでインデクサーやスキルセットを作る部分は、Azure AI Search の機能ではなく自分で作る前提です。機能として存在するように聞こえないよう話してください。\n・Outlook のメールは標準のデータソースにない、という点は必ず言ってください。\n・1つのインデックスにまとめるか分けるかは、料金と上限が変わります。ここでは選び方を並べるだけにします。", "section": "A", "check": [{"ed": "応用", "no": "14", "name": "種類の違う文書をまとめて取り込む", "dir": "14-mixed-documents"}]}, {"id": "p19d", "type": "diagram", "title": "事業部が==ポリシーを出し==、システム側は共通の流れだけを持つ", "kicker": "p.19", "svg": "<svg viewBox='0 0 1600 590'><rect x='20' y='25' width='400' height='136' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M44 35 H98 L124 61 V151 H44 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M98 35 V61 H124' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='58' y1='79' x2='110' y2='79' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='97' x2='110' y2='97' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='115' x2='110' y2='115' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='133' x2='110' y2='133' stroke='#c9d6e6' stroke-width='5'/><text x='156' y='89' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>事業部 A の<\/text><text x='156' y='129' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>ポリシー<\/text><rect x='20' y='179' width='400' height='136' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M44 189 H98 L124 215 V305 H44 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M98 189 V215 H124' fill='none' stroke='#5b6675' stroke-width='4'/><li ='middle'>見せてよい人<\/text><g data-step='0'><path d='M422 93 L628 181' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='648,190 623,192 633,170' fill='#1864ab'/><path d='M422 247 L626 247' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='648,247 626,259 626,235' fill='#1864ab'/><path d='M422 401 L628 313' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='648,304 633,324 623,302' fill='#1864ab'/><text x='535' y='230' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 出す<\/text><\/g><g data-step='1'><text x='1430' y='52' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>インデックス<\/text><rect x='1280' y='70' width='300' height='170' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><rect x='1298' y='86' width='264' height='42' rx='10' fill='#fff' stroke='#1864ab' stroke-width='3'/><rect x='1400.0' y='102' width='60' height='10' rx='5' fill='#1864ab'/><rect x='1298' y='136' width='264' height='42' rx='10' fill='#fff' stroke='#1864ab' stroke-width='3'/><rect x='1400.0' y='152' width='60' height='10' rx='5' fill='#1864ab'/><rect x='1298' y='186' width='264' height='42' rx='10' fill='#fff' stroke='#1864ab' stroke-width='3'/><rect x='1400.0' y='202' width='60' height='10' rx='5' fill='#1864ab'/><path d='M1072 155 L1256 155' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1278,155 1256,167 1256,143' fill='#d9480f'/><text x='1175' y='136' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 入れる<\/text><\/g><g data-step='2'><text x='1430' y='290' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='middle'>共通の欄<\/text><text x='1430' y='328' font-size='26' fill='#1d2733' text-anchor='middle'>出典、種類、部署、<\/text><text x='1430' y='364' font-size='26' fill='#1d2733' text-anchor='middle'>更新日、見せてよい人<\/text><text x='1430' y='410' font-size='30' fill='#5b6675' font-weight='700' text-anchor='middle'>事業部ごとの欄<\/text><text x='800' y='520' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ 共通の欄があれば、どの事業部のデータも同じやり方で絞り込める<\/text><\/g><g data-step='3'><text x='800' y='566' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>④ 項目の意味は事業部が決め、欄の名前と型はシステム側が決める<\/text><\/g><\/svg>", "caption": "ポリシーを読んでインデクサーやスキルセットを作る部分は、自分で作る前提", "notes": "狙い：取り込みの流れはシステム側が1つだけ持ち、何を入れるか、出典に何を残すか、誰に見せるかは事業部がポリシーとして出す、と言える。\n話すこと：\n・段階0：事業部 A、B、C がそれぞれポリシーを出す。システム側は、読む、ばらす、切る、索引に入れるという共通の流れと、ファイルの種類ごとの読み方を持つ。ポリシーに書くのは、対象（フォルダ、ファイルの種類、期間、外すもの）、出典の欄（種類ごとに残す項目）、切り方、タグ（部署、文書の種類、有効期限など）、見せてよい人の範囲\n・段階1：システム側の流れが、出されたポリシーを読んでそのとおりに動き、インデックスに入れる。事業部が増えても、仕組みを作り直さずに済む\n・段階2：インデックスの共通の欄（出典、種類、部署、更新日、見せてよい人）があれば、どの事業部のデータも同じやり方で絞り込める。事業部ごとの欄は、その部署でしか使わない言葉や分類で、共通の欄とは分けて持つ\n・段階3：決める人は分かれる。項目の意味は事業部が決め、欄の名前と型はシステム側が決める\n補足：Azure AI Search では、共通の流れは、データソースとインデクサー（Blob や SharePoint など、置き場所ごとに作る）、スキルセット（ファイルの種類ごとに OCR、Document Layout、Text Split などを切り替える）、共通の欄を持つ1つの形のインデックスで作る。ポリシーの効かせ方は、対象を絞るのは置き場所やフォルダを分けてインデクサーごとに変える、タグを付けるのはフィールドの対応付けやスキルで部署や種類の欄を埋める、見せる範囲はセキュリティフィルター（GA）か、文書ごとの権限を持ち込む機能（プレビュー、p.30）。全社では、1つのインデックスにまとめて部署の欄で絞るか、事業部ごとにインデックスを分けるかを選ぶ。Foundry IQ のナレッジベースでは、事業部ごとのインデックスをナレッジソースとして並べられる。Outlook のメールは、Azure AI Search の標準のデータソースにない。いったん Blob などに書き出すか、別の仕組みで入れる\n注意：ポリシーを読んでインデクサーやスキルセットを作る部分は、Azure AI Search の機能ではなく自分で作る前提。機能として存在するように聞こえないよう話す。Outlook のメールは標準のデータソースにない、という点は必ず言う。1つにまとめるか分けるかは、料金と上限が変わる。ここでは選び方を並べるだけにする", "section": "A", "check": [{"ed": "応用", "no": "14", "name": "種類の違う文書をまとめて取り込む", "dir": "14-mixed-documents"}]}, {"id": "p20", "type": "kw", "title": "階層型検索", "sub": "単純な文書の検索と、文書の中の構造の検索", "cols": [{"title": "一般的な説明", "groups": [{"h": "単純な文書の検索", "items": ["1つの文書、または同じ長さで切ったチャンクを、1つの検索の単位にします。", "当たったときは、文書やチャンクがそのまま返ります。", "答えが文書の中のどこにあるかは、読む人が探すことになります。"]}, {"h": "文書の中の構造の検索", "items": ["文書を、章、節、段落、表、表の行のような構造に分け、親と子の関係を持たせます。", "子の単位で探し、当たったら親をたどって「どの文書のどの章か」を返します。", "出典が細かくなり、文脈を足したいときは親の単位を読ませられます。"]}, {"h": "必要になるもの", "items": ["取り込みの「ばらす」の段で、構造を読み取る処理が要ります（p.16）。", "子のチャンクごとに、親の ID と、構造の種類（見出し、表、行）を持たせます。", "構造がくずれた文書（見出しのスタイルがない Word など）では、この方法が使えないことがあります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "構造を読み取る", "items": ["Document Layout スキルで、見出し、段落、表を読み取ります。", "見出しで区切った Markdown を出す設定があり、`markdownHeaderDepth`（h1〜h6。既定は h6）で見出しの深さを指定できます。", "表は、表の構造を残した Markdown として出力に含まれます。表や行を別のチャンクにするには、その出力から分ける処理を自分で足します（p.23）。"]}, {"h": "親子を持つ", "items": ["インデックスプロジェクションで、子のチャンクを別のインデックスに入れ、親のキーを欄に持たせます（p.22）。", "見出しの道筋（例: 「第2章 &gt; 第3条」）を欄として残せます。", "`projectionMode` を `skipIndexingParentDocuments` にすると、親の文書そのものは入れず、子のチャンクだけを入れられます。"]}, {"h": "探し方", "items": ["子のチャンクで探し、構造の種類の欄でフィルターをかけられます（例: 表だけ）。", "親の情報は、親のキーで別に引きます。"]}]}], "kicker": "p.20", "notes": "位置：第2部で、取り込みの順番（p.16〜p.19）を見たあと、「ばらす」の段の使い道を見るページです。p.21〜p.24 で切り方の細かい点に進みます。\n言いたいこと：文書の中の構造を検索の単位にすると、出典が章や表まで下ります。そのためには、取り込みで構造を読み取り、親子の関係を持たせます。\n気をつけること：\n・Azure AI Search に「階層型検索」という名前の機能があるわけではありません。いくつかの機能の組み合わせで作る、と話してください。\n・図の構造は説明用の例です。", "section": "B", "check": []}, {"id": "p20d", "type": "diagram", "title": "階層型検索は、==文書の中の構造==を検索の単位にして、出典を細かくする", "kicker": "p.20", "svg": "<svg viewBox='0 0 1600 620'><text x='290' y='132' font-size='30' fill='#5b6675' font-weight='700' text-anchor='middle'>単純な文書の検索<\/text><rect x='20' y='150' width='540' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M52 188 H112 L138 214 V300 H52 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M112 188 V214 H138' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='66' y1='232' x2='124' y2='232' stroke='#c9d6e6' stroke-width='5'/><line x1='66' y1='250' x2='124' y2='250' stroke='#c9d6e6' stroke-width='5'/><line x1='66' y1='268' x2='124' y2='268' stroke='#c9d6e6' stroke-width='5'/><line x1='66' y1='286' x2='124' y2='286' stroke='#c9d6e6' stroke-width='5'/><text x='170' y='232' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>規程 PDF 1本<\/text><text x='170' y='282' font-size='30' fill='#1d2733' text-anchor='start'>＝ 1つの検索の単位<\/text><g data-step='0'><path d='M290 344 L290 390' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='290,412 278,390 302,390' fill='#d9480f'/><text x='290' y='452' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>① 当たれば文書全体が返る。<\/text><text x='290' y='488' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>答えがどこにあるかは読む人が探す<\/text><\/g><g data-step='1'><text x='1110' y='36' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>文書の中の構造の検索<\/text><rect x='880' y='60' width='460' height='80' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1110' y='112' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>規程 PDF（親）<\/text><rect x='640' y='240' width='260' height='80' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='770' y='292' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>第1章<\/text><rect x='980' y='240' width='260' height='80' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1110' y='292' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>第2章<\/text><rect x='1320' y='240' width='260' height='80' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1450' y='292' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>第3章<\/text><path d='M1110 142 L1110 190 L770 190 L770 216' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='770,238 758,216 782,216' fill='#1864ab'/><path d='M1110 142 L1110 216' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1110,238 1098,216 1122,216' fill='#1864ab'/><path d='M1110 142 L1110 190 L1450 190 L1450 216' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1450,238 1438,216 1462,216' fill='#1864ab'/><text x='856' y='112' font-size='28' fill='#186 る。探すときは、子のチャンクで探し、構造の種類の欄でフィルターをかけられる（例：表だけ）。親の情報は、親のキーで別に引く\n注意：Azure AI Search に「階層型検索」という名前の機能があるわけではない。いくつかの機能の組み合わせで作る、と話す。図の構造は説明用の例。構造がくずれた文書（見出しのスタイルがない Word など）では、この方法が使えないことがある", "section": "B", "check": []}, {"id": "p21", "type": "kw", "title": "チャンクの大きさと重なり", "sub": "どこで切るかで、見つかる文が変わる", "cols": [{"title": "一般的な説明", "groups": [{"h": "大きさ", "items": ["チャンクが大きいと、1つのチャンクにいくつもの話が入り、ベクトルの意味がぼやけます。", "チャンクが小さいと、前後の文脈が消え、1つのチャンクだけでは答えにならないことがあります。", "大きさは、文字の数か、トークンの数で決めます。"]}, {"h": "重なり", "items": ["隣り合うチャンクの境目を、少し重ねて切る方法です。", "「ただし、学長が認めた場合は延長できる」のような、境目をまたぐ文が両方に残ります。", "重ねた分だけ、チャンクの数と保存の量が増えます。"]}, {"h": "切る位置", "items": ["決めた長さで機械的に切る方法と、文や段落の区切りで切る方法があります。", "見出しで切る方法では、話のまとまりごとにチャンクができます（p.24）。", "どれを使うかで、同じ質問への答えが変わることがあります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "Text Split スキル", "items": ["`textSplitMode` で、ページ（決めた長さ）か、文かを選びます。", "`maximumPageLength` でチャンクの長さ（既定は5,000文字。300〜50,000）、`pageOverlapLength` で重なりの長さを決めます。", "長さの単位（`unit`）は、既定が文字です。トークン（`azureOpenAITokens`）で数える設定はプレビューです。"]}, {"h": "Document Layout と組み合わせる", "items": ["Document Layout で見出しごとに区切ってから、Text Split で長すぎる部分を切ります。", "この順番にすると、見出しをまたいだチャンクができにくくなります。", "切ったあとの各チャンクに、見出しの道筋を付けられます。"]}, {"h": "確かめ方", "items": ["同じ質問で、どのチャンクが上位に来るかを比べます。", "決まった正解の長さはないので、評価（p.39〜p.45）で確かめます。"]}]}], "kicker": "p.21", "notes": "位置：第2部で、取り込みの「切る」の段を詳しく見るページです。p.22 の親子チャンクの前提になります。\n言いたいこと：チャンクの大きさと重なりで、見つかる文が変わります。決まった正解の長さはありません。\n気をつけること：\n・どの長さがよいかは言いません。変えたときに何が変わるかだけを見せます。", "section": "B", "check": []}, {"id": "p21d", "type": "diagram", "title": "チャンクは、どこで切るかで==見つかる文が変わる==", "kicker": "p.21", "svg": "<svg viewBox='0 0 1600 580'><rect x='295.8' y='20' width='1008.4000000000001' height='72' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='515.0' y='66' font-size='30' fill='#1d2733' text-anchor='middle'>第3条 休学は1年以内とする。<\/text><text x='780.2' y='66' font-size='30' fill='#1d2733' text-anchor='middle'>ただし、<\/text><text x='885.2' y='66' font-size='30' fill='#1d2733' text-anch const META = DECK.meta || {};

const E = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
// 段階の指定は 0 以上の整数だけ（tools/_common.py の is_step と同じ決まり）。正しくない値は 0（最初から見える）として扱う。
// 正しくない値は tools/build_deck.py が不合格にする
const isStep = v => typeof v === 'number' && Number.isInteger(v) && v >= 0;
const stepOf = v => isStep(v) ? v : 0;
// data-step 属性（文字列）：数字だけの文字列を段階に読む。それ以外は 0
const attrStep = a => /^[0-9]+$/.test(a == null ? '' : String(a)) ? parseInt(a, 10) : 0;
const vis = (o, step) => stepOf(o && o.step) <= step;
const hv = (o, step) => vis(o, step) ? '' : ' hide';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// 描画中のスライドの links。本文の [[ラベル]] を、同じ label を持つ links の位置に結びつける
let LINKS = [];
const linkHtml = lab => {
  const k = LINKS.findIndex(l => l && l.label === lab);
  return k < 0 ? lab : `<span class="lnk" data-link="${k}">${lab}</span>`;
};
// ==強調（赤。外れ・注意）==、++強調（緑。当たり）++、**太字**、`コード`、[[リンク]]。コードの中の [[ ]] はリンクにしない
const fmt = s => s == null ? '' : String(s)
  .replace(/`[^`]*`|\[\[(.+?)\]\]/g, (m, lab) => lab == null ? m : linkHtml(lab))
  .replace(/==(.+?)==/g, '<span class="em">$1</span>')
  .replace(/\+\+(.+?)\+\+/g, '<span class="em ok">$1</span>')
  .replace(/\*\*(.+?)\*\*/g, '<span class="b">$1</span>')
  .replace(/`([^`]+)`/g, '<code>$1</code>');
// 題名などをプレイヤーへ渡すときに、飾りの記法を外す（<br> は空白に）
const plain = s => s == null ? '' : String(s)
  .replace(/<br\s*\/?>/gi, ' ')
  .replace(/\[\[(.+?)\]\]/g, '$1')
  .replace(/==(.+?)==/g, '$1')
  .replace(/\+\+(.+?)\+\+/g, '$1')
  .replace(/\*\*(.+?)\*\*/g, '$1')
  .replace(/`([^`]+)`/g, '$1')
  .trim();

// スライドの中で使われている step の最大値
function maxStep(o) {
  let m = 0;
  const walk = v => {
    if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') { if (isStep(v.step)) m = Math.max(m, v.step); Object.values(v).forEach(walk); }
  };
  walk(o);
  if (o.type === 'quiz') m = Math.max(m, 1);
  if (o.type === 'run') m = Math.max(m, stepOf(o.expectStep), stepOf(o.checkStep));
  if (Array.isArray(o.rowSteps)) o.rowSteps.forEach(x => { m = Math.max(m, stepOf(x)); });
  // SVG は HTML として読む（= の前後の空白、一重・二重・なしの引用符を、ブラウザの読み方で扱う）
  if (o.type === 'diagram' && typeof o.svg === 'string') {
    const t = document.createElement('template');
    t.innerHTML = o.svg;
    t.content.querySelectorAll('[data-step]').forEach(e => { m = Math.max(m, attrStep(e.getAttribute('data-step'))); });
  }
  return m;
}

const LEVEL_BADGE = { must: '全員で実行', demo: '進行役が見せる', extra: '発展' };
const LEVEL_NOTE = { must: '必須（全員で行う）', demo: '進行役が見せる', extra: '発展（時間の合計に入れない）' };

const C = {};

C.agenda = (s, st) => {
  const w = E('div', 'agenda');
  s.items.forEach((it, i) => {
    const d = E('div', 'it' + hv(it, st));
    d.innerHTML = `<div class="k">${esc(it.k || String.fromCharCode(65 + i))}</div><div><div class="t">${fmt(it.t)}</div>${it.s ? `<div class="s">${fmt(it.s)}</div>` : ''}</div>${it.minutes ? `<div class="m">${it.minutes}分</div>` : ''}`;
    w.append(d);
  });
  return w;
};

C.points = (s, st) => {
  const w = E('div', 'points');
  s.items.forEach((it, i) => {
    const d = E('div', 'p' + hv(it, st));
    d.innerHTML = `<div class="dot">${esc(it.k || i + 1)}</div><div>${fmt(it.text)}${it.sub ? `<span class="sub">${fmt(it.sub)}</span>` : ''}</div>`;
    w.append(d);
  });

C.compare = (s, st) => {
  const wrap = E('div', 'cwrap');
  const w = E('div', 'compare');
  s.cols.forEach(col => {
    const c = E('div', 'col ' + (col.tone || '') + hv(col, st));
    c.append(E('h2', '', fmt(col.title)));
    (col.rows || []).forEach(r => c.append(E('div', 'row' + hv(r, st), (r.label ? `<span class="lab">${fmt(r.label)}</span>` : '') + fmt(r.text))));
    w.append(c);
  });
  wrap.append(w);
  if (s.verdict) wrap.append(E('div', 'verdict' + hv(s.verdict, st), fmt(s.verdict.text)));
  return wrap;
};

C.flow = (s, st) => {
  const w = E('div', 'flow');
  (s.rows || [{ nodes: s.nodes, arrows: s.arrows }]).forEach(r => {
    const row = E('div', 'flow-row' + hv(r, st));
    if (r.label) row.append(E('div', 'rl', fmt(r.label)));
    r.nodes.forEach((n, i) => {
      if (i > 0) { const a = (r.arrows || [])[i - 1] || {}; row.append(E('div', 'arrow' + hv(a, st), `<div class="ar">${a.down ? '↓' : '→'}</div><div class="at">${fmt(a.text || '')}</div>`)); }
      const d = E('div', 'node ' + (n.tone || '') + hv(n, st), `${n.badge ? `<div class="badge">${esc(n.badge)}</div>` : ''}<div class="t">${fmt(n.t)}</div>${n.s ? `<div class="s">${fmt(n.s)}</div>` : ''}`);
      if (n.grow) d.style.flex = n.grow;
      row.append(d);
    });
    w.append(row);
  });
  (s.banners || []).forEach(b => w.append(E('div', 'banner ' + (b.tone || '') + hv(b, st), fmt(b.text))));
  return w;
};

C.diagram = (s, st) => {
  const w = E('div', 'diagram');
  const box = E('div', '', s.svg);
  box.style.width = '100%'; box.style.flex = '1'; box.style.minHeight = '0'; box.style.display = 'flex';
  box.querySelectorAll('[data-step]').forEach(el => { if (attrStep(el.getAttribute('data-step')) > st) el.style.visibility = 'hidden'; });
  w.append(box);
  if (s.caption) w.append(E('div', 'cap', fmt(s.caption)));
  return w;
};

C.code = (s, st) => {
  const w = E('div', 'code');
  w.append(E('div', 'file', esc(s.file || '') + (s.lang ? `　<span style="opacity:.6">${esc(s.lang)}</span>` : '')));
  const pre = E('pre');
  const start = s.start || 1;
  const hls = (s.highlight || []).filter(h => vis(h, st));
  const cur = hls.length ? hls[hls.length - 1] : null;
  s.lines.forEach((l, i) => {
    const n = start + i;
    const on = cur && n >= cur.from && n <= cur.to;
    pre.append(E('span', 'ln' + (on ? ' hl' : (cur && s.dimOthers !== false ? ' dim' : '')), `<span class="no">${n}</span>${esc(l)}`));
  });
  w.append(pre);
  return w;
};

C.table = (s, st) => {
  const t = E('table', 'tb');
  const hl = new Set((s.highlight || []).filter(h => vis(h, st)).map(h => h.row));
  t.innerHTML = `<tr>${s.head.map((h, i) => `<th${s.colW ? ` style="width:${s.colW[i]}"` : ''}>${fmt(h)}</th>`).join('')}</tr>` +
    s.rows.map((r, i) => { const step = stepOf((s.rowSteps || [])[i]); return `<tr class="${hl.has(i) ? 'hl' : ''}${step > st ? ' hide' : ''}">${r.map(c => `<td>${fmt(c)}</td>`).join('')}</tr>`; }).join('');
  const w = E('div', ''); w.style.width = '100%'; w.append(t);
  return w;
};

C.stat = (s, st) => {
  const w = E('div', 'stat');
  s.items.forEach(it => w.append(E('div', 'it ' + (it.tone || '') + hv(it, st), `<div class="v">${fmt(it.value)}</div><div class="l">${fmt(it.label)}</div>${it.sub ? `<div class="s">${fmt(it.sub)}</div>` : ''}`)));
  return w;
};

C.bars = (s, st) => {
  const w = E('div', 'bars');
  const area = E('div', 'area'), labels = E('div', 'labels');
  const max = s.max || Math.max(...s.items.map(i => i.value));
  s.items.forEach(it => {
    const ratio = s.invert ? (max - it.value + 1) / max : it.value / max;
    const b = E('div', 'bar ' + (it.tone || '') + hv(it, st));
    b.innerHTML = `<div class="val">${fmt(it.display || it.value)}</div><div class="col" style="height:${Math.max(4, ratio * 78)}%"></div>`;
    area.append(b);
    labels.append(E('div', hv(it, st).trim(), `${fmt(it.label)}${it.sub ? `<small>${fmt(it.sub)}</small>` : ''}`));
  });
  w.append(area, labels);
  return w;
};

C.quote = (s, st) => {

  w.append(E('div', 'q', fmt(s.text)), E('div', 'by', fmt(s.by || '')));

};

C.quiz = (s, st) => {

C.steps = (s, st) => {

// ---- ハンズオン資料で足した部品 ----
// kw：キーワードのページ。cols: [{title, groups: [{h, items: [文字列]}]}]、sub（サブタイトル）。文字はあとで fitKw が枠に収まる大きさに縮める
C.kw = (s, st) => {
  const w = E('div', 'kw');
  if (s.sub) w.append(E('div', 'ksub', fmt(s.sub)));
  const cols = E('div', 'kcols kfit');
  (s.cols || []).forEach(col => {
    const c = E('div', 'kcol');
    c.append(E('h2', '', fmt(col.title)));
    (col.groups || []).forEach(g => {
      if (g.h) c.append(E('h3', '', fmt(g.h)));
      if ((g.items || []).length) c.append(E('ul', '', g.items.map(t => `<li>${fmt(t)}</li>`).join('')));
    });
    cols.append(c);
  });
  w.append(cols);
  return w;
};

// kw の段組みを、どちらの段もはみ出さない文字の大きさに縮める（26px から 17px まで）
function fitKw(stage) {
  stage.querySelectorAll('.kfit').forEach(box => {
    const cols = [...box.querySelectorAll('.kcol')];
    const over = () => cols.some(c => c.scrollHeight > c.clientHeight + 1);
    let fs = 26;
    box.style.fontSize = fs + 'px';
    while (fs > 17 && over()) { fs -= 1; box.style.fontSize = fs + 'px'; }
  });
}

// 「確かめる」の欄：s.check は [{ed, no, name, dir}]、s.checkNote は補足
const chkHtml = s => `<span class="ck">確かめる</span>` +
  s.check.map(c => {
    // トピックが2つ以上並ぶときは、フォルダ名を省いて1行に収める
    const inner = `<b>${esc(c.ed)} ${esc(c.no)}</b>${esc(c.name)}` + (s.check.length > 1 ? '' : `<code>${esc(c.dir)}</code>`);
    return `<span class="tp">${inner}</span>`;
  }).join('<span class="nt">／</span>') +
  (s.checkNote ? `<span class="nt">（${esc(s.checkNote)}）</span>` : '');

// ---- 操作のページ（run）と、実測の出力のページ（output）----
const termHead = (label, right) => `<div class="thead"><span class="dots"><i></i><i></i><i></i></span><span class="tl">${label}</span>${right ? `<span class="tr">${right}</span>` : ''}</div>`;
// 行が少ないときは字を大きくする（8行まで 32px、11行まで 28px、それより多いと 24px）。build_deck.py の幅の見積もりも同じ
const termSize = n => n <= 8 ? ' fs-l' : n <= 11 ? ' fs-m' : '';
const termLines = (lines, cls) => lines.map((l, i) => `<span class="ln${cls ? cls(i + 1) : ''}">${esc(l) || '&nbsp;'}</span>`).join('');

C.run = (s, st) => {
  const w = E('div', 'run');
  const card = E('div', 'cmdcard');
  card.append(E('div', 'rhead', `<span class="rfile">${esc(s.file || '')}</span>${s.level ? `<span class="lvl ${esc(s.level)}">${esc(LEVEL_BADGE[s.level] || s.level)}</span>` : ''}`));
  // where：そのフォルダで最初に打つコマンドの上に、うす字で場所と移り方を出す
  if (s.where) card.append(E('div', 'rwhere', fmt(s.where)));
  card.append(E('div', 'rcmd', `<span class="ps">${esc(s.prompt || 'PS>')}</span><span class="ctext" data-link="${(s.links || []).length}">${esc(s.cmd || '')}</span>`));
  w.append(card);
  w.append(E('div', 'term' + hv({ step: s.expectStep }, st), termHead('実行すると、こう表示される（一部）') + `<pre class="${termSize((s.expect || []).length).trim()}">${termLines(s.expect || [])}</pre>`));
  w.append(E('div', 'rcheck' + hv({ step: s.checkStep }, st), `<span class="rk">確かめること</span>${fmt(s.check)}`));
  return w;
};

C.output = (s, st) => {
  const w = E('div', 'term outp');
  // 光る行：いま見えている highlight のうち、いちばん新しい段階のものだけ。ほかの行は暗くする
  const hls = (s.highlight || []).filter(h => vis(h, st));
  const top = hls.length ? Math.max(...hls.map(h => stepOf(h.step))) : -1;
  const on = new Set(hls.filter(h => stepOf(h.step) === top).map(h => h.line));
  w.innerHTML = termHead('実行すると、こう表示される', s.measure ? `実測の記録：${esc(s.measure)}` : '') +
    `<pre class="${termSize((s.lines || []).length).trim()}">${termLines(s.lines || [], n => on.has(n) ? ' hl' : (hls.length ? ' dim' : ''))}</pre>` +
    `<div class="tcap">${fmt(s.caption)}</div>`;
  return w;
};

// ノートに出す文字列：時間・区分・出典を先頭に、そのあとに notes
function noteText(s) {
  const t = [];
  if (s.minutes != null) t.push(`話す ${s.minutes} 分`);
  if (s.opMinutes != null) t.push(`操作 ${s.opMinutes} 分`);
  if (s.level) t.push(LEVEL_NOTE[s.level] || s.level);
  if (s.ref) t.push(plain(s.ref));
  return (t.length ? t.join('　') + '\n\n' : '') + (s.notes || '（ノートなし）');
}

// プレイヤーへ渡すリンク。run は、コマンドを写す copy リンクを最後に自動で足す（番号は links の長さ。作者の links の番号は変わらない）
const slideLinks = s => {
  const base = s.links || [];
  return s.type === 'run' && typeof s.cmd === 'string' && s.cmd ? base.concat([{ label: 'コマンド', kind: 'copy', text: s.cmd }]) : base;
};

// メインの舞台以外に描いたとき、描いた中の id と、その参照（url(#id)、href="#id"）に描画先ごとの接尾辞を付ける（CONTRACT §2.5）。
// 新しい中身は SVG に id を使わない（build_deck.py が不合格にする）ので、ふだんは何もしない。念のための処理
let TARGET_SEQ = 0;
const TARGET_NO = new WeakMap();
function suffixIds(target) {
  const els = target.querySelectorAll('[id]');
  if (!els.length) return;
  if (!TARGET_NO.has(target)) TARGET_NO.set(target, ++TARGET_SEQ);
  const suf = `-t${TARGET_NO.get(target)}`;
  const ids = new Set([...els].map(e => e.id));
  els.forEach(e => { e.id = e.id + suf; });
  const fix = v => v
    .replace(/url\(\s*(['"]?)#([^)'"\s]+)\1\s*\)/g, (m, q, id) => ids.has(id) ? `url(${q}#${id}${suf}${q})` : m)
    .replace(/^#([^\s]+)$/, (m, id) => ids.has(id) ? `#${id}${suf}` : m);
  target.querySelectorAll('*').forEach(e => {
    for (const a of [...e.attributes]) {
      if (a.name === 'id' || !a.value.includes('#')) continue;
      const nv = fix(a.value);
      if (nv !== a.value) e.setAttribute(a.name, nv);
    }
  });
}

const sectionTitle = id => { const x = (META.sections || []).find(s => s.id === id); return x ? `${x.id}　${x.title}` : ''; };

function draw(i, st, stage) {
  const s = DECK.slides[i];
  stage.replaceChildren();
  stage.style.setProperty('--accent', META.accent || '#0b6bcb');
  if (META.accentSoft) stage.style.setProperty('--accent-soft', META.accentSoft); else stage.style.removeProperty('--accent-soft');
  if (s.type === 'cover') {
    const c = E('div', 'cover');
    c.innerHTML = `<div class="lab">${fmt(s.label || '')}</div><h1>${fmt(s.title)}</h1><div class="lead">${fmt(s.lead || '')}</div><div class="meta">${(s.meta || []).map(m => `<div>${fmt(m)}</div>`).join('')}</div>`;
    stage.append(c);
    return;
  }
  if (s.type === 'section') {
    const c = E('div', 'sectionpg');
    c.innerHTML = `<div class="no">${esc(s.no || '')}</div><div><h1>${fmt(s.title)}</h1><div class="lead">${fmt(s.lead || '')}</div>${s.minutesLabel ? `<div class="mins">${fmt(s.minutesLabel)}</div>` : ''}</div>`;
    stage.append(c);
  } else {
    if (!C[s.type]) throw new Error(`未知の type: ${s.type}（${s.id}）`);
    const h = E('header');
    h.innerHTML = `<div class="kick"><span class="chip">${fmt(META.short || '')}</span><span>${fmt(s.kicker || sectionTitle(s.section) || '')}</span><span class="ref">${fmt(s.ref || '')}</span></div><h1>${fmt(s.title)}</h1>`;
    stage.append(h);
    const callouts = s.callouts || [];
    const hasChk = Array.isArray(s.check) && s.check.length > 0;
    const m = E('main', (s.layout === 'below' ? 'below' : '') + (hasChk ? ' withchk' : '') + (s.source ? ' withsrc' : ''));
    const v = E('div', 'visual');
    v.append(C[s.type](s, st));
    m.append(v);
    if (callouts.length) {
      const side = E('div', 'side');
      // items があれば、体言止めの箇条として出す（折り返しても字下げがそろう）
      callouts.forEach(c => side.append(E('div', 'call ' + (c.tone || '') + hv(c, st), (c.title ? `<div class="ct">${fmt(c.title)}</div>` : '') +
        (c.items ? `<ul class="cl">${c.items.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : fmt(c.text)))));
      m.append(side);
    }
    stage.append(m);
    // source：出典をうす字で小さく（「確かめる」の行の上）
    if (s.source) stage.append(E('div', 'srcnote' + (hasChk ? ' withchk' : ''), '出典：' + fmt(s.source)));
    if (hasChk) stage.append(E('div', 'chkbar', chkHtml(s)));
    fitKw(stage);
  }
  const f = E('footer');
  const secs = META.sections || [];
  const ci = secs.findIndex(x => x.id === s.section);
  secs.forEach((x, k) => f.append(E('div', 'sec' + (k === ci ? ' on' : k < ci ? ' done' : ''), `${esc(x.id)}　${fmt(x.title)}`)));
  f.append(E('div', 'pg', `${i + 1} / ${DECK.slides.length}`));
  stage.append(f);
}

const steps = DECK.slides.map(maxStep);

// render(ref, step, target)：ref は 0 から数えた位置か id。target を省くと #stage
function render(ref, step, target) {
  const i = typeof ref === 'number' ? ref : DECK.slides.findIndex(x => x.id === ref);
  if (!Number.isInteger(i) || i < 0 || i >= DECK.slides.length) throw new Error(`render: スライドがない（${ref}）`);
  const stage = target || document.getElementById('stage');
  stage.classList.add('sp-target');
  const st = Math.max(0, Math.min(steps[i], step | 0));
  LINKS = slideLinks(DECK.slides[i]);
  try { draw(i, st, stage); } finally { LINKS = []; }
  if (stage !== document.getElementById('stage')) suffixIds(stage);
}

const deckId = META.id || `s-${String(META.session || 0).padStart(2, '0')}`;
window.slideDeck = {
  contract: 1,
  info: {
    id: deckId,
    title: plain(META.title),
    label: plain(META.short),
    home: META.home || '../index.html',
    color: META.accent,
    sections: (META.sections || []).map(x => ({ id: x.id, title: plain(x.title) })),
    slides: DECK.slides.map((s, i) => ({
      id: s.id, title: plain(s.title), section: s.section, steps: steps[i],
      notes: noteText(s), minutes: s.minutes, links: slideLinks(s)
    }))
  },
  render
};
// 動画づくり（tools/build_deck.py --check、tools/build_video.py）が使う。?render のときも通常のときも同じ名前で残す
window.renderSlide = (i, st) => render(i, st);
window.deckInfo = () => DECK.slides.map((s, i) => ({ id: s.id, steps: steps[i] }));
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
</script>
<script src="../player.js"></script>
</body>
</html>
