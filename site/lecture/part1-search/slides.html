<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第1部 検索方法</title>
<style>
/* 描画先（舞台）。メインの舞台 #stage のほか、縮小一覧などの描画先にも class sp-target が付く。
   中身の CSS はすべて .sp-target の中だけに効くように書く（プレイヤーとの約束） */
.sp-target {
  position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; color: var(--ink);
  --accent: #0b6bcb; --accent-soft: #e3effb; --ink: #1d2733; --sub: #5b6675; --line: #d3dae3;
  --bg: #f5f7fa; --card: #ffffff; --warn: #d9480f; --warn-soft: #fff1e6; --ok: #2b8a3e; --ok-soft: #e6f4ea;
  --gray-soft: #eef1f5; --code-bg: #0f1720;
}
@supports (color: color-mix(in srgb, red, blue)) {
  .sp-target { --accent-soft: color-mix(in srgb, var(--accent) 12%, #fff); }
}
.sp-target, .sp-target * { box-sizing: border-box; }

.sp-target .hide { visibility: hidden; }
.sp-target .em { color: var(--warn); font-weight: 700; }
.sp-target .em.ok { color: var(--ok); }   /* ++…++：当たり・うまくいく（==…== は外れ・注意の赤） */
.sp-target .b { font-weight: 700; }
.sp-target code, .sp-target .mono { font-family: Menlo, Consolas, monospace; }
/* frame */
.sp-target header { position: absolute; left: 0; right: 0; top: 0; height: 150px; padding: 26px 64px 0; background: #fff; border-bottom: 2px solid var(--line); }
.sp-target header .kick { display: flex; gap: 16px; align-items: center; font-size: 24px; color: var(--sub); }
.sp-target header .chip { background: var(--accent); color: #fff; font-weight: 700; border-radius: 8px; padding: 4px 14px; }
.sp-target header .ref { margin-left: auto; font-size: 22px; color: var(--sub); }
.sp-target header h1 { margin: 10px 0 0; font-size: 44px; line-height: 1.25; font-weight: 800; letter-spacing: .01em; }
.sp-target main { position: absolute; left: 64px; right: 64px; top: 182px; bottom: 92px; display: flex; gap: 40px; }
.sp-target main.below { flex-direction: column; gap: 24px; }
.sp-target .visual { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
.sp-target main.below .visual { flex: 1; min-height: 0; }
.sp-target .side { flex: 0 0 520px; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
.sp-target main.below .side { flex: 0 0 auto; flex-direction: row; }
.sp-target main.below .side .call { flex: 1; }
.sp-target .call { background: #fff; border-left: 8px solid var(--accent); border-radius: 10px; padding: 18px 24px; font-size: 28px; line-height: 1.5; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.sp-target .call.warn { border-left-color: var(--warn); }
.sp-target .call.ok { border-left-color: var(--ok); }
.sp-target .call ul.cl { margin: 0; padding-left: 1.1em; font-size: 25px; line-height: 1.45; }
.sp-target .call ul.cl li { margin: 4px 0; }
.sp-target .call .ct { font-size: 22px; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
.sp-target footer { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; padding: 0 64px; display: flex; align-items: center; gap: 10px; background: #fff; border-top: 2px solid var(--line); }
.sp-target footer .sec { flex: 1; text-align: center; font-size: 20px; padding: 8px 4px; border-radius: 6px; background: var(--gray-soft); color: #8a94a3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-target footer .sec.done { background: var(--accent-soft); color: var(--accent); }
.sp-target footer .sec.on { background: var(--accent); color: #fff; font-weight: 700; }
.sp-target footer .pg { flex: 0 0 110px; text-align: right; font-size: 22px; color: var(--sub); }
/* cover / section */
.sp-target .cover { position: absolute; inset: 0; background: var(--accent); color: #fff; padding: 150px 140px; display: flex; flex-direction: column; }
.sp-target .cover .lab { font-size: 34px; opacity: .85; }
.sp-target .cover h1 { font-size: 92px; margin: 24px 0 18px; line-height: 1.15; font-weight: 800; }
.sp-target .cover .lead { font-size: 38px; opacity: .92; line-height: 1.5; }
.sp-target .cover .meta { margin-top: auto; display: flex; gap: 48px; font-size: 28px; opacity: .85; }
.sp-target .sectionpg { position: absolute; inset: 0; background: #fff; display: flex; align-items: center; padding: 0 160px; gap: 70px; }
.sp-target .sectionpg .no { font-size: 240px; font-weight: 800; color: var(--accent); line-height: 1; }
.sp-target .sectionpg h1 { font-size: 72px; margin: 0 0 22px; }
.sp-target .sectionpg .lead { font-size: 34px; color: var(--sub); line-height: 1.55; }
.sp-target .sectionpg .mins { margin-top: 24px; font-size: 26px; color: var(--accent); }
/* agenda */
.sp-target .agenda { width: 100%; display: flex; flex-direction: column; gap: 16px; }
.sp-target .agenda .it { display: flex; align-items: center; gap: 28px; background: #fff; border-radius: 12px; padding: 20px 30px; border: 2px solid var(--line); }
.sp-target .agenda .it .k { font-size: 40px; font-weight: 800; color: var(--accent); width: 60px; text-align: center; }
.sp-target .agenda .it .t { font-size: 34px; font-weight: 700; }
.sp-target .agenda .it .s { font-size: 24px; color: var(--sub); margin-top: 4px; }
.sp-target .agenda .it .m { margin-left: auto; font-size: 26px; color: var(--sub); white-space: nowrap; }
/* points */
.sp-target .points { width: 100%; display: flex; flex-direction: column; gap: 22px; }
.sp-target .points .p { background: #fff; border-radius: 12px; padding: 22px 30px; font-size: 34px; line-height: 1.45; display: flex; gap: 22px; align-items: flex-start; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.sp-target .points .p .dot { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
.sp-target .points .p .sub { display: block; font-size: 26px; color: var(--sub); margin-top: 6px; }
/* compare */
.sp-target .compare { width: 100%; height: 100%; display: flex; gap: 28px; align-items: stretch; }
.sp-target .compare .col { flex: 1; background: #fff; border-radius: 14px; border: 3px solid var(--line); padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.sp-target .compare .col.accent { border-color: var(--accent); }
.sp-target .compare .col.warn { border-color: var(--warn); }
.sp-target .compare .col.ok { border-color: var(--ok); }
.sp-target .compare .col h2 { margin: 0 0 6px; font-size: 36px; }
.sp-target .compare .col.accent h2 { color: var(--accent); }
.sp-target .compare .col.warn h2 { color: var(--warn); }
.sp-target .compare .row { background: var(--gray-soft); border-radius: 10px; padding: 14px 18px; font-size: 29px; line-height: 1.45; }
.sp-target .compare .row .lab { display: block; font-size: 21px; color: var(--sub); font-weight: 700; margin-bottom: 2px; }
.sp-target .cwrap { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 20px; }
.sp-target .verdict { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 16px 24px; font-size: 30px; font-weight: 700; text-align: center; }
/* flow */
.sp-target .flow { width: 100%; display: flex; flex-direction: column; gap: 30px; }
.sp-target .flow-row { display: flex; align-items: center; gap: 12px; }
.sp-target .flow-row .rl { flex: 0 0 150px; font-size: 24px; font-weight: 700; color: var(--accent); text-align: center; }
.sp-target .node { position: relative; flex: 1; min-width: 0; background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 18px 14px; text-align: center; }
.sp-target .node.accent { border-color: var(--accent); background: var(--accent-soft); }
.sp-target .node.warn { border-color: var(--warn); background: var(--warn-soft); }
.sp-target .node.ok { border-color: var(--ok); background: var(--ok-soft); }
.sp-target .node.dim { border-style: dashed; background: var(--gray-soft); color: var(--sub); }
.sp-target .node .t { font-size: 29px; font-weight: 700; line-height: 1.3; }
.sp-target .node .s { font-size: 22px; color: var(--sub); margin-top: 6px; line-height: 1.4; }
.sp-target .node .badge { position: absolute; left: -14px; top: -14px; width: 40px; height: 40px; border-radius: 50%; background: var(--warn); color: #fff; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.sp-target .arrow { flex: 0 0 auto; text-align: center; color: var(--accent); min-width: 56px; max-width: 150px; }
.sp-target .arrow .ar { font-size: 40px; line-height: 1; }
.sp-target .arrow .at { font-size: 19px; line-height: 1.3; color: var(--sub); }
.sp-target .banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 16px 24px; font-size: 29px; font-weight: 700; text-align: center; }
.sp-target .banner.info { background: var(--accent-soft); color: var(--accent); }
/* diagram */
.sp-target .diagram { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.sp-target .diagram svg { width: 100%; height: 100%; max-height: 100%; }
.sp-target .diagram svg text { font-family: "Hiragino Sans", sans-serif; }
.sp-target .diagram .cap { font-size: 22px; color: var(--sub); }
/* code */
.sp-target .code { width: 100%; height: 100%; display: flex; flex-direction: column; }
.sp-target .code .file { background: #2a3442; color: #cbd5e1; font-size: 22px; padding: 10px 20px; border-radius: 12px 12px 0 0; font-family: Menlo, monospace; }
.sp-target .code pre { margin: 0; flex: 1; background: var(--code-bg); color: #e6edf3; border-radius: 0 0 12px 12px; padding: 16px 0; font-size: 23px; line-height: 1.5; overflow: hidden; font-family: Menlo, Consolas, monospace; }
.sp-target .code .ln { display: block; padding: 0 20px; white-space: pre; }
.sp-target .code .ln .no { display: inline-block; width: 52px; color: #5f6b7a; text-align: right; margin-right: 18px; }
.sp-target .code .ln.hl { background: rgba(255, 180, 60, .22); box-shadow: inset 6px 0 0 #ffb43c; }
.sp-target .code .ln.dim { opacity: .38; }
/* table */
.sp-target table.tb { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
.sp-target table.tb th { background: var(--accent); color: #fff; font-size: 25px; text-align: left; padding: 14px 18px; }
.sp-target table.tb td { font-size: 26px; padding: 13px 18px; border-top: 1px solid var(--line); line-height: 1.4; vertical-align: top; }
.sp-target table.tb tr.hl td { background: var(--warn-soft); }
.sp-target table.tb tr.hl td:first-child { box-shadow: inset 6px 0 0 var(--warn); }
.sp-target .tfoot { margin-top: 18px; padding: 0 6px; font-size: 24px; color: var(--sub); }
/* stat */
.sp-target .stat { width: 100%; display: flex; gap: 28px; }
.sp-target .stat .it { flex: 1; background: #fff; border-radius: 16px; padding: 34px 24px; text-align: center; border: 3px solid var(--line); }
.sp-target .stat .it.accent { border-color: var(--accent); }
.sp-target .stat .v { font-size: 92px; font-weight: 800; color: var(--accent); line-height: 1.05; }
.sp-target .stat .it.warn .v { color: var(--warn); }
.sp-target .stat .l { font-size: 30px; font-weight: 700; margin-top: 12px; }
.sp-target .stat .s { font-size: 23px; color: var(--sub); margin-top: 8px; line-height: 1.4; }
/* bars */
.sp-target .bars { width: 100%; height: 100%; display: flex; flex-direction: column; }
.sp-target .bars .area { flex: 1; display: flex; align-items: flex-end; gap: 40px; padding: 0 30px; border-bottom: 3px solid var(--line); }
.sp-target .bars .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.sp-target .bars .bar .val { font-size: 52px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
.sp-target .bars .bar.warn .val { color: var(--warn); }
.sp-target .bars .bar .col { width: 70%; background: var(--accent); border-radius: 10px 10px 0 0; }
.sp-target .bars .bar.warn .col { background: var(--warn); }
.sp-target .bars .bar.dim .col { background: #b8c2cf; }
.sp-target .bars .labels { display: flex; gap: 40px; padding: 12px 30px 0; }
.sp-target .bars .labels div { flex: 1; text-align: center; font-size: 26px; font-weight: 700; }
.sp-target .bars .labels div small { display: block; font-size: 21px; font-weight: 400; color: var(--sub); }
/* quote */
.sp-target .quote { max-width: 1400px; text-align: center; }
.sp-target .quote .q { font-size: 56px; font-weight: 700; line-height: 1.45; }
.sp-target .quote .q::before { content: "“"; color: var(--accent); margin-right: 8px; }
.sp-target .quote .q::after { content: "”"; color: var(--accent); margin-left: 8px; }
.sp-target .quote .by { margin-top: 30px; font-size: 28px; color: var(--sub); }
/* quiz */
.sp-target .quiz { width: 100%; display: flex; flex-direction: column; gap: 22px; }
.sp-target .quiz .qq { font-size: 40px; font-weight: 800; line-height: 1.4; }
.sp-target .quiz .qq::before { content: "Q. "; color: var(--accent); }
.sp-target .quiz .chs { display: flex; flex-direction: column; gap: 14px; }
.sp-target .quiz .ch { background: #fff; border: 3px solid var(--line); border-radius: 12px; padding: 16px 24px; font-size: 31px; }
.sp-target .quiz .ch.right { border-color: var(--ok); background: var(--ok-soft); font-weight: 700; }
.sp-target .quiz .ch .k { color: var(--accent); font-weight: 800; margin-right: 14px; }
.sp-target .quiz .ex { background: var(--accent-soft); border-radius: 12px; padding: 18px 24px; font-size: 29px; line-height: 1.5; }
.sp-target .quiz .ex::before { content: "答え  "; font-weight: 800; color: var(--accent); }
/* steps */
.sp-target .stepl { width: 100%; display: flex; flex-direction: column; gap: 14px; }
.sp-target .stepl .it { display: flex; gap: 22px; align-items: center; background: #fff; border-radius: 12px; padding: 14px 22px; border: 2px solid var(--line); }
.sp-target .stepl .it .n { flex: 0 0 56px; height: 56px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.sp-target .stepl .it .t { font-size: 29px; font-weight: 700; }
.sp-target .stepl .it .s { font-size: 22px; color: var(--sub); margin-top: 2px; }
.sp-target .stepl .foot { font-size: 21px; color: var(--sub); padding: 2px 6px; }
.sp-target .stepl .it .cmd { margin-left: auto; font-family: Menlo, monospace; font-size: 23px; background: var(--code-bg); color: #e6edf3; padding: 8px 14px; border-radius: 8px; white-space: nowrap; }
/* recap */
.sp-target .recap { width: 100%; display: flex; flex-direction: column; gap: 18px; }
.sp-target .recap .p { display: flex; gap: 20px; align-items: flex-start; font-size: 34px; line-height: 1.45; background: #fff; border-radius: 12px; padding: 20px 28px; }
.sp-target .recap .p::before { content: "✓"; color: var(--ok); font-weight: 800; }
.sp-target .recap .next { margin-top: 10px; font-size: 30px; color: var(--sub); padding: 0 6px; }
.sp-target .recap .next b { color: var(--accent); }

/* run（操作）と output（実測の出力） */
.sp-target .run { width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 20px; }
.sp-target .cmdcard { flex: 0 0 auto; background: var(--code-bg); border-radius: 14px; overflow: hidden; }
.sp-target .cmdcard .rhead { display: flex; align-items: center; gap: 16px; background: #2a3442; color: #cbd5e1; font-size: 22px; padding: 10px 20px; font-family: Menlo, Consolas, monospace; }
.sp-target .cmdcard .rhead .rfile { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-target .lvl { margin-left: auto; flex: 0 0 auto; font-family: "Hiragino Sans", "Meiryo", sans-serif; font-size: 21px; font-weight: 700; line-height: 1.4; border-radius: 999px; padding: 2px 16px; white-space: nowrap; }
.sp-target .lvl.must { background: #2f9e44; color: #fff; }
.sp-target .lvl.demo { background: #ffb43c; color: #1d2733; }
.sp-target .lvl.extra { border: 2px dashed #94a3b8; color: #cbd5e1; padding: 0 14px; }
.sp-target .cmdcard .rcmd { padding: 26px 30px 30px; color: #fff; font-family: Menlo, Consolas, monospace; font-size: 38px; line-height: 1.35; white-space: pre-wrap; word-break: break-all; }
.sp-target .cmdcard .rcmd .ps { color: #7dd3a8; margin-right: 20px; }
.sp-target .term { flex: 0 1 auto; min-height: 0; width: 100%; display: flex; flex-direction: column; background: #0b1118; border-radius: 14px; overflow: hidden; }
.sp-target .term .thead { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; background: #2a3442; color: #cbd5e1; font-size: 21px; padding: 10px 20px; }
.sp-target .term .thead .dots i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; background: #ff5f56; }
.sp-target .term .thead .dots i:nth-child(2) { background: #ffbd2e; }
.sp-target .term .thead .dots i:nth-child(3) { background: #27c93f; }
.sp-target .term .thead .tl { margin-left: 8px; }
.sp-target .term .thead .tr { margin-left: auto; font-family: Menlo, Consolas, monospace; font-size: 20px; opacity: .85; }
.sp-target .term pre { margin: 0; flex: 1 1 auto; min-height: 0; padding: 16px 0; font-size: 24px; line-height: 1.5; color: #d5dde6; overflow: hidden; font-family: Menlo, Consolas, monospace; }
.sp-target .term pre.fs-l { font-size: 32px; }
.sp-target .term pre.fs-m { font-size: 28px; }
.sp-target .term .ln { display: block; padding: 0 24px; white-space: pre; }
.sp-target .term .ln.hl { background: rgba(255, 180, 60, .22); box-shadow: inset 6px 0 0 #ffb43c; color: #fff; }
.sp-target .term .ln.dim { opacity: .55; }
.sp-target .term .tcap { flex: 0 0 auto; background: #151f2b; color: #aebbc9; font-size: 22px; line-height: 1.4; padding: 10px 24px; border-top: 1px solid #2a3442; }
.sp-target .term .tcap .em { color: #ffb43c; }
.sp-target .cmdcard .rwhere { padding: 14px 30px 0; font-size: 20px; color: #8b98a8; }
.sp-target .cmdcard .rwhere code { color: #b8c4d2; }
.sp-target .rcheck { flex: 0 0 auto; background: #fff; border-left: 8px solid var(--ok); border-radius: 10px; padding: 14px 24px; font-size: 28px; line-height: 1.5; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.sp-target .rcheck .rk { display: inline-block; font-size: 21px; font-weight: 700; color: var(--ok); margin-right: 14px; }

/* ハンズオン資料で足した部品：kw（キーワードのページ）、全ページ共通の「確かめる」の欄 */
.sp-target main.withchk { bottom: 156px; }
.sp-target main.withsrc { bottom: 124px; }
.sp-target main.withchk.withsrc { bottom: 188px; }
.sp-target .srcnote { position: absolute; left: 64px; right: 64px; bottom: 92px; font-size: 16px; line-height: 1.35; color: var(--sub); opacity: .8; }
.sp-target .srcnote.withchk { bottom: 148px; }
.sp-target .chkbar { position: absolute; left: 64px; right: 64px; bottom: 84px; height: 58px; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: var(--accent-soft); border-left: 8px solid var(--accent); font-size: 23px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-target .chkbar .ck { flex: 0 0 auto; font-weight: 800; color: var(--accent); }
.sp-target .chkbar .tp { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.sp-target .chkbar .tp b { color: var(--ink); margin-right: 6px; }
.sp-target .chkbar .tp code { font-size: 20px; color: var(--sub); margin-left: 8px; }
.sp-target .chkbar .nt { flex: 0 0 auto; color: var(--sub); }
.sp-target .kw { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 14px; }
.sp-target .kw .ksub { flex: 0 0 auto; font-size: 28px; color: var(--sub); }
.sp-target .kw .kcols { flex: 1; min-height: 0; display: flex; gap: 28px; font-size: 26px; }
.sp-target .kw .kcol { flex: 1; min-width: 0; background: #fff; border: 2px solid var(--line); padding: 16px 24px; overflow: hidden; }
.sp-target .kw .kcol h2 { margin: 0 0 6px; font-size: 1.15em; color: var(--accent); }
.sp-target .kw .kcol h3 { margin: .55em 0 .15em; font-size: 1em; font-weight: 800; }
.sp-target .kw .kcol h2 + h3 { margin-top: .2em; }
.sp-target .kw .kcol ul { margin: 0; padding-left: 1.1em; line-height: 1.42; }
.sp-target .kw .kcol li { margin: .1em 0; }
.sp-target .kw .kcol code { font-size: .88em; background: var(--gray-soft); padding: 0 .2em; }

/* ?render のとき、舞台を左上に縮小せずに置く（静止画を撮る tools/check.py が使う。プレイヤーに置き換えても残す） */
.render #stage { left: 0; top: 0; transform: none !important; }
/* 静止画を撮るときは舞台を左上 (0,0) に置く。閲覧用の CSS を消しても残す */
html, body { margin: 0; }

</style>
</head>
<body>
<div id="stage" class="sp-target"></div>
<script>
/* ============================================================
   中身（描画）。プレイヤー（player.js。slideplay の写し）との約束の形。
   window.slideDeck を作り、window.renderSlide / window.deckInfo を残す。
   ============================================================ */

0 257' fill='none' stroke='#2b8a3e' stroke-width='5' stroke-linejoin='round'/><polygon points='274,240 269,264 251,249' fill='#2b8a3e'/><path d='M196 316 L226 162' fill='none' stroke='#2b8a3e' stroke-width='5' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='230,140 238,164 214,159' fill='#2b8a3e'/><text x='300' y='430' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>③ 質問に近い順に返す<\/text><\/g><\/svg>", "caption": "例え話。料理の甘さと辛さが、埋め込みの数の並びに当たる。料理の数は説明用の例で、右の数の並びは実際に埋め込んだ値", "notes": "狙い：ベクトル検索は、文を数の並びにして意味の近さで探すと言える。そのかわり、固有名詞や型番のちょうど一致は苦手。\n話すこと：\n・段階0：料理を「甘さ」と「辛さ」の2つの数で表すと、似た料理（インドのカレー、四川の麻婆豆腐）が近くに並び、日本の大福は遠くなる\n・段階1：インドのカレーは（甘さ 3、辛さ 7）、四川の麻婆豆腐は（2、9）、日本の大福は（9、1）。1つの料理を2個の数で表している。数は説明用の例\n・段階2：文も同じ。埋め込みモデルが、文を数の並びにする。text-embedding-3-small は、1つの文を1536個の数にする。図の数は、柴田勝家の文を実際に埋め込んだ最初の3個\n・段階3：質問も数の並びにして、近い順に返す。単語が一致しなくても、意味が近ければ見つけられる\n補足：2軸は例え。実際の軸に名前は付いていない。近さの測り方（コサイン類似度など）は p.10、全件で比べるか近似で探すかは p.9\n注意：数の一つひとつに意味はない。使うのは、数の並び全体の向き。結果は埋め込みモデルとチャンクの切り方で大きく変わる。p.1 と同じ例（目が不自由な武将、REQ-042）で、得意と苦手が入れ替わることを見せる", "section": "A", "check": [{"ed": "基礎", "no": "03", "name": "ベクトル検索", "dir": "03-vector-search"}]}, {"id": "p03", "type": "kw", "title": "ハイブリッド検索", "sub": "キーワード検索とベクトル検索を同時に行い、順位を1列にまとめる", "cols": [{"title": "一般的な説明", "groups": [{"h": "何をするものか", "items": ["同じ質問で、キーワード検索（BM25）とベクトル検索を両方行います。", "2つの結果を、1つの順位の列にまとめて返します。"]}, {"h": "なぜ2つを合わせるか", "items": ["BM25 は「REQ-042」のようなそのままの言葉に強く、言い換えに弱い方式です。", "ベクトル検索はその逆で、言い換えに強く、型番や数字のちょうど一致に弱い方式です。", "両方の結果を合わせると、片方だけでは拾えない文書が上位に入ることがあります。"]}, {"h": "まとめ方", "items": ["2つの方式の点数は物差しが違うので、そのまま足せません。", "そのため、点数ではなく順位を使ってまとめる方法（RRF）がよく使われます。", "点数をそろえてから重みを付けて足す方法もあります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "クエリの書き方", "items": ["1回のリクエストに、`search`（キーワード）と `vectorQueries`（ベクトル）の両方を書きます。", "2つは並行して動き、結果は RRF で1列にまとめられます。", "返る `@search.score` は RRF の点数で、BM25 の点数とは別物です。"]}, {"h": "調整できるところ", "items": ["ベクトルのクエリごとに `weight`（既定 1.0、0 より大きい数）を付けて、そのクエリの重みを変えられます。", "フィルターは、キーワード側とベクトル側の両方に効きます。", "件数を決める値は別々です。ベクトル側は `k`（近傍として取る件数）、キーワード側は RRF に渡す件数の上限（プレビューの `maxTextRecallSize`、既定 1,000）、最後に返す件数は `top` です。", "RRF の式の k（p.4）は、どれとも別の定数です。"]}, {"h": "公式の測定", "items": ["Microsoft が公開した測定（2023年。顧客企業のデータセット4つ、NDCG@3）では、キーワード 40.6、ベクトル（Ada-002）43.8、ハイブリッド 48.4 でした。", "測定に使ったデータの言語は公表されていないので、日本語のデータで同じ差になるとは限りません。"]}]}], "kicker": "p.3", "notes": "出典の URL：https://techcommunity.microsoft.com/t5/azure-ai-foundry-blog/azure-ai-search-outperforming-vector-search-with-hybrid/ba-p/3929167\n位置：第1部で、p.1 の BM25 と p.2 のベクトル検索を合わせるページです。まとめ方の中身は次の p.4 の RRF で見ます。\n言いたいこと：ハイブリッド検索は、2つの方式を同時に行い、順位でまとめる方式です。得意なことが逆の2つを合わせる、という順で話します。\n気をつけること：\n・p.1 と p.2 の例（「目が不自由な武将」と「REQ-042」）をここでも使い、両方が上位に来る様子を見せてください。\n・ハイブリッドの @search.score は BM25 の点数と比べられない、という点を落とさないでください。\n・この数字は Microsoft が公開した、顧客企業のデータでの測定です。教材のデータで同じ差が出ると言い切らないでください。", "section": "A", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}], "source": "Microsoft Tech Community「Azure AI Search: Outperforming vector search with hybrid retrieval and reranking」（2023年9月）"}, {"id": "p03d", "type": "diagram", "title": "ハイブリッド検索は、==キーワードとベクトル==を同時に行い、順位を1列にまとめる", "kicker": "p.3", "svg": "<svg viewBox='0 20 1600 540'><circle cx='110' cy='215' r='38' fill='#5b6675'/><path d='M44 375 Q44 275 110 275 Q176 275 176 375 Z' fill='#5b6675'/><text x='110' y='150' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>利用者<\/text><rect x='290' y='40' width='570' height='200' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='575' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>キーワード検索（BM25）<\/text><text x='575' y='150' font-size='30' fill='#1d2733' text-anchor='middle'>そのままの言葉（REQ-042）に強い<\/text><text x='575' y='194' font-size='30' fill='#1d2733' text-anchor='middle'>言い換えに弱い<\/text><rect x='290' y='300' width='570' height='200' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='575' y='352' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ベクトル検索<\/text><text x='575' y='410' font-size='30' fill='#1d2733' text-anchor='middle'>言い換え（目が不自由な武将）に強い<\/text><text x='575' y='454' font-size='30' fill='#1d2733' text-anchor='middle'>型番や数字のちょうど一致に弱い<\/text><rect x='980' y='170' width='180' height='200' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1070' y='222' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>RRF<\/text><text x='1070' y='280' font-size='26' fill='#5b6675' text-anchor='middle'>順位で<\/text><text x='1070' y='318' font-size='26' fill='#5b6675' text-anchor='middle'>まとめる<\/text><rect x='1362' y='170' width='228' height='200' rx='10' fill='#fff' stroke='#2b8a3e' stroke-width='4'/><text x='1476' y='222' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='middle'>順位の列<\/text><text x='1476' y='280' font-size='26' fill='#5b6675' text-anchor='middle'>1列にまとめた<\/text><text x='1476' y='318' font-size='26' fill='#5b6675' text-anchor='middle'>結果<\/text><g data-step='0'><path d='M180 235 L271 155' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='288,140 279,164 264,146' fill='#1864ab'/><path d='M180 295 L272 385' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='288,400 264,393 281,376' fill='#1864ab'/><text x='110' y='430' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 同じ質問を<\/text><text x='110' y='466' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>両方に送る<\/text><\/g><g data-step='1'><path d='M862 140 L961 221' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='978,235 953,230 969,212' fill='#d9480f'/><path d='M862 400 L961 319' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='978,305 969,328 953,310' fill='#d9480f'/><text x='915' y='280' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 順位<\/text><\/g><g data-step='2'><path d='M1162 270 L1338 270' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1360,270 1338,282 1338,258' fill='#2b8a3e'/><text x='1261' y='240' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ まとめる<\/text><\/g><g data-step='3'><text x='890' y='430' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>④ 片方だけでは拾えない文書も、<\/text><text x='890' y='466' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>上位に入ることがある<\/text><text x='890' y='516' font-size='26' fill='#5b6675' text-anchor='start'>返る @search.score は RRF の点数で、<\/text><text x='890' y='550' font-size='26' fill='#5b6675' text-anchor='start'>BM25 の点数とは別物<\/text><\/g><\/svg>", "caption": "得意なことが逆の2つの方式を合わせる。点数は物差しが違うので、順位でまとめる", "notes": "狙い：ハイブリッド検索は、得意なことが逆の2つの方式を同時に行い、順位でまとめる方式だと言える。\n話すこと：\n・段階0：同じ質問を、キーワード検索（BM25）とベクトル検索の両方に送る。1回のリクエストに、search（キーワード）と vectorQueries（ベクトル）の両方を書く\n・段階1：2つは並行して動く。BM25 は「REQ-042」のようなそのままの言葉に強く、言い換えに弱い。ベクトル検索はその逆で、言い換え（「目が不自由な武将」）に強く、型番や数字のちょうど一致に弱い。それぞれが順位を出す\n・段階2：2つの方式の点数は物差しが違うので、そのまま足せない。点数ではなく順位を使って、RRF で1つの列にまとめる（中身は p.4）\n・段階3：両方の結果を合わせると、片方だけでは拾えない文書が上位に入ることがある。返る @search.score は RRF の点数で、BM25 の点数とは別物\n補足：調整できるのは、ベクトルのクエリごとの weight（既定 1.0）。フィルターは、キーワード側とベクトル側の両方に効く。件数を決める値は別々で、ベクトル側は k、キーワード側は RRF に渡す件数の上限（プレビューの maxTextRecallSize、既定 1,000）、最後に返す件数は top。RRF の式の k（p.4）は、どれとも別の定数。Microsoft が公開した測定（2023年。顧客企業のデータセット4つ、NDCG@3）では、キーワード 40.6、ベクトル（Ada-002）43.8、ハイブリッド 48.4\n注意：p.1 と p.2 の例（目が不自由な武将、REQ-042）をここでも使い、両方の結果が上位に入る様子を話す。上の測定は、顧客企業のデータでの測定。教材のデータで同じ差が出ると言い切らない。測定に使ったデータの言語は公表されていないので、日本語で同じ差になるとは限らない", "section": "A", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}], "source": "Microsoft Tech Community「Azure AI Search: Outperforming vector search with hybrid retrieval and reranking」（2023年9月）"}, {"id": "p04", "type": "kw", "title": "RRF（Reciprocal Rank Fusion）", "sub": "点数ではなく順位を使って、いくつかの結果を1列にまとめる", "cols": [{"title": "一般的な説明", "groups": [{"h": "計算のしかた", "items": ["文書ごとに、それぞれの結果の中の順位を見て 1 /（k ＋ 順位）を計算し、足し合わせます。", "k は 60 のような小さな定数がよく使われます。", "結果に出てこなかった方式の分は 0 として数えます。"]}, {"h": "点数を使わない理由", "items": ["BM25 の点数とベクトルの類似度は、範囲も意味も違うので、そのままでは比べられません。", "順位なら、どの方式でも「何番目か」という同じ物差しで扱えます。", "そのかわり、1位と2位の点数の差が大きいか小さいかという情報は使われません。"]}, {"h": "計算の例（説明用の例）", "items": ["文書 A が BM25 で1位、ベクトルで3位なら、1/(60+1) ＋ 1/(60+3) ＝ 約 0.0323 です。", "片方で1位だけの文書は 1/(60+1) ＝ 約 0.0164 なので、両方に出た A の方が上に来ます。", "k が大きいほど、上位と下位の差が小さくなります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "使われる場面", "items": ["ハイブリッド検索で、キーワードとベクトルの結果をまとめるときに使われます。", "複数のベクトルのクエリを1回で投げたときも、RRF でまとめられます。", "利用者が RRF を有効にする設定はなく、これらの検索では自動で使われます。"]}, {"h": "返る点数", "items": ["まとめたあとの `@search.score` は RRF の点数です。", "値は小さく（例のように 0.03 前後）、BM25 の点数とは範囲が違います。", "点数の大きさそのものより、並び順として読むものです。"]}, {"h": "ほかの機能との順番", "items": ["RRF でまとめたあとの上位 50 件を、セマンティックランカーが並べ直します（p.5）。", "式の k は定数で、ベクトル検索の k（近傍として取る件数）とは別のものです。Azure の説明では、60 のような小さな値が最もよく働くとされています。", "リクエストで k を指定する項目は、公式の説明に出てきません。", "ベクトルのクエリに重み（`weight`）を付けた場合は、そのクエリの順位の点に重みを掛けて足します。"]}]}], "kicker": "p.4", "notes": "位置：p.3 のハイブリッド検索の「まとめ方」を詳しく見るページです。次の p.5 のセマンティックランカーは、ここでまとめた結果を受け取ります。\n言いたいこと：RRF は順位だけを使うので、物差しの違う点数を比べずに済みます。両方の結果に出た文書が上に来やすくなります。\n気をつけること：\n・図の数字は説明用の例です。実際の検索結果ではないと言ってください。\n・「点数の差の情報は使わない」という性質は、よい悪いではなく性質として話してください。\n・RRF の k は、ベクトル検索の k（近傍の件数）や top（返す件数）とは別のもの、と言ってください。", "section": "A", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}]}, {"id": "p04d", "type": "diagram", "title": "RRF は、点数でなく==順位==を足して、2つの結果を1列にまとめる", "kicker": "p.4", "svg": "<svg viewBox='0 30 1600 640'><rect x='40' y='40' width='320' height='272' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='200' y='90' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>BM25 の順位<\/text><text x='200' y='126' font-size='26' fill='#5b6675' text-anchor='middle'>（単語の一致の点数）<\/text><text x='80' y='178' font-size='30' fill='#1d2733' text-anchor='start'>1位　文書A<\/text><text x='80' y='218' font-size='30' fill='#1d2733' text-anchor='start'>2位　文書B<\/text><text x='80' y='258' font-size='30' fill='#1d2733' text-anchor='start'>3位　文書C<\/text><text x='80' y='298' font-size='30' fill='#1d2733' text-anchor='start'>4位　文書D<\/text><rect x='40' y='330' width='320' height='272' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='200' y='380' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ベクトルの順位<\/text><text x='200' y='416' font-size='26' fill='#5b6675' text-anchor='middle'>（意味の近さの点数）<\/text><text x='80' y='468' font-size='30' fill='#1d2733' text-anchor='start'>1位　文書C<\/text><text x='80' y='508' font-size='30' fill='#1d2733' text-anchor='start'>2位　文書E<\/text><text x='80' y='548' font-size='30' fill='#1d2733' text-anchor='start'>3位　文書A<\/text><text x='80' y='588' font-size='30' fill='#1d2733' text-anchor='start'>4位　文書F<\/text><g data-step='0'><text x='40' y='650' font-size='28' fill='#d9480f' font-weight='700' text-anchor='start'>① 点数の単位がちがうので、そのまま足せない<\/text><\/g><g data-step='1'><rect x='620' y='40' width='940' height='544' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1090' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>RRF の点数（足し算）<\/text><path d='M362 176 L597 244' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='618,250 594,255 600,232' fill='#1864ab'/><path d='M362 466 L597 381' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='618,374 601,393 593,370' fill='#1864ab'/><text x='490' y='318' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>② 順位だけ使う<\/text><text x='1090' y='140' font-size='26' fill='#5b6675' text-anchor='middle'>点数 ＝ 1 /（k ＋ 順位）、k ＝ 60<\/text><\/g><g data-step='2'><text x='660' y='190' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>③ 文書ごとに足す<\/text><text x='660' y='240' font-size='30' fill='#1d2733' text-anchor='start'>文書A<\/text><text x='880' y='240' font-size='30' fill='#1d2733' text-anchor='start'>1/(60+1) ＋ 1/(60+3) ＝ 0.0323<\/text><text x='660' y='296' font-size='30' fill='#1d2733' text-anchor='start'>文書C<\/text><text x='880' y='296' font-size='30' fill='#1d2733' text-anchor='start'>1/(60+3) ＋ 1/(60+1) ＝ 0.0323<\/text><text x='660' y='352' font-size='30' fill='#1d2733' text-anchor='start'>文書B<\/text><text x='880' y='352' font-size='30' fill='#1d2733' text-anchor='start'>1/(60+2) ＝ 0.0161<\/text><text x='660' y='408' font-size='30' fill='#1d2733' text-anchor='start'>文書E<\/text><text x='880' y='408' font-size='30' fill='#1d2733' text-anchor='start'>1/(60+2) ＝ 0.0161<\/text><text x='660' y='464' font-size='30' fill='#1d2733' text-anchor='start'>文書D、文書F<\/text><text x='880' y='464' font-size='30' fill='#1d2733' text-anchor='start'>1/(60+4) ＝ 0.0156<\/text><\/g><g data-step='3'><rect x='52' y='149' width='296' height='38' rx='8' fill='none' stroke='#2b8a3e' stroke-width='5'/><rect x='52' y='229' width='296' height='38' rx='8' fill='none' stroke='#2b8a3e' stroke-width='5'/><rect x='52' y='439' width='296' height='38' rx='8' fill='none' stroke='#2b8a3e' stroke-width='5'/><rect x='52' y='519' width='296' height='38' rx='8' fill='none' stroke='#2b8a3e' stroke-width='5'/><rect x='640' y='209' width='830' height='42' rx='8' fill='none' stroke='#2b8a3e' stroke-width='5'/><rect x='640' y='265' width='830' height='42' rx='8' fill='none' stroke='#2b8a3e' stroke-width='5'/><text x='1090' y='548' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 両方に出た文書が上に来る<\/text><\/g><\/svg>", "caption": "点数 = 1 /（k + 順位）、k = 60。点数そのものは使わない。文書と数字は説明用の例", "notes": "狙い：RRF は順位だけを使うので、物差しの違う点数を比べずに済み、両方の結果に出た文書が上に来やすくなる、と言える。\n話すこと：\n・段階0：BM25 とベクトル検索が、それぞれ順位を出した。BM25 は単語の一致の点数、ベクトルは意味の近さの点数で、単位が違うのでそのまま足せない\n・段階1：点数は使わず、順位だけを取り出す。式は 1 /（k ＋ 順位）で、k は 60 のような小さな定数\n・段階2：文書ごとに足す。文書A は BM25 で1位、ベクトルで3位なので、1/(60+1) ＋ 1/(60+3) ＝ 約 0.0323。片方でしか出てこない文書は、出てこなかった方式の分を 0 として数える\n・段階3：両方に出た文書（A と C）が、片方だけの文書より上に来る\n補足：Azure AI Search では、この点数が @search.score として返る。値は 0.03 前後と小さく、BM25 の点数とは範囲が違うので、並び順として読む。RRF はハイブリッド検索と、複数のベクトルのクエリをまとめるときに自動で使われ、有効にする設定はない。まとめたあとの上位 50 件を、セマンティックランカーが並べ直す（p.5）。ベクトルのクエリに weight を付けたときは、そのクエリの順位の点に重みを掛けて足す。1位と2位の点数の差が大きいか小さいかという情報は使われない\n注意：図の数字は説明用の例で、実際の検索結果ではない。点数の差の情報を使わないのは、よい悪いではなく性質として話す。RRF の k は、ベクトル検索の k（近傍として取る件数）や top（返す件数）とは別のもの", "section": "A", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}]}, {"id": "p05", "type": "kw", "title": "セマンティックランカー", "sub": "上位の結果を、質問と文の意味の近さで並べ直す", "cols": [{"title": "一般的な説明", "groups": [{"h": "何をするものか", "items": ["一度検索した結果の上位だけを、別のモデルでもう一度採点し、並べ直します。", "このような仕組みは、一般にリランカーと呼ばれます。", "最初の検索で拾えなかった文書は、並べ直しても出てきません。"]}, {"h": "最初の検索との違い", "items": ["最初の検索は、全部の文書から速く候補を集めるための方式です。", "リランカーは、質問と文を一緒に読んで採点するので、件数が少ないときにしか使えません。", "そのため、「広く集める」と「細かく並べる」の2段に分けます。"]}, {"h": "返す情報", "items": ["並べ直した順位と、新しい点数を返します。", "質問に合う文の一部（キャプション）や、短い答え（アンサー）を抜き出す仕組みを持つものもあります。", "文章を新しく作る生成 AI とは別の仕組みです。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "動き方", "items": ["`queryType: semantic` と、使うセマンティック構成を指定します。", "キーワード、ベクトル、ハイブリッドの結果の上位 50 件を並べ直します。", "Microsoft の言語モデル（Bing の技術から来たもの）を使い、利用者がモデルを選ぶことはありません。"]}, {"h": "返るもの", "items": ["`@search.rerankerScore`：0〜4 の点数で、4 が最も合っていることを表します。", "点数の分布は、基盤側の条件やモデルの更新で少し変わることがあります。しきい値を細かくしすぎません。", "キャプションとアンサー：抜き出しで返します。文を新しく作ることはありません。", "セマンティック構成で、タイトル、本文、キーワードに当たるフィールドを指定します。"]}, {"h": "公式の測定と料金の形", "items": ["p.3 の測定（顧客企業のデータセット4つ、NDCG@3）では、ハイブリッドの 48.4 が、セマンティックランカー付きで 60.1 でした。", "料金は2つのプランです。Free（既定）は毎月の無料枠（回数は公式の料金ページ https://azure.microsoft.com/ja-jp/pricing/details/search/）まで使え、使い切ると要求は課金のエラーになります。", "Standard（Basic 以上）は、無料枠を超えた分が使った回数でかかります。検索サービスの層の Free とは別の言葉です。", "エージェント型検索（p.32）も、中でこのランカーを使います。"]}]}], "kicker": "p.5", "notes": "出典の URL：https://techcommunity.microsoft.com/t5/azure-ai-foundry-blog/azure-ai-search-outperforming-vector-search-with-hybrid/ba-p/3929167\n位置：第1部の検索方法の最後の段です。p.3 のハイブリッドと p.4 の RRF でまとめた結果の上に乗ります。\n言いたいこと：セマンティックランカーは、集めた上位 50 件を意味で並べ直す2段目の仕組みです。最初の検索で拾えなかった文書は出てきません。\n気をつけること：\n・セマンティックランカーは生成 AI ではない、という点を言い間違えないでください（p.47 でも同じことを言います）。\n・@search.rerankerScore（0〜4）と @search.score を混ぜないでください。\n・料金の金額や、プランを変える話はしません。", "section": "A", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}], "source": "Microsoft Tech Community「Azure AI Search: Outperforming vector search with hybrid retrieval and reranking」（2023年9月）"}, {"id": "p05d", "type": "diagram", "title": "セマンティックランカーは、前段の==上位50件を並べ直す==", "kicker": "p.5", "svg": "<svg viewBox='0 20 1600 610'><g data-step='0'><rect x='40' y='40' width='460' height='440' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='270' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>前段：ハイブリッドの結果<\/text><text x='270' y='128' font-size='26' fill='#5b6675' text-anchor='middle'>上位50件（一部だけ表示）<\/text><text x='80' y='190' font-size='30' fill='#1d2733' text-anchor='start'>1位　本多忠勝<\/text><text x='80' y='238' font-size='30' fill='#1d2733' text-anchor='start'>6位　石川数正<\/text><text x='80' y='286' font-size='30' fill='#1d2733' text-anchor='start'>8位　服部半蔵<\/text><text x='80' y='334' font-size='30' fill='#1d2733' text-anchor='start'>10位　細川忠興<\/text><text x='80' y='382' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>12位　藤堂高虎<\/text><text x='80' y='428' font-size='30' fill='#5b6675' text-anchor='start'>…<\/text><text x='80' y='462' font-size='26' fill='#2b8a3e' font-weight='700' text-anchor='start'>緑の枠が正解（藤堂高虎）<\/text><rect x='64' y='350' width='420' height='44' rx='8' fill='none' stroke='#2b8a3e' stroke-width='6'/><\/g><g data-step='1'><path d='M504 250 L606 250' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='628,250 606,262 606,238' fill='#1864ab'/><text x='566' y='222' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 渡す<\/text><rect x='630' y='130' width='280' height='240' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='770' y='190' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>セマンティック<\/text><text x='770' y='232' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ランカー<\/text><text x='770' y='292' font-size='26' fill='#5b6675' text-anchor='middle'>質問と本文の意味を<\/text><text x='770' y='328' font-size='26' fill='#5b6675' text-anchor='middle'>読んで並べ直す<\/text><\/g><g data-step='2'><path d='M912 250 L1056 250' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1078,250 1056,262 1056,238' fill='#1864ab'/><text x='995' y='222' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>② 並べ直す<\/text><rect x='1080' y='40' width='480' height='440' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1320' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ランカー後の上位5人<\/text><text x='1112' y='160' font-size='30' fill='#1d2733' text-anchor='start'>1位　細川忠興<\/text><text x='1402' y='160' font-size='26' fill='#5b6675' text-anchor='start'>前段 10位<\/text><text x='1112' y='216' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>2位　藤堂高虎<\/text><text x='1402' y='216' font-size='26' fill='#2b8a3e' font-weight='700' text-anchor='start'>前段 12位<\/text><text x='1112' y='272' font-size='30' fill='#1d2733' text-anchor='start'>3位　本多忠勝<\/text><text x='1402' y='272' font-size='26' fill='#5b6675' text-anchor='start'>前段 1位<\/text><text x='1112' y='328' font-size='30' fill='#1d2733' text-anchor='start'>4位　服部半蔵<\/text><text x='1402' y='328' font-size='26' fill='#5b6675' text-anchor='start'>前段 8位<\/text><text x='1112' y='384' font-size='30' fill='#1d2733' text-anchor='start'>5位　石川数正<\/text><text x='1402' y='384' font-size='26' fill='#5b6675' text-anchor='start'>前段 6位<\/text><rect x='1096' y='184' width='448' height='44' rx='8' fill='none' stroke='#2b8a3e' stroke-width='6'/><\/g><g data-step='3'><rect x='40' y='512' width='460' height='84' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4' stroke-dasharray='14 10'/><text x='270' y='564' font-size='30' fill='#5b6675' text-anchor='middle'>51位以下は、並べ直さない<\/text><text x='540' y='564' font-size='28' fill='#d9480f' font-weight='700' text-anchor='start'>③ 正解がここにいたら、ランカーでも拾えない<\/text><\/g><\/svg>", "caption": "サンプルの武将データでの実行結果（順位は一部だけ表示）。質問：「家康にも秀吉にも仕え、仕える相手を七度も替えたとされる武将は誰ですか。」", "notes": "狙い：セマンティックランカーは、新しい候補を探さず、前段の上位 50 件を意味で並べ直すだけだと言える。最初の検索で拾えなかった文書は、並べ直しても出てこない。\n話すこと：\n・段階0：前段はハイブリッドの結果。質問は「家康にも秀吉にも仕え、仕える相手を七度も替えたとされる武将は誰ですか」。正解の藤堂高虎は12位\n・段階1：ランカーに、上位 50 件を渡す。ランカーは、質問と本文の意味を読んで並べ直す。Microsoft の言語モデルを使い、利用者がモデルを選ぶことはない。文章を新しく作る生成 AI ではない\n・段階2：細川忠興は10位から1位へ、藤堂高虎（正解）は12位から2位へ、本多忠勝は1位から3位へ\n・段階3：51位以下の人は、並べ直されない。正解が前段の上位 50 件に入っていなければ、ランカーでも拾えない\n補足：@search.rerankerScore は 0〜4 の点数で、4 が最も合っていることを表す。@search.score とは別。点数の分布は少し変わることがあるので、しきい値を細かくしすぎない。基礎 04 の ranker.py で、同じ質問の順位を確かめられる\n注意：図の順位は、サンプルの武将データで実行した値で、一部だけを表示している。ランカーの点数の分布は少し変わることがあるので、自分の画面の順位が1〜2位ずれることがある。セマンティックランカーは生成 AI ではない（p.47 でも同じことを言う）。料金の金額や、プランを変える話はしない", "section": "A", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}], "source": "Microsoft Tech Community「Azure AI Search: Outperforming vector search with hybrid retrieval and reranking」（2023年9月）"}, {"id": "p06", "type": "kw", "title": "転置インデックス", "sub": "単語から、その単語を含む文書を引く表", "cols": [{"title": "一般的な説明", "groups": [{"h": "どんな表か", "items": ["本の巻末の索引と同じ形です。単語ごとに、その単語が出てくる文書と場所を並べます。", "文書から単語を見るのではなく、単語から文書を見るので「転置」と呼びます。", "検索のときは、質問の単語で表を引くだけなので、全部の文書を読み直さずに済みます。"]}, {"h": "表を作る手順", "items": ["文書の文を、アナライザーで単語（トークン）に分けます（p.7）。", "分けた単語ごとに、文書の番号、出てくる回数、位置を書き込みます。", "質問も同じ方法で単語に分けてから、表を引きます。"]}, {"h": "点数とのつながり", "items": ["BM25 の出現回数（TF）と珍しさ（IDF）は、この表から計算します。", "位置を持っているので、「休学 届」のような並びでの一致（フレーズ検索）もできます。", "単語の分け方が質問と文書で違うと、表を引いても見つかりません。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "フィールドの属性", "items": ["`searchable` を付けた文字列のフィールドだけが、転置インデックスに入ります。", "`filterable`、`facetable`、`sortable` は、絞り込みや並べ替えのための別の持ち方です。", "`retrievable` は、結果に値を返すかどうかで、検索の対象かどうかとは別です。"]}, {"h": "アナライザーとの関係", "items": ["フィールドごとにアナライザーを決め、そのフィールドの表の作り方が決まります。", "入れる側のアナライザー（`analyzer`、`indexAnalyzer`）は、フィールドを作ったあとには変えられず、作り直しが要ります。探す側（`searchAnalyzer`）だけは、あとから変えられます。", "Analyze API で、文がどう単語に分かれるかを確かめられます。"]}, {"h": "ベクトルの索引との違い", "items": ["ベクトルのフィールドは転置インデックスではなく、HNSW などの別の索引に入ります（p.9）。", "ハイブリッド検索では、2つの索引を同時に引きます。"]}]}], "kicker": "p.6", "notes": "位置：p.1〜p.5 で検索の方法を見たあと、その下にある仕組みに戻るページです。p.7 のアナライザーにつながります。\n言いたいこと：キーワード検索は、単語から文書を引く表を使います。表の作り方は単語の分け方で決まります。\n気をつけること：\n・図の文書と単語は説明用の例です。\n・searchable と retrievable の違いは間違えやすいので、ゆっくり話してください。\n・入れる側のアナライザーを変えるとインデックスの作り直しになります。", "section": "B", "check": [{"ed": "基礎", "no": "01", "name": "キーワード検索", "dir": "01-keyword-search"}]}, {"id": "p06d", "type": "diagram", "title": "転置インデックスは、==単語から、その単語を含む文書==を引く表", "kicker": "p.6", "svg": "<svg viewBox='0 40 1600 520'><rect x='40' y='70' width='380' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='230' y='122' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>文書1<\/text><text x='230' y='178' font-size='30' fill='#1d2733' text-anchor='middle'>伊達政宗は<\/text><text x='230' y='220' font-size='30' fill='#1d2733' text-anchor='middle'>独眼竜と呼ばれた<\/text><rect x='40' y='300' width='380' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='230' y='352' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>文書2<\/text><text x='230' y='408' font-size='30' fill='#1d2733' text-anchor='middle'>武田信玄は<\/text><text x='230' y='450' font-size='30' fill='#1d2733' text-anchor='middle'>甲斐の武将<\/text><g data-step='1'><path d='M422 165 L687 234' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='708,240 684,246 690,223' fill='#1864ab'/><path d='M422 395 L687 335' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='708,330 689,347 684,323' fill='#1864ab'  た」のままでした。どちらがよいかは、自分のデータを Analyze API で分けて比べて決めます。"]}, {"h": "設定のしかた", "items": ["フィールドの `analyzer` で、入れるときと探すときの両方を決めます。", "入れるときと探すときで変えたいときは、`analyzer` を空にして、`indexAnalyzer` と `searchAnalyzer` を別々に指定します。", "ただし、`ja.lucene`・`ja.microsoft` のような言語アナライザーは、この2つでは指定できません。`analyzer` にだけ指定して、入れるときと探すときの両方に同じものを使います。", "トークナイザーとフィルターを組み合わせたカスタムアナライザーも作れます。"]}, {"h": "確かめ方", "items": ["Analyze API に文とアナライザー名を送ると、どう分かれたかが返ります。", "教材の例（「東京都庁で働く」）で3つのアナライザーを比べると、違いが見えます。", "ベクトル検索は、アナライザーの影響を受けません。"]}]}], "kicker": "p.7", "notes": "位置：p.6 の転置インデックスの「表の作り方」を、日本語に当てはめたページです。p.1 の BM25 の「日本語では区切り方で結果が変わる」の続きです。\n言いたいこと：日本語では、どのアナライザーを選ぶかで単語の分け方が変わり、見つかる文書も変わります。\n気をつけること：\n・図の分け方は説明用の例で、実際の出力を写したものではありません。実際の分かれ方は、基礎 02 の Analyze API で見ます。\n・どのアナライザーがよいかは言いません。分け方の違いだけを見せます。", "section": "B", "check": [{"ed": "基礎", "no": "02", "name": "言い換えと日本語の分かれ方", "dir": "02-analyzers-synonyms"}, {"ed": "基礎", "no": "01", "name": "キーワード検索", "dir": "01-keyword-search"}]}, {"id": "p07d", "type": "diagram", "title": "アナライザーが変わると、==日本語の単語の分け方==が変わる", "kicker": "p.7", "svg": "<svg viewBox='0 20 1600 580'><rect x='40' y='185' width='330' height='170' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='205' y='237' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>元の文<\/text><text x='205' y='285' font-size='30' fill='#1d2733' text-anchor='middle'>東京都庁で<\/text><text x='205' y='327' font-size='30' fill='#1d2733' text-anchor='middle'>働く<\/text><text x='205' y='400' font-size='26' fill='#5b6675' text-anchor='middle'>索引を作るときと<\/text><text x='205' y='434' font-size='26' fill='#5b6675' text-anchor='middle'>検索するときに<\/text><text x='205' y='468' font-size='26' fill='#5b6675' text-anchor='middle'>同じ分け方をする<\/text><rect x='620' y='30' width='940' height='160' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1090' y='80' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>standard.lucene<\/text><rect x='620' y='210' width='940' height='160' rx='10 方は Analyze API の出力", "notes": "狙い：日本語では、どのアナライザーを選ぶかで単語の分け方が変わり、見つかる文書も変わる、と言える。\n話すこと：\n・段階0：元の文「東京都庁で働く」を、既定の standard.lucene で分けると、1文字ずつに近い分け方になる\n・段階1：ja.lucene は形態素解析（辞書を使って、意味のある単位で分ける）。東京 / 都庁 / 働く\n・段階2：ja.microsoft も形態素解析。この文では、ja.lucene と同じ分け方になる\n・段階3：アナライザーが変わると、単語の分け方が変わる。分け方が変わると、見つかる文書も変わる\n補足：索引を作るときと検索するときに、同じ分け方をする（analyzer で両方を決める。ja.lucene・ja.microsoft のような言語アナライザーは、indexAnalyzer・searchAnalyzer では指定できない）。分けた結果は Analyze API で確かめられる。ベクトル検索は、アナライザーの影響を受けない\n注意：どのアナライザーがよいかは言わず、分け方の違いだけを見せる。図の分け方は、このサンプルのインデックスで Analyze API を呼んだ出力。文によっては、ja.lucene と ja.microsoft の分け方が違うことがある。ほかの言葉の分かれ方は、基礎 02 の Analyze API で見る", "section": "B", "check": [{"ed": "基礎", "no": "02", "name": "言い換えと日本語の分かれ方", "dir": "02-analyzers-synonyms"}, {"ed": "基礎", "no": "01", "name": "キーワード検索", "dir": "01-keyword-search"}]}, {"id": "p08", "type": "kw", "title": "埋め込みのモデルと次元数", "sub": "文を、決まった長さの数の並びにする", "cols": [{"title": "一般的な説明", "groups": [{"h": "埋め込みとは", "items": ["文を、決まった個数の数の並び（ベクトル）に変える処理です。", "意味の近い文は、近いベクトルになるように作られています。", "並びの個数を次元数と呼びます。"]}, {"h": "モデルと次元数", "items": ["次元数はモデルで決まります（例: text-embedding-3-small は 1536、text-embedding-3-large は 3072）。", "text-embedding-3 の系統では、`dimensions` の指定で短いベクトルを出させることもできます。", "次元数が大きいほど、保存の量と計算の量が増えます。"]}, {"h": "守る決まり", "items": ["文書と質問は、同じモデル（同じ次元数）でベクトルにします。", "モデルを変えたときは、すべての文書をベクトルにし直します。", "言語や分野によって、モデルごとの得意不得意があります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "フィールドの定義", "items": ["ベクトルのフィールドに `dimensions` を書き、モデルの出力と同じ数にします（1つのフィールドで 4096 まで）。", "型は `Collection(Edm.Single)` などで、小さい型を選ぶと保存の量が減ります。", "数が合わないと、文書を入れるときにエラーになります。"]}, {"h": "モデルとのつなぎ方", "items": ["取り込み：埋め込みのスキル（Azure OpenAI など）で、チャンクをベクトルにします。", "検索：ベクトライザーで、質問を同じモデルでベクトルにします（p.28）。", "自分でベクトルにしてから、値をそのまま入れることもできます。"]}, {"h": "保存の量を減らす機能", "items": ["量子化で、インデックスの中のベクトルを小さくして持てます（スカラーは約4分の1、バイナリは最大で約28分の1）。", "`retrievable` は、結果にベクトルを返すかどうかで、既定は返しません。", "`stored` は、返却などに使う元のベクトルのコピーをディスクに残すかどうかです。`false` にすると保存量を最大で約半分にできます。検索には影響しませんが、フィールドを作るときにだけ指定でき、 0' height='88' rx='10' fill='none' stroke='#1864ab' stroke-width='8'/><path d='M922 200 L1056 200' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1078,200 1056,212 1056,188' fill='#2b8a3e'/><text x='1000' y='174' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>② 広げる<\/text><\/g><g data-step='2'><text x='800' y='452' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>③ 表に書いた言い換えしか広がらない。表を足したら、どの質問に効いたかを確かめる<\/text><\/g><\/svg>", "caption": "ベクトル検索を使わずに、BM25 の言い換えの弱さを補う方法の1つ。「独眼竜」「学割」の例は説明用", "notes": "狙い：同義語マップは、人が書いた表で言い換えを広げる仕組みで、表に書いたものしか広がらない、と言える。\n話すこと：\n・段階0：利用者が「独眼竜」と質問する。同義語マップは、言い換えを書いておく表。書き方は2種類。「独眼竜, 伊達政宗」は同じ意味として扱う（どちらで探しても両方を探す）。「学割 => 学生割引」は片方向の置き換え（「学割」を「学生割引」に置き換える）\n・段階1：質問に表の言葉が出てくると、言い換えも一緒に探す。「独眼竜」は「独眼竜 または 伊達政宗」になる。質問の側で広げるので、文書を入れ直す必要はない\n・段階2：表に書いた言い換えしか広がらない。広げすぎると関係のない文書も当たる。表を足したら、どの質問に効いたかを確かめる\n補足：Azure AI Search では、synonymMaps に Solr の形式で表を書いて登録する。同義語マップはインデックスとは別の部品。フィールドの定義の synonymMaps にマップの名前を書いて結び付け、結び付けたフィールドを検索するときだけ効く（結び付けはインデックスを作り直さずに変えられる）。ベクトル検索、フィルター、ファセット、オートコンプリートには効かない。表の言葉も、結び付けたフィールドと同じアナライザーで分けられてから使われる。作れる数は層で違い（Free と Basic は3つ、S1 は5つ、S2 は10、S3 は20）、1つのマップに書ける規則は Free で 5,000、ほかの層で 20,000 まで。1つの規則に書ける言い換えは20まで\n注意：どちらの方法がよいかは言わない。表で補う方法と意味で探す方法（p.2）の違いだけを見せる", "section": "C", "check": [{"ed": "基礎", "no": "02", "name": "言い換えと日本語の分かれ方", "dir": "02-analyzers-synonyms"}]}, {"id": "t01", "type": "compare", "section": "C", "title": "Azure で順位を==調整する==方法", "cols": [{"title": "上げる", "tone": "ok", "rows": [{"text": "欄の重み（スコアリングプロファイル）"}, {"text": "タグ・数値・新しさの関数"}, {"text": "語の重み `語^3`"}]}, {"title": "下げる・外す", "tone": "warn", "rows": [{"text": "Vertex の bury のような、負の値での指定は載っていない"}, {"text": "語の重みを1未満に `語^0.2`"}, {"text": "確実に外すならフィルター `$filter`"}]}, {"title": "広げる・無視する", "rows": [{"text": "同義語マップで、検索語の言い換えを広げる"}, {"text": "ストップワードで無視する（作り直しが要る）"}]}], "verdict": {"text": "下げるときは「他を上げる」「軽く見る」「外す」で近づける"}, "check": [{"ed": "基礎", "no": "02", "name": "言い換えと日本語の分かれ方", "dir": "02-analyzers-synonyms"}], "checkNote": "発展：順位の調整", "callouts": [], "notes": "言いたいこと：Azure AI Search で順位を上げる手段はいくつかあるが、Vertex の bury のように、負の値で下げる指定は公式資料に載っていない。ブーストの値は正の数で 1.0 以外。\n・下げることは、語の重みを 0〜1 にする、他方を上げる、フィルターで外す、で近づける。\n・除外の落とし穴：-語 で除外すると、本文にその語を含む別の文書まで外れる（小早川隆景と秀秋の例）。確実に外すならフィルター。\n1 未満の重みでどれだけ順位が下がるかは、データと質問で変わる。基礎 02 の発展で確かめる。"}, {"id": "t02", "type": "compare", "section": "C", "title": "Vertex AI Search との==違い==", "cols": [{"title": "Vertex AI Search", "rows": [{"text": "ルールをサービスに登録すると、自動で効く"}, {"text": "boost は -1〜1。負の値で下げる（bury）"}, {"text": "検索語や期間の条件を付けられる"}]}, {"title": "Azure AI Search", "tone": "accent", "rows": [{"text": "アナライザーと同義語マップは、フィールドに設定しておくと、検索のたびに自動で効く"}, {"text": "スコアリングプロファイルは、検索のときにアプリが指定する（既定を決めておくこともできる）"}, {"text": "転送・固定位置・関連付けしない語は、公式資料に当たる設定が載っておらず、アプリ側で作る"}]}], "verdict": {"text": "Azure では「ルールを足す」より「インデックスの設定と検索の書き方を変える」"}, "check": [{"ed": "基礎", "no": "02", "name": "言い換えと日本語の分かれ方", "dir": "02-analyzers-synonyms"}], "checkNote": "発展：順位の調整", "notes": "言いたいこと：Vertex は、ルールをサービスに登録しておくと、条件に合う検索で自動で効く。Azure は、アナライザーと同義語マップをフィールドの設定としてインデックスに入れておく（検索のたびに自動で効く）。スコアリングプロファイルもインデックスに入れておき、検索のリクエストで名前を指定する（既定のプロファイルを決めることもできる）。\n・Vertex の一般の文書検索向けは、2026-04-22 に Agent Search に改称された（リリースノート）。関連付けしない語（do not associate）は、確認できた範囲では EC 向けの資料にだけある。\n・Azure の公式資料に当たる設定が載っていないもの：関連付けしない語、redirect、promote、pin（固定位置）、期間つきの自動適用。\n2026年11月時点の公式資料にもとづく。"}, {"id": "p14", "type": "kw", "title": "質問の種類と検索方法の向き不向き", "sub": "同じ検索方法でも、質問の種類で結果が変わる", "cols": [{"title": "一般的な説明", "groups": [{"h": "質問の種類", "items": ["そのままの言葉で探す質問：型番、ID、固有名詞（例: 「REQ-042」）。", "意味で探す質問：言い換えや説明で探す質問（例: 「目が不自由な武将」）。", "いくつかの事実をつなぐ質問：2つ以上の文書を合わせないと答えられない質問（例: 「A社の社長が提携している会社」）。"]}, {"h": "検索方法との関係", "items": ["キーワード検索は、そのままの言葉で探す質問に向いています。", "ベクトル検索は、意味で探す質問に向いています。", "いくつかの事実をつなぐ質問は、1回の検索ではどちらも見つけにくくなります。"]}, {"h": "組み合わせ", "items": ["ハイブリッド検索は、最初の2種類の両方を1回で扱います。", "セマンティックランカーは、集めた上位の並び順を変えます。", "事実をつなぐ質問には、質問を分ける方法（p.32）や、関係をたどる方法（p.31、p.33）があります。"]}]}, {"title": "Azure AI Search での説明", "groups": [{"h": "そのままの言葉", "items": ["BM25 のフルテキスト検索と、`filterable` のフィールドでのフィルターが使えます。", "アナライザーの分け方で、ID の区切りが変わることがあります。"]}, {"h": "意味で探す", "items": ["ベクトル検索とセマンティックランカーが使えます。", "ハイブリッドにすると、キーワードの一致も残ります。"]}, {"h": "事実をつなぐ", "items": ["エージェント型検索で、質問をいくつかの検索に分けられます。", "関係をたどる機能（グラフ RAG）は、Azure AI Search の検索そのものにはありません（プレビューの Fabric Ontology をナレッジソースにする方法は p.31）。"]}]}], "kicker": "p.14", "notes": "位置：第1部の検索方法を一通り見たあとで、質問の種類から並べ直すページです。第3部（p.31〜p.38）につなぎます。\n言いたいこと：どの検索方法が合うかは、質問の種類で変わります。事実をつなぐ質問は、1回の検索では扱いにくい種類です。\n気をつけること：\n・どの方法がよいかは言いません。質問の種類ごとの向き不向きを並べるだけにします。\n・「A社の社長」の例は第3部の例と同じものを使ってください。", "section": "D", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}]}, {"id": "p14d", "type": "diagram", "title": "検索方法の向き不向きは、==質問の種類==で変わる", "kicker": "p.14", "svg": "<svg viewBox='0 0 1600 580'><rect x='20' y='20' width='500' height='172' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='44' y='66' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>そのままの言葉で探す質問<\/text><text x='44' y='106' font-size='26' fill='#5b6675' text-anchor='start'>型番、ID、固有名詞<\/text><text x='44' y='138' font-size='26' fill='#5b6675' text-anchor='start'>例：「REQ-042」<\/text><rect x='20' y='212' width='500' height='172' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='44' y='258' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>意味で探す質問<\/text><text x='44' y='298' font-size='26' fill='#5b6675' text-anchor='start'>言い換えや説明で探す質問<\/text><text x='44' y='330' font-size='26' fill='#5b6675' text-anchor='start'>例：「目が不自由な武将」<\/text><rect x='20' y='404' width='500' height='172' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='44' y='450' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>いくつかの事実をつなぐ質問<\/text><text x='44' y='490' font-size='26' fill='#5b6675' text-anchor='start'>2つ以上の文書を合わせないと<\/text><text x='44' y='522' font-size='26' fill='#5b6675' text-a 0f' font-weight='700' text-anchor='middle'>見つけにくい<\/text><\/g><g data-step='3'><path d='M1156 46 H1172 V358 H1156' fill='none' stroke='#2b8a3e' stroke-width='5'/><text x='1196' y='140' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>④ ハイブリッド検索<\/text><text x='1196' y='178' font-size='26' fill='#5b6675' text-anchor='start'>上の2つの両方を<\/text><text x='1196' y='212' font-size='26' fill='#5b6675' text-anchor='start'>1回で扱う<\/text><text x='1196' y='262' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>セマンティックランカー<\/text><text x='1196' y='300' font-size='26' fill='#5b6675' text-anchor='start'>集めた上位の並び順を<\/text><text x='1196' y='334' font-size='26' fill='#5b6675' text-anchor='start'>変える<\/text><\/g><\/svg>", "caption": "同じ検索方法でも、質問の種類で結果が変わる", "notes": "狙い：どの検索方法が合うかは質問の種類で変わり、事実をつなぐ質問は1回の検索では扱いにくい種類だと言える。\n話すこと：\n・段階0：そのままの言葉で探す質問（型番、ID、固有名詞。例「REQ-042」）には、キーワード検索が向いている\n・段階1：意味で探す質問（言い換えや説明で探す。例「目が不自由な武将」）には、ベクトル検索が向いている\n・段階2：いくつかの事実をつなぐ質問（2つ以上の文書を合わせないと答えられない。例「A社の社長が提携している会社」）は、1回の検索ではどちらの方法でも見つけにくい。質問を分ける方法（p.32）や、関係をたどる方法（p.31、p.33）がある\n・段階3：ハイブリッド検索は、最初の2種類の両方を1回で扱う。セマンティックランカーは、集めた上位の並び順を変える\n補足：Azure AI Search では、そのままの言葉には BM25 のフルテキスト検索と、filterable のフィールドでのフィルターが使える。アナライザーの分け方で、ID の区切りが変わることがある。意味で探すにはベクトル検索とセマンティックランカーが使え、ハイブリッドにするとキーワードの一致も残る。事実をつなぐ質問には、エージェント型検索で質問をいくつかの検索に分けられる。関係をたどる機能（グラフ RAG）は Azure AI Search の検索そのものにはない（プレビューの Fabric Ontology をナレッジソースにする方法は p.31）\n注意：どの方法がよいかは言わない。質問の種類ごとの向き不向きを並べるだけにする。「A社の社長」の例は第3部の例と同じものを使う（p.31）", "section": "D", "check": [{"ed": "基礎", "no": "04", "name": "ハイブリッドとランカー", "dir": "04-hybrid-ranker"}]}, {"id": "p14a", "type": "table", "section": "D", "kicker": "p.14", "title": "質問の種類ごとの==向く検索方法==", "head": ["質問の種類", "向く検索方法", "Azure AI Search で使うもの"], "rows": [["そのままの言葉で探す<br>（例: 「REQ-042」）", "キーワード検索", "BM25 のフルテキスト検索と、filterable のフィールドでのフィルター"], ["意味で探す<br>（例: 「目が不自由な武将」）", "ベクトル検索", "ベクトル検索とセマンティックランカー。ハイブリッドにするとキーワードの一致も残る"], ["いくつかの事実をつなぐ<br>（例: 「A社の社長が提携している会社」）", "1回の検索ではどちらも見つけにく ke-width='7' stroke-linejoin='round'/><polygon points='1098,200 1076,212 1076,188' fill='#2b8a3e'/><text x='1000' y='174' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>② 書き換え<\/text><\/g><g data-step='2'><text x='800' y='452' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>③ 書き換える場所は3つ<\/text><rect x='20' y='480' width='480' height='100' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='260' y='520' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>アプリ<\/text><text x='260' y='558' font-size='26' fill='#5b6675' text-anchor='middle'>Azure OpenAI を呼んで書き換える<\/text><rect x='560' y='480' width='480' height='100' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='800' y='520' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>検索サービス<\/text><text x='800' y='558' font-size='26' fill='#5b6675' text-anchor='middle'>queryRewrites（プレビュー）<\/text><rect x='1100' y='480' width='480' height='100' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='1340' y='520' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>ナレッジベース<\/text><text x='1340' y='558' font-size='26' fill='#5b6675' text-anchor='middle'>low・medium・auto（プレビュー）<\/text><\/g><\/svg>", "caption": "書き換えを置く場所は、アプリ、検索サービス、ナレッジベースのどれか。例の言葉は説明用で、書き換えが増えるほど検索の回数も増える", "notes": "狙い：書き換えは質問の言葉を文書の言葉に近づける処理で、書き換える場所が3つある、と言える。\n話すこと：\n・段階0：利用者の質問は話し言葉で、言葉が足りないことがある（例「家から働ける日は週何日？」）。文書の言葉（「在宅勤務」「リモート」）と違うと、キーワード検索では見つかりにくい。会話の途中の質問は、前の話を入れないと意味が通じないこともある\n・段階1：書き換えの種類は、言い換えを足す（「在宅勤務の日数」「リモート 週」）、いくつかのことを聞く質問を小さな質問に分ける、会話の前の発言を補う。答えの文を先に作り、その文で探す方法もある（HyDE と呼ばれる）。書き換えた結果がずれると、関係のない文書が当たる\n・段階2：書き換える場所は3つ。アプリの中で Azure OpenAI を呼んで書き換え、その結果を検索に渡す。検索のサービスの中で自動で書き換える（セマンティックランカーの queryRewrites、プレビュー）。ナレッジベースで生成 AI が質問を分ける（reasoning effort が low・medium・auto のとき、プレビュー）\n補足：queryRewrites は、クエリに generative|count-5 のように指定する（1〜10件）。書き換えた質問は、キーワード検索とベクトル検索の両方に使われる。debug: queryRewrites で、作られた質問を見られる。ナレッジベースでは、会話の履歴を渡すと前の話を入れた質問に直す。minimal のときは生成 AI で質問を分けない（p.37）。アプリで書き換える方法は、生成 AI の呼び出しが増える\n注意：queryRewrites はプレビュー。GA の 2026-04-01 にあると言わない。書き換えの例（「在宅勤務の日数」「リモート 週」）は説明用", "section": "D", "check": []}]};
const META = DECK.meta || {};

const E = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
// 段階の指定は 0 以上の整数だけ。正しくない値は 0（最初から見える）として扱う（decks.json では整数で書く）
const isStep = v => typeof v === 'number' && Number.isInteger(v) && v >= 0;
const stepOf = v => isStep(v) ? v : 0;
// data-step 属性（文字列）：数字だけの文字列を段階に読む。それ以外は 0
const attrStep = a => /^[0-9]+$/.test(a == null ? '' : String(a)) ? parseInt(a, 10) : 0;
const vis = (o, step) => stepOf(o && o.step) <= step;
const hv = (o, step) => vis(o, step) ? '' : ' hide';
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// 描画中のスライドの links。本文の [[ラベル]] を、同じ label を持つ links の位置に結びつける
let LINKS = [];
const linkHtml = lab => {
  const k = LINKS.findIndex(l => l && l.label === lab);
  return k < 0 ? lab : `<span class="lnk" data-link="${k}">${lab}</span>`;
};
// ==強調（赤。外れ・注意）==、++強調（緑。当たり）++、**太字**、`コード`、[[リンク]]。コードの中の [[ ]] はリンクにしない
const fmt = s => s == null ? '' : String(s)
  .replace(/`[^`]*`|\[\[(.+?)\]\]/g, (m, lab) => lab == null ? m : linkHtml(lab))
  .replace(/==(.+?)==/g, '<span class="em">$1</span>')
  .replace(/\+\+(.+?)\+\+/g, '<span class="em ok">$1</span>')
  .replace(/\*\*(.+?)\*\*/g, '<span class="b">$1</span>')
  .replace(/`([^`]+)`/g, '<code>$1</code>');
// 題名などをプレイヤーへ渡すときに、飾りの記法を外す（<br> は空白に）
const plain = s => s == null ? '' : String(s)
  .replace(/<br\s*\/?>/gi, ' ')
  .replace(/\[\[(.+?)\]\]/g, '$1')
  .replace(/==(.+?)==/g, '$1')
  .replace(/\+\+(.+?)\+\+/g, '$1')
  .replace(/\*\*(.+?)\*\*/g, '$1')
  .replace(/`([^`]+)`/g, '$1')
  .trim();

// スライドの中で使われている step の最大値
function maxStep(o) {
  let m = 0;
  const walk = v => {
    if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') { if (isStep(v.step)) m = Math.max(m, v.step); Object.values(v).forEach(walk); }
  };
  walk(o);
  if (o.type === 'quiz') m = Math.max(m, 1);
  if (o.type === 'run') m = Math.max(m, stepOf(o.expectStep), stepOf(o.checkStep));
  if (Array.isArray(o.rowSteps)) o.rowSteps.forEach(x => { m = Math.max(m, stepOf(x)); });
  // SVG は HTML として読む（= の前後の空白、一重・二重・なしの引用符を、ブラウザの読み方で扱う）
  if (o.type === 'diagram' && typeof o.svg === 'string') {
    const t = document.createElement('template');
    t.innerHTML = o.svg;
    t.content.querySelectorAll('[data-step]').forEach(e => { m = Math.max(m, attrStep(e.getAttribute('data-step'))); });
  }
  return m;
}

const LEVEL_BADGE = { must: '全員で実行', demo: '進行役が見せる', extra: '発展' };
const LEVEL_NOTE = { must: '必須（全員で行う）', demo: '進行役が見せる', extra: '発展（時間の合計に入れない）' };

const C = {};

C.agenda = (s, st) => {
  const w = E('div', 'agenda');
  s.items.forEach((it, i) => {
    const d = E('div', 'it' + hv(it, st));
    d.innerHTML = `<div class="k">${esc(it.k || String.fromCharCode(65 + i))}</div><div><div class="t">${fmt(it.t)}</div>${it.s ? `<div class="s">${fmt(it.s)}</div>` : ''}</div>${it.minutes ? `<div class="m">${it.minutes}分</div>` : ''}`;
    w.append(d);
  });
  return w;
};

C.points = (s, st) => {
  const w = E('div', 'points');
  s.items.forEach((it, i) => {
    const d = E('div', 'p' + hv(it, st));
    d.innerHTML = `<div class="dot">${esc(it.k || i + 1)}</div><div>${fmt(it.text)}${it.sub ? `<span class="sub">${fmt(it.sub)}</span>` : ''}</div>`;
    w.append(d);
  });
  return w;
};

C.compare = (s, st) => {
  const wrap = E('div', 'cwrap');
  const w = E('div', 'compare');
  s.cols.forEach(col => {
    const c = E('div', 'col ' + (col.tone || '') + hv(col, st));
    c.append(E('h2', '', fmt(col.title)));
    (col.rows || []).forEach(r => c.append(E('div', 'row' + hv(r, st), (r.label ? `<span class="lab">${fmt(r.label)}</span>` : '') + fmt(r.text))));
    w.append(c);
  });
  wrap.append(w);
  if (s.verdict) wrap.append(E('div', 'verdict' + hv(s.verdict, st), fmt(s.verdict.text)));
  return wrap;
};

C.flow = (s, st) => {
  const w = E('div', 'flow');
  (s.rows || [{ nodes: s.nodes, arrows: s.arrows }]).forEach(r => {
    const row = E('div', 'flow-row' + hv(r, st));
    if (r.label) row.append(E('div', 'rl', fmt(r.label)));
    r.nodes.forEach((n, i) => {
      if (i > 0) { const a = (r.arrows || [])[i - 1] || {}; row.append(E('div', 'arrow' + hv(a, st), `<div class="ar">${a.down ? '↓' : '→'}</div><div class="at">${fmt(a.text || '')}</div>`)); }
      const d = E('div', 'node ' + (n.tone || '') + hv(n, st), `${n.badge ? `<div class="badge">${esc(n.badge)}</div>` : ''}<div class="t">${fmt(n.t)}</div>${n.s ? `<div class="s">${fmt(n.s)}</div>` : ''}`);
      if (n.grow) d.style.flex = n.grow;
      row.append(d);
    });
    w.append(row);
  });
  (s.banners || []).forEach(b => w.append(E('div', 'banner ' + (b.tone || '') + hv(b, st), fmt(b.text))));
  return w;
};

C.diagram = (s, st) => {
  const w = E('div', 'diagram');
  const box = E('div', '', s.svg);
  box.style.width = '100%'; box.style.flex = '1'; box.style.minHeight = '0'; box.style.display = 'flex';
  box.querySelectorAll('[data-step]').forEach(el => { if (attrStep(el.getAttribute('data-step')) > st) el.style.visibility = 'hidden'; });
  w.append(box);
  if (s.caption) w.append(E('div', 'cap', fmt(s.caption)));
  return w;
};

C.code = (s, st) => {
  const w = E('div', 'code');
  w.append(E('div', 'file', esc(s.file || '') + (s.lang ? `　<span style="opacity:.6">${esc(s.lang)}</span>` : '')));
  const pre = E('pre');
  const start = s.start || 1;
  const hls = (s.highlight || []).filter(h => vis(h, st));
  const cur = hls.length ? hls[hls.length - 1] : null;
  s.lines.forEach((l, i) => {
    const n = start + i;
    const on = cur && n >= cur.from && n <= cur.to;
    pre.append(E('span', 'ln' + (on ? ' hl' : (cur && s.dimOthers !== false ? ' dim' : '')), `<span class="no">${n}</span>${esc(l)}`));
  });
  w.append(pre);
  return w;
};

C.table = (s, st) => {
  const t = E('table', 'tb');
  const hl = new Set((s.highlight || []).filter(h => vis(h, st)).map(h => h.row));
  t.innerHTML = `<tr>${s.head.map((h, i) => `<th${s.colW ? ` style="width:${s.colW[i]}"` : ''}>${fmt(h)}</th>`).join('')}</tr>` +
    s.rows.map((r, i) => { const step = stepOf((s.rowSteps || [])[i]); return `<tr class="${hl.has(i) ? 'hl' : ''}${step > st ? ' hide' : ''}">${r.map(c => `<td>${fmt(c)}</td>`).join('')}</tr>`; }).join('');
  const w = E('div', ''); w.style.width = '100%'; w.append(t);
  if (s.foot) w.append(E('div', 'tfoot', fmt(s.foot)));   // 表の下の小さな注（1行）
  return w;
};

C.stat = (s, st) => {
  const w = E('div', 'stat');
  s.items.forEach(it => w.append(E('div', 'it ' + (it.tone || '') + hv(it, st), `<div class="v">${fmt(it.value)}</div><div class="l">${fmt(it.label)}</div>${it.sub ? `<div class="s">${fmt(it.sub)}</div>` : ''}`)));
  return w;
};

C.bars = (s, st) => {
  const w = E('div', 'bars');
  const area = E('div', 'area'), labels = E('div', 'labels');
  const max = s.max || Math.max(...s.items.map(i => i.value));
  s.items.forEach(it => {
    const ratio = s.invert ? (max - it.value + 1) / max : it.value / max;
    const b = E('div', 'bar ' + (it.tone || '') + hv(it, st));
    b.innerHTML = `<div class="val">${fmt(it.display || it.value)}</div><div class="col" style="height:${Math.max(4, ratio * 78)}%"></div>`;
    area.append(b);
    labels.append(E('div', hv(it, st).trim(), `${fmt(it.label)}${it.sub ? `<small>${fmt(it.sub)}</small>` : ''}`));
  });
  w.append(area, labels);
  return w;
};

C.quote = (s, st) => {
  const w = E('div', 'quote');
  w.append(E('div', 'q', fmt(s.text)), E('div', 'by', fmt(s.by || '')));
  return w;
};

C.quiz = (s, st) => {
  const w = E('div', 'quiz');
  w.append(E('div', 'qq', fmt(s.question)));
  const chs = E('div', 'chs');
  (s.choices || []).forEach((c, i) => chs.append(E('div', 'ch' + (st >= 1 && i === s.answer ? ' right' : ''), `<span class="k">${'ABCD'[i]}</span>${fmt(c)}`)));
  w.append(chs);
  w.append(E('div', 'ex' + (st >= 1 ? '' : ' hide'), fmt(s.explain)));
  return w;
};

C.steps = (s, st) => {
  const w = E('div', 'stepl');
  s.items.forEach((it, i) => w.append(E('div', 'it' + hv(it, st), `<div class="n">${esc(it.n || i + 1)}</div><div><div class="t">${fmt(it.t)}</div>${it.s ? `<div class="s">${fmt(it.s)}</div>` : ''}</div>${it.cmd ? `<div class="cmd">${esc(it.cmd)}</div>` : ''}`)));
  if (s.foot) w.append(E('div', 'foot', fmt(s.foot)));   // 小さな注（1行）
  return w;
};

C.recap = (s, st) => {
  const w = E('div', 'recap');
  s.items.forEach(it => w.append(E('div', 'p' + hv(it, st), `<div>${fmt(it.text)}</div>`)));
  if (s.next) w.append(E('div', 'next' + hv(s.next, st), fmt(s.next.text)));
  return w;
};

// ---- ハンズオン資料で足した部品 ----
// kw：キーワードのページ。cols: [{title, groups: [{h, items: [文字列]}]}]、sub（サブタイトル）。文字はあとで fitKw が枠に収まる大きさに縮める
C.kw = (s, st) => {
  const w = E('div', 'kw');
  if (s.sub) w.append(E('div', 'ksub', fmt(s.sub)));
  const cols = E('div', 'kcols kfit');
  (s.cols || []).forEach(col => {
    const c = E('div', 'kcol');
    c.append(E('h2', '', fmt(col.title)));
    (col.groups || []).forEach(g => {
      if (g.h) c.append(E('h3', '', fmt(g.h)));
      if ((g.items || []).length) c.append(E('ul', '', g.items.map(t => `<li>${fmt(t)}</li>`).join('')));
    });
    cols.append(c);
  });
  w.append(cols);
  return w;
};

// kw の段組みを、どちらの段もはみ出さない文字の大きさに縮める（26px から 17px まで）
function fitKw(stage) {
  stage.querySelectorAll('.kfit').forEach(box => {
    const cols = [...box.querySelectorAll('.kcol')];
    const over = () => cols.some(c => c.scrollHeight > c.clientHeight + 1);
    let fs = 26;
    box.style.fontSize = fs + 'px';
    while (fs > 17 && over()) { fs -= 1; box.style.fontSize = fs + 'px'; }
  });
}

// 「確かめる」の欄：s.check は [{ed, no, name, dir}]、s.checkNote は補足
const chkHtml = s => `<span class="ck">確かめる</span>` +
  s.check.map(c => {
    // トピックが2つ以上並ぶときは、フォルダ名を省いて1行に収める
    const inner = `<b>${esc(c.ed)} ${esc(c.no)}</b>${esc(c.name)}` + (s.check.length > 1 ? '' : `<code>${esc(c.dir)}</code>`);
    return `<span class="tp">${inner}</span>`;
  }).join('<span class="nt">／</span>') +
  (s.checkNote ? `<span class="nt">（${esc(s.checkNote)}）</span>` : '');

// ---- 操作のページ（run）と、実測の出力のページ（output）----
const termHead = (label, right) => `<div class="thead"><span class="dots"><i></i><i></i><i></i></span><span class="tl">${label}</span>${right ? `<span class="tr">${right}</span>` : ''}</div>`;
// 行が少ないときは字を大きくする（8行まで 32px、11行まで 28px、それより多いと 24px）
const termSize = n => n <= 8 ? ' fs-l' : n <= 11 ? ' fs-m' : '';
const termLines = (lines, cls) => lines.map((l, i) => `<span class="ln${cls ? cls(i + 1) : ''}">${esc(l) || '&nbsp;'}</span>`).join('');

C.run = (s, st) => {
  const w = E('div', 'run');
  const card = E('div', 'cmdcard');
  card.append(E('div', 'rhead', `<span class="rfile">${esc(s.file || '')}</span>${s.level ? `<span class="lvl ${esc(s.level)}">${esc(LEVEL_BADGE[s.level] || s.level)}</span>` : ''}`));
  // where：そのフォルダで最初に打つコマンドの上に、うす字で場所と移り方を出す
  if (s.where) card.append(E('div', 'rwhere', fmt(s.where)));
  card.append(E('div', 'rcmd', `<span class="ps">${esc(s.prompt || 'PS>')}</span><span class="ctext" data-link="${(s.links || []).length}">${esc(s.cmd || '')}</span>`));
  w.append(card);
  w.append(E('div', 'term' + hv({ step: s.expectStep }, st), termHead('実行すると、こう表示される（一部）') + `<pre class="${termSize((s.expect || []).length).trim()}">${termLines(s.expect || [])}</pre>`));
  w.append(E('div', 'rcheck' + hv({ step: s.checkStep }, st), `<span class="rk">確かめること</span>${fmt(s.check)}`));
  return w;
};

C.output = (s, st) => {
  const w = E('div', 'term outp');
  // 光る行：いま見えている highlight のうち、いちばん新しい段階のものだけ。ほかの行は暗くする
  const hls = (s.highlight || []).filter(h => vis(h, st));
  const top = hls.length ? Math.max(...hls.map(h => stepOf(h.step))) : -1;
  const on = new Set(hls.filter(h => stepOf(h.step) === top).map(h => h.line));
  w.innerHTML = termHead('実行すると、こう表示される', s.measure ? `実測の記録：${esc(s.measure)}` : '') +
    `<pre class="${termSize((s.lines || []).length).trim()}">${termLines(s.lines || [], n => on.has(n) ? ' hl' : (hls.length ? ' dim' : ''))}</pre>` +
    `<div class="tcap">${fmt(s.caption)}</div>`;
  return w;
};

// ノートに出す文字列：時間・区分・出典を先頭に、そのあとに notes
function noteText(s) {
  const t = [];
  if (s.minutes != null) t.push(`話す ${s.minutes} 分`);
  if (s.opMinutes != null) t.push(`操作 ${s.opMinutes} 分`);
  if (s.level) t.push(LEVEL_NOTE[s.level] || s.level);
  if (s.ref) t.push(plain(s.ref));
  return (t.length ? t.join('　') + '\n\n' : '') + (s.notes || '（ノートなし）');
}

// プレイヤーへ渡すリンク。run は、コマンドを写す copy リンクを最後に自動で足す（番号は links の長さ。作者の links の番号は変わらない）
const slideLinks = s => {
  const base = s.links || [];
  return s.type === 'run' && typeof s.cmd === 'string' && s.cmd ? base.concat([{ label: 'コマンド', kind: 'copy', text: s.cmd }]) : base;
};

// メインの舞台以外に描いたとき、描いた中の id と、その参照（url(#id)、href="#id"）に描画先ごとの接尾辞を付ける（プレイヤーとの約束）。
// いまの図の SVG は id を使わないので、ふだんは何もしない。念のための処理
let TARGET_SEQ = 0;
const TARGET_NO = new WeakMap();
function suffixIds(target) {
  const els = target.querySelectorAll('[id]');
  if (!els.length) return;
  if (!TARGET_NO.has(target)) TARGET_NO.set(target, ++TARGET_SEQ);
  const suf = `-t${TARGET_NO.get(target)}`;
  const ids = new Set([...els].map(e => e.id));
  els.forEach(e => { e.id = e.id + suf; });
  const fix = v => v
    .replace(/url\(\s*(['"]?)#([^)'"\s]+)\1\s*\)/g, (m, q, id) => ids.has(id) ? `url(${q}#${id}${suf}${q})` : m)
    .replace(/^#([^\s]+)$/, (m, id) => ids.has(id) ? `#${id}${suf}` : m);
  target.querySelectorAll('*').forEach(e => {
    for (const a of [...e.attributes]) {
      if (a.name === 'id' || !a.value.includes('#')) continue;
      const nv = fix(a.value);
      if (nv !== a.value) e.setAttribute(a.name, nv);
    }
  });
}

const sectionTitle = id => { const x = (META.sections || []).find(s => s.id === id); return x ? `${x.id}　${x.title}` : ''; };

function draw(i, st, stage) {
  const s = DECK.slides[i];
  stage.replaceChildren();
  stage.style.setProperty('--accent', META.accent || '#0b6bcb');
  if (META.accentSoft) stage.style.setProperty('--accent-soft', META.accentSoft); else stage.style.removeProperty('--accent-soft');
  if (s.type === 'cover') {
    const c = E('div', 'cover');
    c.innerHTML = `<div class="lab">${fmt(s.label || '')}</div><h1>${fmt(s.title)}</h1><div class="lead">${fmt(s.lead || '')}</div><div class="meta">${(s.meta || []).map(m => `<div>${fmt(m)}</div>`).join('')}</div>`;
    stage.append(c);
    return;
  }
  if (s.type === 'section') {
    const c = E('div', 'sectionpg');
    c.innerHTML = `<div class="no">${esc(s.no || '')}</div><div><h1>${fmt(s.title)}</h1><div class="lead">${fmt(s.lead || '')}</div>${s.minutesLabel ? `<div class="mins">${fmt(s.minutesLabel)}</div>` : ''}</div>`;
    stage.append(c);
  } else {
    if (!C[s.type]) throw new Error(`未知の type: ${s.type}（${s.id}）`);
    const h = E('header');
    h.innerHTML = `<div class="kick"><span class="chip">${fmt(META.short || '')}</span><span>${fmt(s.kicker || sectionTitle(s.section) || '')}</span><span class="ref">${fmt(s.ref || '')}</span></div><h1>${fmt(s.title)}</h1>`;
    stage.append(h);
    const callouts = s.callouts || [];
    const hasChk = Array.isArray(s.check) && s.check.length > 0;
    const m = E('main', (s.layout === 'below' ? 'below' : '') + (hasChk ? ' withchk' : '') + (s.source ? ' withsrc' : ''));
    const v = E('div', 'visual');
    v.append(C[s.type](s, st));
    m.append(v);
    if (callouts.length) {
      const side = E('div', 'side');
      // items があれば、体言止めの箇条として出す（折り返しても字下げがそろう）
      callouts.forEach(c => side.append(E('div', 'call ' + (c.tone || '') + hv(c, st), (c.title ? `<div class="ct">${fmt(c.title)}</div>` : '') +
        (c.items ? `<ul class="cl">${c.items.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>` : fmt(c.text)))));
      m.append(side);
    }
    stage.append(m);
    // source：出典をうす字で小さく（「確かめる」の行の上）
    if (s.source) stage.append(E('div', 'srcnote' + (hasChk ? ' withchk' : ''), '出典：' + fmt(s.source)));
    if (hasChk) stage.append(E('div', 'chkbar', chkHtml(s)));
    fitKw(stage);
  }
  const f = E('footer');
  const secs = META.sections || [];
  const ci = secs.findIndex(x => x.id === s.section);
  secs.forEach((x, k) => f.append(E('div', 'sec' + (k === ci ? ' on' : k < ci ? ' done' : ''), `${esc(x.id)}　${fmt(x.title)}`)));
  f.append(E('div', 'pg', `${i + 1} / ${DECK.slides.length}`));
  stage.append(f);
}

const steps = DECK.slides.map(maxStep);

// render(ref, step, target)：ref は 0 から数えた位置か id。target を省くと #stage
function render(ref, step, target) {
  const i = typeof ref === 'number' ? ref : DECK.slides.findIndex(x => x.id === ref);
  if (!Number.isInteger(i) || i < 0 || i >= DECK.slides.length) throw new Error(`render: スライドがない（${ref}）`);
  const stage = target || document.getElementById('stage');
  stage.classList.add('sp-target');
  const st = Math.max(0, Math.min(steps[i], step | 0));
  LINKS = slideLinks(DECK.slides[i]);
  try { draw(i, st, stage); } finally { LINKS = []; }
  if (stage !== document.getElementById('stage')) suffixIds(stage);
}

const deckId = META.id || `s-${String(META.session || 0).padStart(2, '0')}`;
window.slideDeck = {
  contract: 1,
  info: {
    id: deckId,
    title: plain(META.title),
    label: plain(META.short),
    home: META.home || '../index.html',
    color: META.accent,
    sections: (META.sections || []).map(x => ({ id: x.id, title: plain(x.title) })),
    slides: DECK.slides.map((s, i) => ({
      id: s.id, title: plain(s.title), section: s.section, steps: steps[i],
      notes: noteText(s), minutes: s.minutes, links: slideLinks(s)
    }))
  },
  render
};
// 静止画を撮る tools/check.py が使う。?render のときも通常のときも同じ名前で残す
window.renderSlide = (i, st) => render(i, st);
window.deckInfo = () => DECK.slides.map((s, i) => ({ id: s.id, steps: steps[i] }));
if (new URLSearchParams(location.search).has('render')) document.body.classList.add('render');
</script>
<script src="../player.js"></script>
