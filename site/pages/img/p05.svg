middle'>読んで並べ直す</text></g><g><path d='M912 250 L1056 250' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1078,250 1056,262 1056,238' fill='#1864ab'/><text x='995' y='222' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>② 並べ直す</text><rect x='1080' y='40' width='480' height='440' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1320' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ランカー後の上位5人</text><text x='1112' y='160' font-size='30' fill='#1d2733' text-anchor='start'>1位　細川忠興</text><text x='1402' y='160' font-size='26' fill='#5b6675' text-anchor='start'>前段 10位</text><text x='1112' y='216' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>2位　藤堂高虎</text><text x='1402' y='216' font-size='26' fill='#2b8a3e' font-weight='700' text-anchor='start'>前段 12位</text><text x='1112' y='272' font-size='30' fill='#1d2733' text-anchor='start'>3位　本多忠勝</text><text x='1402' y='272' font-size='26' fill='#5b6675' text-anchor='start'>前段 1位</text><text x='1112' y='328' font-size='30' fill='#1d2733' text-anchor='start'>4位　服部半蔵</text><text x='1402' y='328' font-size='26' fill='#5b6675' text-anchor='start'>前段 8位</text><text x='1112' y='384' font-size='30' fill='#1d2733' text-anchor='start'>5位　石川数正</text><text x='1402' y='384' font-size='26' fill='#5b6675' text-anchor='start'>前段 6位</text><rect x='1096' y='184' width='448' height='44' rx='8' fill='none' stroke='#2b8a3e' stroke-width='6'/></g><g><rect x='40' y='512' width='460' height='84' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4' stroke-dasharray='14 10'/><text x='270' y='564' font-size='30' fill='#5b6675' text-anchor='middle'>51位以下は、並べ直さない</text><text x='540' y='564' font-size='28' fill='#d9480f' font-weight='700' text-anchor='start'>③ 正解がここにいたら、ランカーでも拾えない</text></g></svg>
