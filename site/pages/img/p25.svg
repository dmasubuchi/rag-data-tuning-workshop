<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 1600 560" width="1600" height="560" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='20' width='1600' height='560' fill='#ffffff'/><rect x='40' y='40' width='300' height='240' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='190' y='112' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>Outlook の</text><text x='190' y='156' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>メール</text><text x='190' y='204' font-size='26' fill='#d9480f' font-weight='700' text-anchor='middle'>標準の</text><text x='190' y='238' font-size='26' fill='#d9480f' font-weight='700' text-anchor='middle'>データソースにない</text><g><path d='M342 160 L496 160' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='518,160 496,172 496,148' fill='#1864ab'/><text x='430' y='128' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 書き出す</text><rect x='520' y='40' width='360' height='240' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='700' y='96' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>Blob など</text><text x='700' y='152' font-size='30' fill='#1d2733' text-anchor='middle'>ファイルとして</text><text x='700' y='194' font-size='30' fill='#1d2733' text-anchor='middle'>書き出す</text><text x='700' y='250' font-size='26' fill='#5b6675' text-anchor='middle'>.eml・.msg</text><text x='700' y='332' font-size='26' fill='#5b6675' text-anchor='middle'>書き出す仕組みは、</text><text x='700' y='368' font-size='26' fill='#5b6675' text-anchor='middle'>自分で作るか、</text><text x='700' y='404' font-size='26' fill='#5b6675' text-anchor='middle'>別のサービスを使う</text></g><g><path d='M882 160 L1076 160' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1098,160 1076,172 1076,148' fill='#1864ab'/><text x='990' y='128' font-size='28' fill='#1864ab' font-weight='700' text-anchor='midd