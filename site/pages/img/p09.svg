<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 610" width="1600" height="610" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='610' fill='#ffffff'/><text x='400' y='44' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>全件検索（厳密な KNN）</text><text x='400' y='84' font-size='26' fill='#5b6675' text-anchor='middle'>質問とすべての文書を比べる</text><text x='1220' y='44' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>HNSW（近似）</text><text x='1220' y='84' font-size='26' fill='#5b6675' text-anchor='middle'>つながりをたどって、近い所だけ比べる</text><rect x='60' y='106' width='110' height='46' rx='10' fill='#1864ab' stroke='#1864ab' stroke-width='4'/><text x='115' y='139' font-size='26' fill='#fff' font-weight='700' text-anchor='middle'>質問</text><circle cx='260' cy='230' r='16' fill='#5b6675'/><circle cx='400' cy='230' r='16' fill='#5b6675'/><circle cx='540' cy='230' r='16' fill='#5b6675'/><circle cx='680' cy='230' r='16' fill='#5b6675'/><circle cx='260' cy='330' r='16' fill='#5b6675'/><circle cx='400' cy='330' r='16' fill='#5b6675'/><circle cx='540' cy='330' r='16' fill='#5b6675'/><circle cx='680' cy='330' r='16' fill='#5b6675'/><rect x='1260' y='106' width='110' height='46' rx='10' fill='#1864ab' stroke='#1864ab' stroke-width='4'/><text x='1315' y='139' font-size='26' fill='#fff' font-weight='700' text-anchor='middle'>質問</text><rect x='880' y='168' width='680' height='64' rx='10' fill='#e7f0fa' stroke='#c9d6e6' stroke-width='3'/><rect x='880' y='246' width='680' height='64' rx='10' fill='#e7f0fa' stroke='#c9d6e6' stroke-width='3'/><rect x='880' y='326' width='680' height='64' rx='10' fill='#e7f0fa' stroke='#c9d6e6' stroke-width='3'/><text x='900' y='209' font-size='26' fill='#5b6675' text-anchor='start'>上の層（粗い）</text><text x='900' y='287' font-size='26' fill='#5b6675' text-anchor='start'>中の層</text><text x='900' y='367' font-size='26' fill='#5b6675' text-anchor='start'>下の層（細かい）</text><l