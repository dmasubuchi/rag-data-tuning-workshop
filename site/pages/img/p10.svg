<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='640' fill='#ffffff'/><path d='M130 560 L668 560' fill='none' stroke='#5b6675' stroke-width='4' stroke-linejoin='round'/><polygon points='690,560 668,572 668,548' fill='#5b6675'/><text x='708' y='572' font-size='30' fill='#5b6675' text-anchor='start'>甘い</text><path d='M130 560 L130 62' fill='none' stroke='#5b6675' stroke-width='4' stroke-linejoin='round'/><polygon points='130,40 142,62 118,62' fill='#5b6675'/><text x='130' y='26' font-size='30' fill='#5b6675' text-anchor='middle'>辛い</text><path d='M130 560 L271 230' fill='none' stroke='#1d2733' stroke-width='8' stroke-linejoin='round'/><polygon points='280,210 282,235 260,225' fill='#1d2733'/><text x='296' y='204' font-size='34' fill='#1d2733' font-weight='700' text-anchor='start'>カレー</text><path d='M130 560 L225 131' fill='none' stroke='#1d2733' stroke-width='8' stroke-linejoin='round'/><polygon points='230,110 237,134 214,129' fill='#1d2733'/><text x='248' y='122' font-size='34' fill='#1d2733' font-weight='700' text-anchor='start'>麻婆豆腐</text><path d='M130 560 L558 512' fill='none' stroke='#1d2733' stroke-width='8' stroke-linejoin='round'/><polygon points='580,510 559,524 557,501' fill='#1d2733'/><text x='598' y='524' font-size='34' fill='#1d2733' font-weight='700' text-anchor='start'>大福</text><text x='860' y='36' font-size='26' fill='#5b6675' font-weight='700' text-anchor='start'>カレーとの近さ</text><rect x='860' y='56' width='700' height='150' rx='10' fill='#fff' stroke='#5b6675' stroke-width='3'/><text x='890' y='102' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>①  コサイン類似度</text><text x='890' y='148' font-size='30' fill='#1d2733' text-anchor='start'>矢印の向きの近さ。長さは見ない</text><rect x='860' y='222' width='700' height='150' rx='10' fill='#fff' stroke='#5b6675' stroke-width='3'/><text x='890' y='268' font-size='34' fill='#d9480f' font-weight='700' text-anchor='start'>②  内積</text><text x='890' y='314' font-size='30' fill='#1d2733' text-anchor='start'>向きの近さ × 2本の長さ。長さも効く</text><rect x='860' y='388' width='700' height='150' rx='10' fill='#fff' stroke='#5b6675' stroke-width='3'/><text x='890' y='434' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='start'>③  ユークリッド距離</text><text x='890' y='480' font-size='30' fill='#1d2733' text-anchor='start'>矢印の先どうしの距離。小さいほど近い</text><g><path d='M240 303 A280 280 0 0 0 191 287' fill='none' stroke='#1864ab' stroke-width='6'/><text x='254' y='338' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>約11度</text><path d='M269 545 A140 140 0 0 0 185 431' fill='none' stroke='#1864ab' stroke-width='6'/><text x='298' y='436' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>約60度</text><rect x='860' y='56' width='700' height='150' rx='10' fill='none' stroke='#1864ab' stroke-width='8'/><text x='890' y='188' font-size='26' fill='#1864ab' font-weight='700' text-anchor='start'>麻婆豆腐 0.98　大福 0.49　（1 に近いほど近い）</text></g><g><line x1='130' y1='596' x2='580' y2='596' stroke='#d9480f' stroke-width='6'/><line x1='130' y1='586' x2='130' y2='606' stroke='#d9480f' stroke-width='6'/><line x1='580' y1='586' x2='580' y2='606' stroke='#d9480f' stroke-width='6'/><text x='355' y='634' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>大福の矢印の長さ</text><rect x='860' y='222' width='700' height='150' rx='10' fill='none' stroke='#d9480f' stroke-width='8'/><text x='890' y='354' font-size='26' fill='#d9480f' font-weight='700' text-anchor='start'>麻婆豆腐 69　大福 34　（大きいほど近い）</text></g><g><line x1='280' y1='210' x2='230' y2='110' stroke='#2b8a3e' stroke-width='6' stroke-dasharray='9 8'/><line x1='280' y1='210' x2='580' y2='510' stroke='#2b8a3e' stroke-width='6' stroke-dasharray='9 8'/><rect x='860' y='388' width='700' height='150' rx='10' fill='none' stroke='#2b8a3e' stroke-width='8'/><text x='890' y='520' font-size='26' fill='#2b8a3e' font-weight='700' text-anchor='start'>麻婆豆腐 2.2　大福 8.5　（ほかの2つと向きが逆）</text><text x='1210' y='610' font-size='28' fill='#1d2733' font-weight='700' text-anchor='middle'>長さを1にそろえると、3つとも順位は同じになる</text></g></svg>
