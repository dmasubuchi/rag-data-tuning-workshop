<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='500' fill='#ffffff'/><circle cx='150' cy='200' r='38' fill='#5b6675'/><path d='M84 360 Q84 260 150 260 Q216 260 216 360 Z' fill='#5b6675'/><text x='150' y='148' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>利用者</text><text x='150' y='404' font-size='30' fill='#5b6675' font-weight='700' text-anchor='middle'>「独眼竜」</text><rect x='420' y='40' width='500' height='330' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='670' y='94' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>同義語マップ</text><text x='670' y='132' font-size='26' fill='#5b6675' text-anchor='middle'>（人が書く表）</text><text x='670' y='194' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>独眼竜, 伊達政宗</text><text x='670' y='232' font-size='26' fill='#5b6675' text-anchor='middle'>（同じ意味として扱う）</text><text x='670' y='304' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>第六天魔王 =&gt; 織田信長</text><text x='670' y='342' font-size='26' fill='#5b6675' text-anchor='middle'>（片方向に置き換える）</text><rect x='1080' y='100' width='480' height='200' rx='10' fill='#fff' stroke='#2b8a3e' stroke-width='4'/><text x='1320' y='152' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='middle'>実際に探す言葉</text><text x='1320' y='204' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>独眼竜 または</text><text x='1320' y='246' font-size='30' fill='#1d2733' font-weight='700' text-anchor='middle'>伊達政宗</text><g><path d='M212 200 L396 200' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='418,200 396,212 396,188' fill='#1864ab'/><text x='315' y='174' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 質問</text></g><g><rect x='440' y='156' width='460' height='88' rx='10' fill='none' stroke='#1864ab' stroke-width='8'/><path d='M922 200 L1056 200' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1078,200 1056,212 1056,188' fill='#2b8a3e'/><text x='1000' y='174' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>② 広げる</text></g><g><text x='800' y='452' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>③ 表に書いた言い換えしか広がらない。表を足したら、どの質問に効いたかを確かめる</text></g></svg>
