<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 570" width="1600" height="570" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='570' fill='#ffffff'/><rect x='40' y='40' width='340' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='210' y='92' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>文</text><text x='210' y='150' font-size='30' fill='#1d2733' text-anchor='middle'>目が不自由な</text><text x='210' y='192' font-size='30' fill='#1d2733' text-anchor='middle'>武将</text><rect x='530' y='40' width='300' height='190' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='680' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>埋め込みモデル</text><text x='680' y='150' font-size='30' fill='#1d2733' text-anchor='middle'>文を数の並びに</text><text x='680' y='192' font-size='30' fill='#1d2733' text-anchor='middle'>変える</text><rect x='1020' y='40' width='540' height='190' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1290' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ベクトル</text><g><path d='M382 135 L506 135' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='528,135 506,147 506,123' fill='#1864ab'/><text x='455' y='108' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 渡す</text></g><g><path d='M832 135 L996 135' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1018,135 996,147 996,123' fill='#1864ab'/><text x='925' y='108' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>② 出力</text><text x='1290' y='150' font-size='30' fill='#1d2733' text-anchor='middle'>[+0.0142, +0.0371, +0.0096, …]</text><text x='1290' y='196' font-size='26' fill='#5b6675' text-anchor='middle'>長さはモデルで決まる（次元数）</text></g><g><text x='800' y='282' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>③ 次元数は、モデルで決まる</text><text x='800' y='322' font-size='26' fill='#5b6675' text-anchor='middle'>text-embedding-3-small は 1536、text-embedding-3-large は 3072</text></g><g><text x='40' y='392' font-size='28' fill='#d9480f' font-weight='700' text-anchor='start'>④ 守る3つの決まり</text><rect x='40' y='412' width='480' height='172' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='280' y='462' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>決まり1</text><text x='280' y='514' font-size='30' fill='#1d2733' text-anchor='middle'>質問と文書は</text><text x='280' y='554' font-size='30' fill='#1d2733' text-anchor='middle'>同じモデルで変える</text><rect x='560' y='412' width='480' height='172' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='800' y='462' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>決まり2</text><text x='800' y='514' font-size='30' fill='#1d2733' text-anchor='middle'>フィールドの次元数は</text><text x='800' y='554' font-size='30' fill='#1d2733' text-anchor='middle'>モデルの出力と同じ</text><rect x='1080' y='412' width='480' height='172' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='1320' y='462' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>決まり3</text><text x='1320' y='514' font-size='30' fill='#1d2733' text-anchor='middle'>次元数が大きいと</text><text x='1320' y='554' font-size='30' fill='#1d2733' text-anchor='middle'>保存の量が増える</text></g></svg>
