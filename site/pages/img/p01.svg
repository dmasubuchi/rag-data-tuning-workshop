ine x1='1484' y1='266' x2='1546' y2='266' stroke='#c9d6e6' stroke-width='5'/><line x1='1484' y1='284' x2='1546' y2='284' stroke='#c9d6e6' stroke-width='5'/><line x1='1484' y1='302' x2='1546' y2='302' stroke='#c9d6e6' stroke-width='5'/><line x1='1484' y1='320' x2='1546' y2='320' stroke='#c9d6e6' stroke-width='5'/><text x='1295' y='372' font-size='26' fill='#5b6675' text-anchor='middle'>1位</text><text x='1405' y='372' font-size='26' fill='#5b6675' text-anchor='middle'>2位</text><text x='1515' y='372' font-size='26' fill='#5b6675' text-anchor='middle'>3位</text><g><path d='M205 280 L396 280' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='418,280 396,292 396,268' fill='#1864ab'/><text x='312' y='252' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 単語で探す</text><text x='770' y='206' font-size='26' fill='#1864ab' text-anchor='middle'>点数は、次の3つで決まる</text><path d='M1122 280 L1214 280' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1236,280 1214,292 1214,268' fill='#2b8a3e'/><text x='1405' y='178' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='middle'>点数の高い順に返す</text></g><g><text x='460' y='256' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>② 出現回数（TF）</text><text x='496' y='294' font-size='26' fill='#5b6675' text-anchor='start'>何回出てくるか。増えても頭打ち（k1 で調整）</text></g><g><text x='460' y='346' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>③ 珍しさ（IDF）</text><text x='496' y='384' font-size='26' fill='#5b6675' text-anchor='start'>少数の文書にだけ出る言葉は高く評価する</text></g><g><text x='460' y='436' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>④ 文書の長さ</text><text x='496' y='474' font-size='26' fill='#5b6675' text-anchor='start'>長い文書は、その分を割り引く（b で調整）</text></g></svg>
