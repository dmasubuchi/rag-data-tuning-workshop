<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 560" width="1600" height="560" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='560' fill='#ffffff'/><g><rect x='40' y='40' width='1520' height='100' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='80' y='86' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>minimal</text><text x='80' y='124' font-size='26' fill='#5b6675' text-anchor='start'>GA（2026-04-01）</text><text x='650' y='84' font-size='30' fill='#1d2733' text-anchor='start'>計画に生成 AI を使わず、質問をそのまま探す</text><text x='650' y='124' font-size='26' fill='#5b6675' text-anchor='start'>ナレッジベースのすべてのナレッジソースで探す。GA はこの段だけ</text></g><g><path d='M100 142 L100 166' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='100,188 88,166 112,166' fill='#1864ab'/><text x='130' y='176' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>① 計画に生成 AI を使う</text><rect x='40' y='188' width='1520' height='100' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='80' y='234' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>low</text><text x='80' y='272' font-size='26' fill='#5b6675' text-anchor='start'>プレビュー（2026-08-01-preview）</text><text x='650' y='232' font-size='30' fill='#1d2733' text-anchor='start'>生成 AI で質問を書き換え、分けて探す</text><text x='650' y='272' font-size='26' fill='#5b6675' text-anchor='start'>指定がないときの既定の段</text></g><g><path d='M100 290 L100 314' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='100,336 88,314 112,314' fill='#1864ab'/><text x='130' y='324' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>② 結果を見て探し直す</text><rect x='40' y='336' width='1520' height='100' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='80' y='382' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>medium</text><text x='80' y='420' font-size='26' fill='#5b6675' text-anchor='start'>プレビュー（2026-08-01-preview）</text><text x='650' y='380' font-size='30' fill='#1d2733' text-anchor='start'>最初の検索のあと、分類のモデルが結果を見る</text><text x='650' y='420' font-size='26' fill='#5b6675' text-anchor='start'>足りなければ、見直した計画で1回だけ探し直す</text></g><g><path d='M100 438 L100 462' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='100,484 88,462 112,462' fill='#1864ab'/><text x='130' y='472' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>③ 足りなければ進む</text><rect x='40' y='484' width='1520' height='100' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='80' y='530' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>auto</text><text x='80' y='568' font-size='26' fill='#5b6675' text-anchor='start'>2026-08-01-preview だけ</text><text x='650' y='528' font-size='30' fill='#1d2733' text-anchor='start'>軽い検索から始める</text><text x='650' y='568' font-size='26' fill='#5b6675' text-anchor='start'>根拠が足りなければ、medium までの計画に進む</text></g></svg>
