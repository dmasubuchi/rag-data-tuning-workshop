<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 1600 560" width="1600" height="560" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='8' width='1600' height='560' fill='#ffffff'/><rect x='14' y='70' width='276' height='254' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='152' y='128' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>読む</text><text x='152' y='190' font-size='30' fill='#1d2733' text-anchor='middle'>文字を取り出す</text><text x='152' y='232' font-size='30' fill='#1d2733' text-anchor='middle'>スキャンは</text><text x='152' y='274' font-size='30' fill='#1d2733' text-anchor='middle'>OCR で文字に</text><rect x='338' y='70' width='276' height='254' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='476' y='128' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ばらす</text><text x='476' y='190' font-size='30' fill='#1d2733' text-anchor='middle'>見出し、表、</text><text x='476' y='232' font-size='30' fill='#1d2733' text-anchor='middle'>行に分ける</text><rect x='662' y='70' width='276' height='254' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='800' y='128' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>切る</text><text x='800' y='190' font-size='30' fill='#1d2733' text-anchor='middle'>検索の単位に切る</text><text x='800' y='232' font-size='30' fill='#1d2733' text-anchor='middle'>必要なら</text><text x='800' y='274' font-size='30' fill='#1d2733' text-anchor='middle'>ベクトルにする</text><rect x='986' y='70' width='276' height='254' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1124' y='128' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>出典</text><text x='1124' y='190' font-size='30' fill='#1d2733' text-anchor='middle'>ファイル名、</text><text x='1124' y='232' font-size='30' fill='#1d2733' text-anchor='middle'>ページ、章を</text><text x='1124' y='274' font-size='30' fill='#1d2733' text-anchor='middle'>付ける</text><rect x='1310' y='70' width='276' height='254' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1448' y='128' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>索引</text><text x='1448' y='190' font-size='30' fill='#1d2733' text-anchor='middle'>インデックスに</text><text x='1448' y='232' font-size='30' fill='#1d2733' text-anchor='middle'>入れる</text><g><path d='M292 205 L314 205' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='336,205 314,217 314,193' fill='#1864ab'/><path d='M616 205 L638 205' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='660,205 638,217 638,193' fill='#1864ab'/><path d='M940 205 L962 205' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='984,205 962,217 962,193' fill='#1864ab'/><path d='M1264 205 L1286 205' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1308,205 1286,217 1286,193' fill='#1864ab'/><text x='800' y='40' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 前の段の結果を、次の段が受け取って進む</text></g><g><rect x='14' y='70' width='276' height='254' rx='10' fill='none' stroke='#d9480f' stroke-width='9'/><path d='M152 394 L152 354' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='152,332 164,354 140,354' fill='#d9480f'/><text x='152' y='436' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 文字化けや</text><text x='152' y='472' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>読み落としは、</text><text x='152' y='508' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>後のどの段でも</text><text x='152' y='544' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>取り戻せない</text></g><g><rect x='986' y='70' width='276' height='254' rx='10' fill='none' stroke='#1864ab' stroke-width='9'/><path d='M1124 394 L1124 354' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1124,332 1136,354 1112,354' fill='#1864ab'/><text x='1124' y='436' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>③ 切る段の直後に</text><text x='1124' y='472' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>付ける。後から</text><text x='1124' y='508' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>足すのは難しい</text></g><g><rect x='1310' y='70' width='276' height='254' rx='10' fill='none' stroke='#2b8a3e' stroke-width='9'/><path d='M1448 394 L1448 354' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1448,332 1460,354 1436,354' fill='#2b8a3e'/><text x='1448' y='436' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 検索できる</text><text x='1448' y='472' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>状態にする。</text><text x='1448' y='508' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>入れ直し方も</text><text x='1448' y='544' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>ここで決める</text></g></svg>
