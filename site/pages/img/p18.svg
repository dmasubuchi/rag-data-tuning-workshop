<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='500' fill='#ffffff'/><g><rect x='20' y='10' width='520' height='120' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='280' y='58' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>問い1</text><text x='280' y='102' font-size='30' fill='#1d2733' text-anchor='middle'>文字を選択できるか</text><rect x='830' y='10' width='750' height='120' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='862' y='58' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>はい</text><text x='982' y='58' font-size='30' fill='#1d2733' text-anchor='start'>そのまま文字を取り出す</text><text x='862' y='104' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>いいえ</text><text x='982' y='104' font-size='30' fill='#1d2733' text-anchor='start'>OCR で文字を起こす</text><path d='M542 70 L806 70' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='828,70 806,82 806,58' fill='#1864ab'/><text x='685' y='52' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 取り出し方</text></g><g><path d='M280 132 L280 162' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='280,184 268,162 292,162' fill='#5b6675'/><rect x='20' y='186' width='520' height='120' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='280' y='234' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>問い2</text><text x='280' y='278' font-size='30' fill='#1d2733' text-anchor='middle'>構造（表、見出し）を残すか</text><rect x='830' y='186' width='750' height='120' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='862' y='234' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>はい</text><text x='982' y='234' font-size='30' fill='#1d2733' text-anchor='start'>レイアウトを読む処理を通す</text><text x='862' y='280' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>いいえ</text><text x='982' y='280' font-size='30' fill='#1d2733' text-anchor='start'>文字を取り出して切るだけ</text><path d='M542 246 L806 246' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='828,246 806,258 806,234' fill='#d9480f'/><text x='685' y='228' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 構造の扱い</text></g><g><path d='M280 308 L280 338' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='280,360 268,338 292,338' fill='#5b6675'/><rect x='20' y='362' width='520' height='120' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='280' y='410' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>問い3</text><text x='280' y='454' font-size='30' fill='#1d2733' text-anchor='middle'>絵そのものに意味があるか</text><rect x='830' y='362' width='750' height='120' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='862' y='410' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>はい</text><text x='982' y='410' font-size='30' fill='#1d2733' text-anchor='start'>説明文を作る、または絵をベクトルにする</text><text x='862' y='456' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>いいえ</text><text x='982' y='456' font-size='30' fill='#1d2733' text-anchor='start'>絵は使わず文字だけ</text><path d='M542 422 L806 422' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='828,422 806,434 806,410' fill='#2b8a3e'/><text x='685' y='404' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ 絵の扱い</text></g></svg>
