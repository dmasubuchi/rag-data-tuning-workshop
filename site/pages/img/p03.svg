<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 1600 540" width="1600" height="540" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='20' width='1600' height='540' fill='#ffffff'/><circle cx='110' cy='215' r='38' fill='#5b6675'/><path d='M44 375 Q44 275 110 275 Q176 275 176 375 Z' fill='#5b6675'/><text x='110' y='150' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>利用者</text><rect x='290' y='40' width='570' height='200' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='575' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>キーワード検索（BM25）</text><text x='575' y='150' font-size='30' fill='#1d2733' text-anchor='middle'>そのままの言葉（REQ-042）に強い</text><text x='575' y='194' font-size='30' fill='#1d2733' text-anchor='middle'>言い換えに弱い</text><rect x='290' y='300' width='570' height='200' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='575' y='352' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>ベクトル検索</text><text x='575' y='410' font-size='30' fill='#1d2733' text-anchor='middle'>言い換え（目が不自由な武将）に強い</text><text x='575' y='454' font-size='30' fill='#1d2733' text-anchor='middle'>型番や数字のちょうど一致に弱い</text><rect x='980' y='170' width='180' height='200' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1070' y='222' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>RRF</text><text x='1070' y='280' font-size='26' fill='#5b6675' text-anchor='middle'>順位で</text><text x='1070' y='318' font-size='26' fill='#5b6675' text-anchor='middle'>まとめる</text><rect x='1362' y='170' width='228' height='200' rx='10' fill='#fff' stroke='#2b8a3e' stroke-width='4'/><text x='1476' y='222' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='middle'>順位の列</text><text x='1476' y='280' font-size='26' fill='#5b6675' text-anchor='middle'>1列にまとめた</text><text x='1476' y='318' font-size='26' fill='#5b6675' text-anchor='middle'>結果</text><g><path d='M180 235 L271 155' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='288,140 279,164 264,146' fill='#1864ab'/><path d='M180 295 L272 385' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='288,400 264,393 281,376' fill='#1864ab'/><text x='110' y='430' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 同じ質問を</text><text x='110' y='466' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>両方に送る</text></g><g><path d='M862 140 L961 221' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='978,235 953,230 969,212' fill='#d9480f'/><path d='M862 400 L961 319' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='978,305 969,328 953,310' fill='#d9480f'/><text x='915' y='280' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 順位</text></g><g><path d='M1162 270 L1338 270' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1360,270 1338,282 1338,258' fill='#2b8a3e'/><text x='1261' y='240' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ まとめる</text></g><g><text x='890' y='430' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>④ 片方だけでは拾えない文書も、</text><text x='890' y='466' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>上位に入ることがある</text><text x='890' y='516' font-size='26' fill='#5b6675' text-anchor='start'>返る @search.score は RRF の点数で、</text><text x='890' y='550' font-size='26' fill='#5b6675' text-anchor='start'>BM25 の点数とは別物</text></g></svg>
