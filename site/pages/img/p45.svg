' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>採点する</text></g><g><path d='M592 200 L874 258' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='896,262 872,269 877,246' fill='#d9480f'/><path d='M592 470 L875 360' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='896,352 880,371 871,349' fill='#d9480f'/><text x='750' y='312' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 点数を</text><text x='750' y='346' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>並べる</text><rect x='900' y='215' width='380' height='180' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1090' y='268' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>突き合わせる</text><text x='1090' y='316' font-size='26' fill='#5b6675' text-anchor='middle'>ずれた例を並べて、</text><text x='1090' y='352' font-size='26' fill='#5b6675' text-anchor='middle'>基準の言葉を直す</text></g><g><path d='M1090 213 L1090 24 L110 24 L110 271' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='110,293 98,271 122,271' fill='#5b6675'/><text x='830' y='68' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>③ 直した基準で、もう一度採点する</text></g><g><text x='1430' y='280' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ そろうまで</text><text x='1430' y='314' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>くり返す</text><text x='1430' y='360' font-size='26' fill='#5b6675' text-anchor='middle'>一致した割合や</text><text x='1430' y='396' font-size='26' fill='#5b6675' text-anchor='middle'>相関を見る</text></g></svg>
