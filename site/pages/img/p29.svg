<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 1600 625" width="1600" height="625" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='20' width='1600' height='625' fill='#ffffff'/><rect x='40' y='70' width='300' height='420' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='190' y='50' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>元の場所</text><rect x='1260' y='70' width='300' height='420' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1410' y='50' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>インデックス</text><g><path d='M62 95 H116 L142 121 V205 H62 Z' fill='#fff' stroke='#1864ab' stroke-width='4'/><path d='M116 95 V121 H142' fill='none' stroke='#1864ab' stroke-width='4'/><line x1='76' y1='139' x2='128' y2='139' stroke='#c9d6e6' stroke-width='5'/><line x1='76' y1='157' x2='128' y2='157' stroke='#c9d6e6' stroke-width='5'/><line x1='76' y1='175' x2='128' y2='175' stroke='#c9d6e6' stroke-width='5'/><line x1='76' y1='193' x2='128' y2='193' stroke='#c9d6e6' stroke-width='5'/><text x='160' y='159' font-size='26' fill='#1864ab' text-anchor='start'>更新された</text><path d='M1282 95 H1336 L1362 121 V205 H1282 Z' fill='#fff' stroke='#1864ab' stroke-width='4'/><path d='M1336 95 V121 H1362' fill='none' stroke='#1864ab' stroke-width='4'/><line x1='1296' y1='139' x2='1348' y2='139' stroke='#c9d6e6' stroke-width='5'/><line x1='1296' y1='157' x2='1348' y2='157' stroke='#c9d6e6' stroke-width='5'/><line x1='1296' y1='175' x2='1348' y2='175' stroke='#c9d6e6' stroke-width='5'/><line x1='1296' y1='193' x2='1348' y2='193' stroke='#c9d6e6' stroke-width='5'/><text x='1380' y='159' font-size='26' fill='#1864ab' text-anchor='start'>入れ直される</text><path d='M342 150 L1236 150' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='1258,150 1236,162 1236,138' fill='#1864ab'/><text x='800' y='124' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 前回のあとに更新された文書だけを入れ直す</text><text x='800' y='194' font-size='26' fill='#5b6675' text-anchor='middle'>Blob は最終更新日、SQL は更新日などの列か変更追跡で見分ける</text></g><g><path d='M62 225 H116 L142 251 V335 H62 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M116 225 V251 H142' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='76' y1='269' x2='128' y2='269' stroke='#c9d6e6' stroke-width='5'/><line x1='76' y1='287' x2='128' y2='287' stroke='#c9d6e6' stroke-width='5'/><line x1='76' y1='305' x2='128' y2='305' stroke='#c9d6e6' stroke-width='5'/><line x1='76' y1='323' x2='128' y2='323' stroke='#c9d6e6' stroke-width='5'/><text x='160' y='289' font-size='26' fill='#d9480f' text-anchor='start'>印を付けた</text><rect x='1282' y='225' width='80' height='110' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4' stroke-dasharray='14 10'/><text x='1380' y='289' font-size='26' fill='#2b8a3e' text-anchor='start'>外れる</text><path d='M342 280 L1236 280' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1258,280 1236,292 1236,268' fill='#2b8a3e'/><text x='800' y='254' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>② 目印（論理削除）のある文書は、索引からも外す</text><text x='800' y='324' font-size='26' fill='#5b6675' text-anchor='middle'>Blob に印（例：IsDeleted=true）を付け、外してから Blob を消す</text></g><g><rect x='62' y='355' width='80' height='110' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4' stroke-dasharray='14 10'/><text x='160' y='419' font-size='26' fill='#5b6675' text-anchor='start'>消えた</text><path d='M1282 355 H1336 L1362 381 V465 H1282 Z' fill='#fff' stroke='#d9480f' stroke-width='4'/><path d='M1336 355 V381 H1362' fill='none' stroke='#d9480f' stroke-width='4'/><line x1='1296' y1='399' x2='1348' y2='399' stroke='#c9d6e6' stroke-width='5'/><line x1='1296' y1='417' x2='1348' y2='417' stroke='#c9d6e6' stroke-width='5'/><line x1='1296' y1='435' x2='1348' y2='435' stroke='#c9d6e6' stroke-width='5'/><line x1='1296' y1='453' x2='1348' y2='453' stroke='#c9d6e6' stroke-width='5'/><text x='1380' y='419' font-size='26' fill='#d9480f' text-anchor='start'>残る</text><path d='M342 410 L1236 410' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='1258,410 1236,422 1236,398' fill='#5b6675'/><text x='800' y='384' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>③ 目印なしで消すと、インデクサーは気づかない</text><text x='800' y='454' font-size='26' fill='#d9480f' text-anchor='middle'>古い文書が、検索の結果に出続ける</text></g><g><path d='M342 572 L1236 572' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1258,572 1236,584 1236,560' fill='#2b8a3e'/><text x='800' y='546' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 削除の検出は、最初のインデクサー実行から設定する</text><text x='800' y='616' font-size='26' fill='#d9480f' text-anchor='middle'>あとから設定しても、リセットしても、それ以前に消した Blob の文書は索引に残る</text></g></svg>
