<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 1600 550" width="1600" height="550" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='25' width='1600' height='550' fill='#ffffff'/><circle cx='150' cy='290' r='38' fill='#1864ab'/><path d='M84 450 Q84 350 150 350 Q216 350 216 450 Z' fill='#1864ab'/><circle cx='138' cy='290' r='10' fill='none' stroke='#fff' stroke-width='4'/><circle cx='162' cy='290' r='10' fill='none' stroke='#fff' stroke-width='4'/><line x1='148' y1='290' x2='152' y2='290' stroke='#fff' stroke-width='4'/><text x='150' y='200' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>アプリ</text><text x='150' y='238' font-size='26' fill='#5b6675' text-anchor='middle'>（api-version を指定）</text><rect x='600' y='40' width='970' height='225' rx='10' fill='#fff' stroke='#2b8a3e' stroke-width='4'/><text x='630' y='92' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='start'>GA（2026-04-01）</text><text x='630' y='145' font-size='30' fill='#1d2733' text-anchor='start'>ナレッジソース：インデックス、Blob、OneLake、Web</text><text x='630' y='190' font-size='30' fill='#1d2733' text-anchor='start'>取得：抽出型（見つけた内容を返す）</text><text x='630' y='235' font-size='30' fill='#1d2733' text-anchor='start'>reasoning effort：minimal だけ</text><g><path d='M222 305 L312 305 L312 147 L576 147' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='598,147 576,159 576,135' fill='#2b8a3e'/><text x='455' y='118' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>① GA を指定</text></g><g><rect x='600' y='335' width='970' height='225' rx='10' fill='#fff' stroke='#d9480f' stroke-width='4' stroke-dasharray='14 10'/><text x='630' y='387' font-size='34' fill='#d9480f' font-weight='700' text-anchor='start'>プレビュー（2026-08-01-preview）：GA に加えて</text><text x='630' y='440' font-size='30' fill='#1d2733' text-anchor='start'>ナレッジソース：SharePoint、Azure SQL、MCP サーバーなど</text><text x='630' y='485' font-size='30' fill='#1d2733' text-anchor='start'>取得：回答の合成（LLM が回答を作る）</text><text x='630' y='530' font-size='30' fill='#1d2733' text-anchor='start'>reasoning effort：low、medium、auto</text><path d='M222 335 L312 335 L312 442 L576 442' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='598,442 576,454 576,430' fill='#d9480f'/><text x='455' y='412' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② プレビューを指定</text></g><g><path d='M680 333 L680 290' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='680,268 692,290 668,290' fill='#5b6675'/><text x='710' y='308' font-size='28' fill='#5b6675' font-weight='700' text-anchor='start'>③ 本番で使うなら、GA の範囲かを確かめる</text></g></svg>
