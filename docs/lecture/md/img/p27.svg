<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 490" width="1600" height="490" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='490' fill='#ffffff'/><rect x='20' y='60' width='230' height='170' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='135' y='122' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>データソース</text><text x='135' y='170' font-size='26' fill='#5b6675' text-anchor='middle'>置き場所への</text><text x='135' y='204' font-size='26' fill='#5b6675' text-anchor='middle'>接続</text><rect x='455' y='60' width='230' height='170' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='570' y='122' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>インデクサー</text><text x='570' y='170' font-size='26' fill='#5b6675' text-anchor='middle'>取りに行く係</text><rect x='890' y='60' width='230' height='170' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1005' y='122' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>スキルセット</text><text x='1005' y='170' font-size='26' fill='#5b6675' text-anchor='middle'>途中の加工</text><rect x='1325' y='60' width='230' height='170' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1440' y='122' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>インデックス</text><text x='1440' y='170' font-size='26' fill='#5b6675' text-anchor='middle'>入れる先の</text><text x='1440' y='204' font-size='26' fill='#5b6675' text-anchor='middle'>欄の定義</text><g><path d='M252 145 L431 145' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='453,145 431,157 431,133' fill='#1864ab'/><text x='352' y='112' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 取りに行く</text><text x='20' y='290' font-size='26' fill='#1d2733' text-anchor='start'>Blob、ADLS Gen2、</text><text x='20' y='326' font-size='26' fill='#1d2733' text-anchor='start'>SQL、Cosmos DB など</text></g><g><path d='M687 145 L866 145' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='888,145 866,157 866,133' fill='#1864ab'/><text x='787' y='112' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>② 加工する</text><text x='849' y='290' font-size='26' fill='#5b6675' font-weight='700' text-anchor='start'>組み込みのスキル</text><text x='849' y='326' font-size='26' fill='#1d2733' text-anchor='start'>OCR、Document Layout、</text><text x='849' y='362' font-size='26' fill='#1d2733' text-anchor='start'>Text Split、埋め込み</text><text x='849' y='410' font-size='26' fill='#1d2733' text-anchor='start'>カスタムの Web API スキル</text></g><g><path d='M1122 145 L1301 145' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1323,145 1301,157 1301,133' fill='#2b8a3e'/><text x='1222' y='112' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ 入れる</text><text x='1440' y='290' font-size='26' fill='#1d2733' text-anchor='middle'>outputFieldMappings</text><text x='1440' y='326' font-size='26' fill='#1d2733' text-anchor='middle'>で、スキルの出力を</text><text x='1440' y='362' font-size='26' fill='#1d2733' text-anchor='middle'>欄に入れる</text></g><g><path d='M570 232 L570 276' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='570,298 558,276 582,276' fill='#5b6675'/><text x='590' y='276' font-size='28' fill='#5b6675' font-weight='700' text-anchor='start'>④ 動かす</text><rect x='350' y='300' width='440' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='570' y='346' font-size='30' fill='#5b6675' font-weight='700' text-anchor='middle'>動かし方と記録</text><text x='570' y='392' font-size='26' fill='#1d2733' text-anchor='middle'>schedule：決まった間隔で動かす</text><text x='570' y='430' font-size='26' fill='#1d2733' text-anchor='middle'>実行の記録：成功と失敗の件数、</text><text x='570' y='466' font-size='26' fill='#1d2733' text-anchor='middle'>失敗の理由が見られる</text></g></svg>
