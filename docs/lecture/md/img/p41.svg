<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 560" width="1600" height="560" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='560' fill='#ffffff'/><rect x='40' y='50' width='380' height='140' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='230' y='106' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>実際の質問</text><text x='230' y='150' font-size='26' fill='#5b6675' text-anchor='middle'>問い合わせ、利用者の質問</text><circle cx='780' cy='240' r='38' fill='#5b6675'/><path d='M714 400 Q714 300 780 300 Q846 300 846 400 Z' fill='#5b6675'/><text x='780' y='170' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>人</text><g><path d='M424 140 L679 225' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='700,232 675,236 683,214' fill='#1864ab'/><text x='470' y='112' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>① 集める</text></g><g><path d='M50 360 H114 L140 386 V476 H50 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M114 360 V386 H140' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='64' y1='404' x2='126' y2='404' stroke='#c9d6e6' stroke-width='5'/><line x1='64' y1='422' x2='126' y2='422' stroke='#c9d6e6' stroke-width='5'/><line x1='64' y1='440' x2='126' y2='440' stroke='#c9d6e6' stroke-width='5'/><line x1='64' y1='458' x2='126' y2='458' stroke='#c9d6e6' stroke-width='5'/><text x='95' y='512' font-size='30' fill='#1d2733' text-anchor='middle'>文書</text><circle cx='330' cy='420' r='38' fill='#1864ab'/><path d='M264 580 Q264 480 330 480 Q396 480 396 580 Z' fill='#1864ab'/><circle cx='318' cy='420' r='10' fill='none' stroke='#fff' stroke-width='4'/><circle cx='342' cy='420' r='10' fill='none' stroke='#fff' stroke-width='4'/><line x1='328' y1='420' x2='332' y2='420' stroke='#fff' stroke-width='4'/><text x='330' y='360' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>生成 AI</text><path d='M142 430 L264 430' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='286,430 264,442 264,418' fill='#5b6675'/><text x='215' y='400' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>読ませる</text><path d='M398 440 L691 358' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='712,352 694,369 688,346' fill='#5b6675'/><text x='430' y='492' font-size='28' fill='#5b6675' font-weight='700' text-anchor='start'>② 質問と答えの下書き</text></g><g><path d='M852 320 L1016 320' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1038,320 1016,332 1016,308' fill='#2b8a3e'/><text x='945' y='256' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ 読んで</text><text x='945' y='290' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>直す、外す</text><rect x='1040' y='60' width='520' height='500' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1300' y='116' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>正解データ</text></g><g><text x='1300' y='160' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 1件は、この3つの組</text><text x='1080' y='226' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>質問</text><text x='1080' y='264' font-size='26' fill='#5b6675' text-anchor='start'>利用者が実際に</text><text x='1080' y='298' font-size='26' fill='#5b6675' text-anchor='start'>聞きそうな文</text><text x='1080' y='342' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>期待する答え</text><text x='1080' y='380' font-size='26' fill='#5b6675' text-anchor='start'>人が確かめた答え。</text><text x='1080' y='414' font-size='26' fill='#5b6675' text-anchor='start'>回答の評価で使う</text><text x='1080' y='458' font-size='30' fill='#d9480f' font-weight='700' text-anchor='start'>根拠の文書と場所</text><text x='1080' y='496' font-size='26' fill='#5b6675' text-anchor='start'>答えが書かれている文書と</text><text x='1080' y='530' font-size='26' fill='#5b6675' text-anchor='start'>チャンク。検索の評価で使う</text></g></svg>
