<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 520" width="1600" height="520" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='520' fill='#ffffff'/><rect x='40' y='40' width='860' height='480' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='470' y='92' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>オントロジー</text><text x='470' y='130' font-size='26' fill='#5b6675' text-anchor='middle'>どんな「もの」と「関係」があるかの決まり</text><g><rect x='70' y='160' width='800' height='90' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='100' y='216' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>① 種類（クラス）</text><text x='440' y='216' font-size='30' fill='#1d2733' text-anchor='start'>人　会社　部署</text></g><g><rect x='70' y='270' width='800' height='130' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='100' y='326' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>② 関係の型</text><text x='440' y='322' font-size='30' fill='#1d2733' text-anchor='start'>人 → 所属 → 会社</text><text x='440' y='370' font-size='30' fill='#1d2733' text-anchor='start'>会社 → 提携 → 会社</text></g><g><rect x='70' y='420' width='800' height='90' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='100' y='476' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>③ 決まり</text><text x='440' y='476' font-size='30' fill='#1d2733' text-anchor='start'>社長は会社に1人</text></g><g><rect x='1200' y='160' width='360' height='360' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='1380' y='214' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>取り出した結果</text><text x='1380' y='252' font-size='26' fill='#5b6675' text-anchor='middle'>（生成 AI が文書から）</text><text x='1380' y='330' font-size='26' fill='#1d2733' text-anchor='middle'>「所属」「勤務」</text><text x='1380' y='364' font-size='26' fill='#1d2733' text-anchor='middle'>「在籍」</text><text x='1380' y='470' font-size='26' fill='#1d2733' text-anchor='middle'>社長が2人</text><path d='M902 335 L1176 335' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1198,335 1176,347 1176,323' fill='#2b8a3e'/><text x='1050' y='305' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ そろえる</text><path d='M902 465 L1176 465' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1198,465 1176,477 1176,453' fill='#d9480f'/><text x='1050' y='400' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>④ 合わない</text><text x='1050' y='434' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>結果を見つける</text></g></svg>
