<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" width="1600" height="580" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='580' fill='#ffffff'/><rect x='20' y='20' width='420' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M44 56 H98 L124 82 V160 H44 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M98 56 V82 H124' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='58' y1='100' x2='110' y2='100' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='118' x2='110' y2='118' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='136' x2='110' y2='136' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='154' x2='110' y2='154' stroke='#c9d6e6' stroke-width='5'/><text x='150' y='98' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>文字ありの PDF</text><text x='150' y='140' font-size='26' fill='#5b6675' text-anchor='start'>文字のデータが</text><text x='150' y='176' font-size='26' fill='#5b6675' text-anchor='start'>入っている</text><rect x='20' y='250' width='420' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M44 286 H98 L124 312 V390 H44 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M98 286 V312 H124' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='58' y1='330' x2='110' y2='330' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='348' x2='110' y2='348' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='366' x2='110' y2='366' stroke='#c9d6e6' stroke-width='5'/><line x1='58' y1='384' x2='110' y2='384' stroke='#c9d6e6' stroke-width='5'/><text x='150' y='328' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>画像だけの PDF</text><text x='150' y='370' font-size='26' fill='#5b6675' text-anchor='start'>スキャンした紙など</text><text x='150' y='406' font-size='26' fill='#5b6675' text-anchor='start'>文字のデータがない</text><rect x='620' y='20' width='460' height='190' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='850' y='74' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>そのまま取り出す</text><text x='850' y='116' font-size='26' fill='#1d2733' text-anchor='middle'>標準の取り出しで content に入る</text><text x='850' y='152' font-size='26' fill='#1d2733' text-anchor='middle'>表は Document Layout スキルで</text><text x='850' y='188' font-size='26' fill='#1d2733' text-anchor='middle'>表として読み取る</text><rect x='620' y='250' width='460' height='190' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='850' y='304' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>OCR で文字を起こす</text><text x='850' y='346' font-size='26' fill='#1d2733' text-anchor='middle'>imageAction で画像を取り出し、</text><text x='850' y='382' font-size='26' fill='#1d2733' text-anchor='middle'>OCR スキルに渡す</text><text x='850' y='418' font-size='26' fill='#1d2733' text-anchor='middle'>読み間違いが出ることがある</text><g><path d='M442 115 L596 115' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='618,115 596,127 596,103' fill='#1864ab'/><path d='M442 345 L596 345' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='618,345 596,357 596,333' fill='#1864ab'/><text x='530' y='96' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 読む</text><text x='530' y='326' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 読む</text></g><g><rect x='1300' y='20' width='280' height='190' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1440' y='74' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>出典</text><text x='1440' y='116' font-size='26' fill='#1d2733' text-anchor='middle'>ファイル名・ページ</text><text x='1440' y='152' font-size='26' fill='#1d2733' text-anchor='middle'>種類：text・table</text><rect x='1300' y='250' width='280' height='190' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1440' y='304' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>出典</text><text x='1440' y='346' font-size='26' fill='#1d2733' text-anchor='middle'>ファイル名・ページ</text><text x='1440' y='382' font-size='26' fill='#1d2733' text-anchor='middle'>種類：ocr</text><path d='M1082 115 L1276 115' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1298,115 1276,127 1276,103' fill='#d9480f'/><path d='M1082 345 L1276 345' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1298,345 1276,357 1276,333' fill='#d9480f'/><text x='1190' y='96' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 出典を残す</text><text x='1190' y='326' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 出典を残す</text></g><g><text x='800' y='496' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ PDF はページが固定されていて、「何ページ」が一番確かめやすい</text></g><g><text x='800' y='542' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 文字のページと画像のページは混ざる。種類は、ページやチャンクごとに持つ</text></g></svg>
