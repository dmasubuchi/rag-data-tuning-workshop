<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 570" width="1600" height="570" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='570' fill='#ffffff'/><text x='40' y='66' font-size='26' fill='#5b6675' font-weight='700' text-anchor='start'>取り込みのとき</text><path d='M40 112 H104 L130 138 V228 H40 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M104 112 V138 H130' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='54' y1='156' x2='116' y2='156' stroke='#c9d6e6' stroke-width='5'/><line x1='54' y1='174' x2='116' y2='174' stroke='#c9d6e6' stroke-width='5'/><line x1='54' y1='192' x2='116' y2='192' stroke='#c9d6e6' stroke-width='5'/><line x1='54' y1='210' x2='116' y2='210' stroke='#c9d6e6' stroke-width='5'/><text x='85' y='262' font-size='30' fill='#1d2733' text-anchor='middle'>チャンク</text><g><path d='M142 170 L303 170' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='325,170 303,182 303,158' fill='#5b6675'/><text x='233' y='138' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>① 取り出す</text><text x='233' y='212' font-size='26' fill='#5b6675' text-anchor='middle'>（生成 AI）</text><rect x='327' y='90' width='280' height='160' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='467.0' y='142' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>関係の図</text><text x='467.0' y='190' font-size='26' fill='#5b6675' text-anchor='middle'>人、組織、出来事と</text><text x='467.0' y='226' font-size='26' fill='#5b6675' text-anchor='middle'>その間の関係</text></g><g><path d='M609 170 L780 170' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='802,170 780,182 780,158' fill='#5b6675'/><text x='705' y='138' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>② まとめる</text><rect x='804' y='90' width='280' height='160' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='944.0' y='142' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>コミュニティ</text><text x='944.0' y='190' font-size='26' fill='#5b6675' text-anchor='middle'>つながりの強い</text><text x='944.0' y='226' font-size='26' fill='#5b6675' text-anchor='middle'>まとまり</text></g><g><path d='M1086 170 L1257 170' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='1279,170 1257,182 1257,158' fill='#5b6675'/><text x='1182' y='138' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>③ 要約する</text><text x='1182' y='212' font-size='26' fill='#5b6675' text-anchor='middle'>（生成 AI）</text><rect x='1281' y='90' width='280' height='160' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1421.0' y='142' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>要約</text><text x='1421.0' y='190' font-size='26' fill='#5b6675' text-anchor='middle'>まとまりごとの</text><text x='1421.0' y='226' font-size='26' fill='#5b6675' text-anchor='middle'>要約</text></g><g><text x='40' y='420' font-size='26' fill='#5b6675' font-weight='700' text-anchor='start'>質問のとき</text><rect x='240' y='380' width='460' height='200' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='470.0' y='430' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>特定のものを聞く質問</text><text x='470.0' y='478' font-size='26' fill='#5b6675' text-anchor='middle'>そのものの周りの関係と</text><text x='470.0' y='514' font-size='26' fill='#5b6675' text-anchor='middle'>チャンクで答える</text><text x='470.0' y='550' font-size='26' fill='#5b6675' text-anchor='middle'>（local search）</text><rect x='1120' y='380' width='440' height='200' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1340.0' y='430' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>全体を聞く質問</text><text x='1340.0' y='478' font-size='26' fill='#5b6675' text-anchor='middle'>例：この資料の主な話題は何か</