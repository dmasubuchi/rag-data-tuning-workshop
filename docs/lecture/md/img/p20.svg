<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='620' fill='#ffffff'/><text x='290' y='132' font-size='30' fill='#5b6675' font-weight='700' text-anchor='middle'>単純な文書の検索</text><rect x='20' y='150' width='540' height='190' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M52 188 H112 L138 214 V300 H52 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M112 188 V214 H138' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='66' y1='232' x2='124' y2='232' stroke='#c9d6e6' stroke-width='5'/><line x1='66' y1='250' x2='124' y2='250' stroke='#c9d6e6' stroke-width='5'/><line x1='66' y1='268' x2='124' y2='268' stroke='#c9d6e6' stroke-width='5'/><line x1='66' y1='286' x2='124' y2='286' stroke='#c9d6e6' stroke-width='5'/><text x='170' y='232' font-size='30' fill='#1d2733' font-weight='700' text-anchor='start'>文書 1本</text><text x='170' y='282' font-size='30' fill='#1d2733' text-anchor='start'>＝ 1つの検索の単位</text><g><path d='M290 344 L290 390' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='290,412 278,390 302,390' fill='#d9480f'/><text x='290' y='452' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>① 当たれば文書全体が返る。</text><text x='290' y='488' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>答えがどこにあるかは読む人が探す</text></g><g><text x='1110' y='36' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'>文書の中の構造の検索</text><rect x='880' y='60' width='460' height='80' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1110' y='112' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>文書（親）</text><rect x='640' y='240' width='260' height='80' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='770' y='292' font-size='30' fill='#1864ab' font-weight='700' text-anchor='middle'