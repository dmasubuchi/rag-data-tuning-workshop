<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 630" width="1600" height="630" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='630' fill='#ffffff'/><path d='M130 590 L678 590' fill='none' stroke='#5b6675' stroke-width='4' stroke-linejoin='round'/><polygon points='700,590 678,602 678,578' fill='#5b6675'/><path d='M130 590 L130 102' fill='none' stroke='#5b6675' stroke-width='4' stroke-linejoin='round'/><polygon points='130,80 142,102 118,102' fill='#5b6675'/><text x='716' y='600' font-size='30' fill='#5b6675' text-anchor='start'>甘い</text><text x='130' y='50' font-size='30' fill='#5b6675' text-anchor='middle'>辛い</text><g><circle cx='286' cy='226' r='14' fill='#1864ab'/><text x='312' y='224' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>インドのカレー</text><circle cx='234' cy='122' r='14' fill='#1864ab'/><text x='260' y='120' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>四川の麻婆豆腐</text><circle cx='598' cy='538' r='14' fill='#d9480f'/><text x='572' y='536' font-size='30' fill='#d9480f' font-weight='700' text-anchor='end'>日本の大福</text><text x='800' y='100' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>① 料理を「甘さ」と「辛さ」の2つの数で</text><text x='800' y='142' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>表すと、似た料理が近くに並ぶ</text></g><g><text x='312' y='260' font-size='26' fill='#5b6675' text-anchor='start'>（甘さ 3、辛さ 7）</text><text x='260' y='156' font-size='26' fill='#5b6675' text-anchor='start'>（甘さ 2、辛さ 9）</text><text x='572' y='572' font-size='26' fill='#5b6675' text-anchor='end'>（甘さ 9、辛さ 1）</text><text x='800' y='205' font-size='30' fill='#5b6675' text-anchor='start'>1つの料理を、2個の数で表している</text></g><g><text x='800' y='300' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>② 文も同じ。意味を数の並びで表す（実際の値）</text><path d='M800 335 H854 L880 361 V439 H800 Z' fill='#fff' stroke='#5b6675' stroke-width='4'/><path d='M854 335 V361 H880' fill='none' stroke='#5b6675' stroke-width='4'/><line x1='814' y1='379' x2='866' y2='379' stroke='#c9d6e6' stroke-width='5'/><line x1='814' y1='397' x2='866' y2='397' stroke='#c9d6e6' stroke-width='5'/><line x1='814' y1='415' x2='866' y2='415' stroke='#c9d6e6' stroke-width='5'/><line x1='814' y1='433' x2='866' y2='433' stroke='#c9d6e6' stroke-width='5'/><path d='M890 387 L914 387' fill='none' stroke='#1864ab' stroke-width='6' stroke-linejoin='round'/><polygon points='936,387 914,399 914,375' fill='#1864ab'/><rect x='940' y='355' width='140' height='64' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='3'/><text x='1010' y='397' font-size='26' fill='#1864ab' font-weight='700' text-anchor='middle'>+0.0745</text><rect x='1086' y='355' width='140' height='64' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='3'/><text x='1156' y='397' font-size='26' fill='#1864ab' font-weight='700' text-anchor='middle'>+0.0026</text><rect x='1232' y='355' width='140' height='64' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='3'/><text x='1302' y='397' font-size='26' fill='#1864ab' font-weight='700' text-anchor='middle'>-0.0056</text><text x='1398' y='400' font-size='34' fill='#5b6675' text-anchor='middle'>…</text><rect x='1424' y='355' width='140' height='64' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='3'/><text x='1494' y='397' font-size='26' fill='#1864ab' font-weight='700' text-anchor='middle'>1536個目</text><text x='940' y='455' font-size='26' fill='#5b6675' text-anchor='start'>柴田勝家の文の最初の3個</text><text x='800' y='530' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>全部で 1536 個</text><text x='800' y='574' font-size='26' fill='#5b6675' text-anchor='start'>text-embedding-3-small の場合</text></g><g><circle cx='200' cy='330' r='14' fill='#5b6675'/><text x='226' y='338' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>質問</text><path d='M208 316 L260 257' fill='none' stroke='#2b8a3e' stroke-width='5' stroke-linejoin='round'/><polygon points='274,240 269,264 251,249' fill='#2b8a3e'/><path d='M196 316 L226 162' fill='none' stroke='#2b8a3e' stroke-width='5' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='230,140 238,164 214,159' fill='#2b8a3e'/><text x='300' y='430' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='start'>③ 質問に近い順に返す</text></g></svg>
