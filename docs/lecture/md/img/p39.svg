<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 560" width="1600" height="560" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='560' fill='#ffffff'/><g><rect x='40' y='100' width='360' height='180' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='220' y='154' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>正解データ</text><text x='220' y='200' font-size='26' fill='#5b6675' text-anchor='middle'>質問と</text><text x='220' y='236' font-size='26' fill='#5b6675' text-anchor='middle'>期待する答えの組</text><circle cx='740' cy='130' r='38' fill='#1864ab'/><path d='M674 290 Q674 190 740 190 Q806 190 806 290 Z' fill='#1864ab'/><circle cx='728' cy='130' r='10' fill='none' stroke='#fff' stroke-width='4'/><circle cx='752' cy='130' r='10' fill='none' stroke='#fff' stroke-width='4'/><line x1='738' y1='130' x2='742' y2='130' stroke='#fff' stroke-width='4'/><text x='740' y='70' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>RAG アプリ</text><path d='M402 190 L646 190' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='668,190 646,202 646,178' fill='#1864ab'/><text x='535' y='124' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 同じ質問を</text><text x='535' y='158' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>投げる</text></g><g><path d='M808 190 L1036 190' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1058,190 1036,202 1036,178' fill='#d9480f'/><text x='933' y='96' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 回答と</text><text x='933' y='130' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>コンテキスト</text><text x='933' y='164' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>を集める</text><rect x='1060' y='100' width='500' height='180' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1310' y='154' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>採点</text><text x='1310' y='200' font-size='26' fill='#5b6675' text-anchor='middle'>生成 AI（GPT など）に採点させる</text><text x='1310' y='236' font-size='26' fill='#5b6675' text-anchor='middle'>か、プログラムで数える</text></g><g><path d='M1090 282 L1090 356' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='1090,378 1078,356 1102,356' fill='#5b6675'/><path d='M1350 282 L1350 356' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='1350,378 1338,356 1362,356' fill='#5b6675'/><text x='1220' y='338' font-size='28' fill='#5b6675' font-weight='700' text-anchor='middle'>③ 分けて見る</text><rect x='740' y='380' width='370' height='200' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='925.0' y='434' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>検索の評価</text><text x='925.0' y='480' font-size='26' fill='#5b6675' text-anchor='middle'>正しい文書が上位に来たか</text><text x='925.0' y='516' font-size='26' fill='#5b6675' text-anchor='middle'>（NDCG、再現率）</text><rect x='1130' y='380' width='430' height='200' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1345.0' y='434' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>回答の評価</text><text x='1345.0' y='480' font-size='26' fill='#5b6675' text-anchor='middle'>根拠に沿っているか、</text><text x='1345.0' y='516' font-size='26' fill='#5b6675' text-anchor='middle'>質問に合っているか</text><text x='1345.0' y='552' font-size='26' fill='#5b6675' text-anchor='middle'>（groundedness、relevance）</text></g><g><text x='390' y='440' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>④ 分けておくと、悪い答えが</text><text x='390' y='474' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>検索のせいか生成のせいかを</text><text x='390' y='508' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>切り分けられる</text></g></svg>
