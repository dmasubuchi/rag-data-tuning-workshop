<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 580" width="1600" height="580" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='580' fill='#ffffff'/><rect x='40' y='190' width='320' height='160' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='200' y='242' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>質問</text><text x='200' y='292' font-size='26' fill='#1d2733' text-anchor='middle'>A社の社長が</text><text x='200' y='330' font-size='26' fill='#1d2733' text-anchor='middle'>提携している会社は？</text><rect x='500' y='60' width='400' height='170' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='700' y='112' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>文書1</text><text x='700' y='178' font-size='30' fill='#1d2733' text-anchor='middle'>A社の社長は山田さん</text><rect x='500' y='300' width='400' height='170' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='700' y='352' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>文書2</text><text x='700' y='408' font-size='30' fill='#1d2733' text-anchor='middle'>山田さんが</text><text x='700' y='450' font-size='30' fill='#1d2733' text-anchor='middle'>B社との提携を発表</text><g><path d='M362 240 L480 162' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='498,150 486,172 473,152' fill='#d9480f'/><path d='M362 300 L479 373' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='498,385 473,384 486,363' fill='#d9480f'/><text x='200' y='410' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>① 1件ずつ探すと、</text><text x='200' y='446' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>全部に合う1件がない</text></g><g><path d='M902 265 L1156 279' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round' stroke-dasharray='16 12'/><polygon points='1178,280 1155,291 1157,267' fill='#5b6675'/><text x='1040' y='222' font-size='26' fill='#5b6675' font-weight='700' text-anchor='middle'>② 人・会社・関係を</text><text x='1040' y='254' font-size='26' fill='#5b6675' font-weight='700' text-anchor='middle'>取り出して図にする</text><rect x='1180' y='40' width='320' height='100' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1340' y='102' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>A社</text><rect x='1180' y='230' width='320' height='100' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1340' y='292' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>山田さん</text><rect x='1180' y='420' width='320' height='100' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='1340' y='482' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>B社</text></g><g><path d='M1340 142 L1340 206' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1340,228 1328,206 1352,206' fill='#2b8a3e'/><text x='1362' y='195' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>社長</text><path d='M1340 332 L1340 396' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1340,418 1328,396 1352,396' fill='#2b8a3e'/><text x='1362' y='385' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>提携</text><text x='700' y='552' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>③ 関係を2歩たどると、2つの文書がつながる</text></g></svg>
