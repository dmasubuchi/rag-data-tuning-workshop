<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 1600 615" width="1600" height="615" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='15' width='1600' height='615' fill='#ffffff'/><text x='40' y='40' font-size='26' fill='#5b6675' font-weight='700' text-anchor='start'>検索の結果（上位3件。正解は2件）</text><rect x='40' y='50' width='540' height='70' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='68' y='97' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>1位　正解</text><rect x='40' y='132' width='540' height='70' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='68' y='179' font-size='30' fill='#5b6675' font-weight='700' text-anchor='start'>2位　外れ</text><rect x='40' y='214' width='540' height='70' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='68' y='261' font-size='30' fill='#1864ab' font-weight='700' text-anchor='start'>3位　正解</text><g><path d='M584 92 L776 92' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='798,92 776,104 776,80' fill='#1864ab'/><text x='691' y='66' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 拾えたか</text><rect x='800' y='50' width='760' height='190' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='830' y='100' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>再現率@3</text><text x='830' y='146' font-size='30' fill='#1d2733' text-anchor='start'>正解2件のうち、上位3件に2件入った</text><text x='830' y='190' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>再現率@3 ＝ 2 ÷ 2 ＝ 1.00</text><text x='830' y='226' font-size='26' fill='#5b6675' text-anchor='start'>上位3件の中の順位の違いは見ない</text></g><g><text x='290' y='97' font-size='26' fill='#5b6675' text-anchor='start'>1 / log2(2) = 1.00</text><text x='290' y='179' font-size='26' fill='#5b6675' text-anchor='start'>0</text><text x='290' y='261' font-size='26' fill='#5b6675' text-anchor='start'>1 / log2(4) = 0.50</text><path d='M584 290 L777 335' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='798,340 774,347 779,323' fill='#d9480f'/><text x='690' y='246' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>② 順位ごとに</text><text x='690' y='280' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>重みを付ける</text><rect x='800' y='262' width='760' height='200' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='830' y='314' font-size='34' fill='#1864ab' font-weight='700' text-anchor='start'>NDCG@3</text><text x='1010' y='314' font-size='26' fill='#5b6675' text-anchor='start'>上位ほど重く数える</text><text x='830' y='360' font-size='30' fill='#1d2733' text-anchor='start'>合計 ＝ 1.00 ＋ 0 ＋ 0.50 ＝ 1.50</text><text x='830' y='398' font-size='26' fill='#5b6675' text-anchor='start'>理想の並び（1位と2位が正解）：1.00 ＋ 0.63 ＝ 1.63</text><text x='830' y='442' font-size='30' fill='#2b8a3e' font-weight='700' text-anchor='start'>NDCG@3 ＝ 1.50 ÷ 1.63 ＝ 約0.92</text></g><g><path d='M1180 464 L1180 486' fill='none' stroke='#5b6675' stroke-width='7' stroke-linejoin='round'/><polygon points='1180,508 1168,486 1192,486' fill='#5b6675'/><text x='1210' y='496' font-size='28' fill='#5b6675' font-weight='700' text-anchor='start'>③ 公式の測定では</text><rect x='40' y='510' width='1520' height='110' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='800' y='548' font-size='26' fill='#5b6675' text-anchor='middle'>Microsoft が公開した測定（2023年。顧客企業のデータセット4つ、NDCG@3）</text><text x='800' y='594' font-size='26' fill='#1d2733' font-weight='700' text-anchor='middle'>キーワード 40.6　ベクトル（Ada-002）43.8　ハイブリッド 48.4　セマンティックランカー付き 60.1</text></g></svg>
