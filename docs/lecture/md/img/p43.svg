<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 1600 520" width="1600" height="520" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='30' width='1600' height='520' fill='#ffffff'/><text x='695' y='80' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>回答がよい</text><text x='695' y='116' font-size='26' fill='#5b6675' text-anchor='middle'>回答の物差し（p.40）</text><text x='1285' y='80' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>回答が悪い</text><text x='1285' y='116' font-size='26' fill='#5b6675' text-anchor='middle'>回答の物差し（p.40）</text><text x='230' y='238' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>検索がよい</text><text x='230' y='276' font-size='26' fill='#5b6675' text-anchor='middle'>検索の物差し（p.42）</text><text x='230' y='438' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>検索が悪い</text><text x='230' y='476' font-size='26' fill='#5b6675' text-anchor='middle'>検索の物差し（p.42）</text><g><rect x='420' y='150' width='550' height='180' rx='10' fill='#fff' stroke='#2b8a3e' stroke-width='4'/><text x='695' y='212' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='middle'>① そのまま</text><text x='695' y='262' font-size='26' fill='#5b6675' text-anchor='middle'>検索も回答もよい</text></g><g><rect x='1010' y='150' width='550' height='180' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1285' y='212' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>② 生成の側を見る</text><text x='1285' y='262' font-size='26' fill='#5b6675' text-anchor='middle'>（プロンプト、モデル）</text></g><g><rect x='1010' y='350' width='550' height='180' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4'/><text x='1285' y='412' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>③ 検索の側を見る</text><text x='1285' y='462' font-size='26' fill='#5b6675' text-anchor='middle'>（取り込み、検索方法）</text></g><g><rect x='420' y='350' width='550' height='180' rx='10' fill='#fff' stroke='#d9480f' stroke-width='7'/><text x='695' y='412' font-size='34' fill='#d9480f' font-weight='700' text-anchor='middle'>④ たまたま当たった</text><text x='695' y='462' font-size='26' fill='#5b6675' text-anchor='middle'>（モデルの知識など）</text><text x='695' y='500' font-size='26' fill='#5b6675' text-anchor='middle'>根拠のない回答かもしれない</text></g></svg>
