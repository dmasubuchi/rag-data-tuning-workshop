<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif"><rect x='0' y='0' width='1600' height='600' fill='#ffffff'/><rect x='20' y='100' width='260' height='170' rx='10' fill='#fff' stroke='#5b6675' stroke-width='4'/><text x='150' y='152' font-size='34' fill='#5b6675' font-weight='700' text-anchor='middle'>BM25 の点数</text><text x='150' y='204' font-size='30' fill='#1d2733' text-anchor='middle'>単語の一致で</text><text x='150' y='242' font-size='30' fill='#1d2733' text-anchor='middle'>付いた点数</text><rect x='490' y='20' width='500' height='330' rx='10' fill='#e7f0fa' stroke='#1864ab' stroke-width='4'/><text x='740' y='74' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>プロファイル</text><text x='520' y='126' font-size='26' fill='#1d2733' text-anchor='start'>フィールドの重み（title は 3 倍など）</text><text x='520' y='170' font-size='26' fill='#1d2733' text-anchor='start'>新しさ（freshness）</text><text x='520' y='214' font-size='26' fill='#1d2733' text-anchor='start'>数の大きさ（magnitude）</text><text x='520' y='258' font-size='26' fill='#1d2733' text-anchor='start'>距離（distance）</text><text x='520' y='302' font-size='26' fill='#1d2733' text-anchor='start'>タグの一致（tag）</text><rect x='1130' y='60' width='460' height='260' rx='10' fill='#fff' stroke='#2b8a3e' stroke-width='4'/><text x='1360' y='114' font-size='34' fill='#2b8a3e' font-weight='700' text-anchor='middle'>最終の点数</text><text x='1360' y='164' font-size='30' fill='#1d2733' text-anchor='middle'>上乗せした後の</text><text x='1360' y='202' font-size='30' fill='#1d2733' text-anchor='middle'>点数で並べる</text><g><path d='M282 185 L466 185' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='488,185 466,197 466,173' fill='#1864ab'/><text x='385' y='160' font-size='28' fill='#1864ab' font-weight='700' text-anchor='middle'>① 上乗せ</text></g><g><path d='M992 190 L1106 190' fill='none' stroke='#2b8a3e' stroke-width='7' stroke-linejoin='round'/><polygon points='1128,190 1106,202 1106,178' fill='#2b8a3e'/><text x='1060' y='165' font-size='28' fill='#2b8a3e' font-weight='700' text-anchor='middle'>② 並べる</text></g><g><path d='M740 352 L740 396' fill='none' stroke='#1864ab' stroke-width='7' stroke-linejoin='round'/><polygon points='740,418 728,396 752,396' fill='#1864ab'/><text x='764' y='396' font-size='28' fill='#1864ab' font-weight='700' text-anchor='start'>③ ランカーを使うと</text><rect x='490' y='420' width='500' height='130' rx='10' fill='#fff' stroke='#1864ab' stroke-width='4' stroke-dasharray='14 10'/><text x='740' y='474' font-size='34' fill='#1864ab' font-weight='700' text-anchor='middle'>セマンティックランカー</text><text x='740' y='520' font-size='26' fill='#5b6675' text-anchor='middle'>モデルで並べ直す</text></g><g><path d='M992 485 L1360 485 L1360 344' fill='none' stroke='#d9480f' stroke-width='7' stroke-linejoin='round'/><polygon points='1360,322 1372,344 1348,344' fill='#d9480f'/><text x='1300' y='530' font-size='28' fill='#d9480f' font-weight='700' text-anchor='middle'>④ ランカーのあとにも、もう1回上乗せ</text><text x='1300' y='566' font-size='26' fill='#5b6675' text-anchor='middle'>（freshness などの関数だけが対象）</text><text x='1360' y='258' font-size='26' fill='#5b6675' text-anchor='middle'>ランカーを使うと、</text><text x='1360' y='296' font-size='26' fill='#2b8a3e' text-anchor='middle'>@search.rerankerBoostedScore</text></g></svg>
